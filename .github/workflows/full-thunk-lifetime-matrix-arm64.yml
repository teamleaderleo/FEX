name: Thunk retire-rebind diagnostic ARM64

on:
  push:
    branches: [ci/thunk-rebind-diagnostic-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-rebind:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_SHA: 9eca19ac8743567ce2af7b4c82f2483d97c19b09
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-rebind
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'fex=%s\nfieldwork=%s\ncarrier=%s\n' \
            "$(git -C src rev-parse HEAD)" "$(git -C fieldwork rev-parse HEAD)" "$GITHUB_SHA" > "$R/identity.txt"
          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro
          grep -R -n -E 'Link after re-register|LinkAddress(ToFunction)?|link_address_to_function|re-register' /tmp/repro/fex-full-thunk-pair > "$R/fixture-link-sites.txt" || true
          cat "$R/fixture-link-sites.txt"

      - name: Instrument duplicate registration and retirement
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/FEXCore/Source/Interface/Core/Core.cpp')
          s = p.read_text()

          old = '  auto InsertedIterator = CustomIRHandlers.emplace(Entrypoint, CustomIRHandlerEntry {Handler, Creator, Data});\n  HasCustomIRHandlers = true;\n'
          new = '  auto InsertedIterator = CustomIRHandlers.emplace(Entrypoint, CustomIRHandlerEntry {Handler, Creator, Data});\n  fprintf(stderr, "DIAG_CUSTOM_ADD H=%#lx inserted=%d creator=%p data=%p\\n", Entrypoint, InsertedIterator.second ? 1 : 0, Creator, Data);\n  HasCustomIRHandlers = true;\n'
          if old not in s:
              raise SystemExit('AddCustomIREntrypoint insertion site missing')
          s = s.replace(old, new, 1)

          old = '  CustomIRHandlers.erase(Entrypoint);\n  HasCustomIRHandlers = !CustomIRHandlers.empty();\n  SyscallHandler->InvalidateGuestCodeRange(Thread, Entrypoint, 1);\n'
          new = '  auto Erased = CustomIRHandlers.erase(Entrypoint);\n  fprintf(stderr, "DIAG_CUSTOM_REMOVE H=%#lx erased=%zu\\n", Entrypoint, Erased);\n  HasCustomIRHandlers = !CustomIRHandlers.empty();\n  SyscallHandler->InvalidateGuestCodeRange(Thread, Entrypoint, 1);\n  fprintf(stderr, "DIAG_CUSTOM_INVALIDATED H=%#lx\\n", Entrypoint);\n'
          if old not in s:
              raise SystemExit('RemoveCustomIREntrypoint site missing')
          s = s.replace(old, new, 1)

          old = '''    if (Result->Data != (void*)GuestThunkEntrypoint) {
                // NOTE: This may happen in Vulkan thunks if the Vulkan driver resolves two different symbols
                //       to the same function (e.g. vkGetPhysicalDeviceFeatures2/vkGetPhysicalDeviceFeatures2KHR)
                LogMan::Msg::EFmt("Input address for AddThunkTrampoline is already linked elsewhere");
              }
          '''
          if old not in s:
              old = '''    if (Result->Data != (void*)GuestThunkEntrypoint) {
                // NOTE: This may happen in Vulkan thunks if the Vulkan driver resolves two different symbols
                //       to the same function (e.g. vkGetPhysicalDeviceFeatures2/vkGetPhysicalDeviceFeatures2KHR)
                LogMan::Msg::EFmt("Input address for AddThunkTrampoline is already linked elsewhere");
              }'''
          if old not in s:
              raise SystemExit('duplicate thunk block missing')
          new = '''    if (Result->Data != (void*)GuestThunkEntrypoint) {
                fprintf(stderr, "DIAG_DUP H=%#lx OLD=%p NEW=%#lx\\n", Entrypoint, Result->Data, GuestThunkEntrypoint);
                RemoveCustomIREntrypoint(nullptr, Entrypoint);
                fprintf(stderr, "DIAG_DUP_READD H=%#lx NEW=%#lx\\n", Entrypoint, GuestThunkEntrypoint);
                AddThunkTrampolineIRHandler(Entrypoint, GuestThunkEntrypoint);
                return;
              }'''
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git -C src diff --check
          git -C src diff -- FEXCore/Source/Interface/Core/Core.cpp > "$R/rebind.diff"

      - name: Build diagnostic FEX and full thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-fex.log" 2>&1
          cd /tmp/repro/fex-full-thunk-pair
          make clean
          make HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++ > "$R/build-full-pair.log" 2>&1

      - name: Prepare rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute forced-different reload
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          set +e
          (cd "$ROOTFS/opt/fex-ci/full" && \
            FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$FEX" /opt/fex-ci/full/guest/fex_full_lifetime --force-different) \
            > "$R/rebind.stdout" 2> "$R/rebind.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/rebind.exit"
          grep -E 'DIAG_|generation|reload|re-register|retained|fresh|callback|native host stable' "$R/rebind.stdout" "$R/rebind.stderr" > "$R/key-lines.txt" || true
          cat "$R/key-lines.txt"
          exit 0

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunk-retire-rebind-${{ github.run_id }}
          path: receipts-rebind
          retention-days: 30
