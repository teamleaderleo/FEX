name: Full thunk lifetime matrix ARM64

on:
  push:
    branches: [ci/full-thunk-lifetime-matrix-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifetime-matrix:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_SHA: 9eca19ac8743567ce2af7b4c82f2483d97c19b09
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-full
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'fex=%s\nfieldwork=%s\ncarrier=%s\n' \
            "$(git -C src rev-parse HEAD)" "$(git -C fieldwork rev-parse HEAD)" "$GITHUB_SHA" > "$R/identity.txt"
          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro
          find /tmp/repro -maxdepth 3 -type f -printf '%P\n' | sort > "$R/fixture-files.txt"

      - name: Build exact FEX
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-fex.log" 2>&1
          test -x src/build/Bin/FEX
          test -x src/build/Bin/FEXServer

      - name: Build full real-FEX thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/repro/fex-full-thunk-pair
          make clean
          make HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++ > "$R/build-full-pair.log" 2>&1
          find . -maxdepth 3 -type f -printf '%P\n' | sort > "$R/full-pair-files.txt"
          test -x guest/fex_full_lifetime
          test -d host

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute lifetime matrix
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          run_case() {
            local name="$1"; shift
            set +e
            (cd "$ROOTFS/opt/fex-ci/full" && \
              FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 45s \
              "$FEX" /opt/fex-ci/full/guest/fex_full_lifetime "$@") \
              > "$R/$name.stdout" 2> "$R/$name.stderr"
            local rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
          }
          set -e
          run_case stale-alias --call-stale --alias
          run_case stale-different --call-stale --force-different
          run_case cycles-different --force-different --cycles 5
          run_case pin --pin
          for name in stale-alias stale-different cycles-different pin; do
            printf '%s=' "$name"; cat "$R/$name.exit"
            grep -E 'generation|callback|invoker|unmap|mapping|alias|linked|stale|fresh|cycle|pin|SIG|fault|reserved' "$R/$name.stdout" "$R/$name.stderr" || true
          done > "$R/key-lines.txt"
          cat "$R/key-lines.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-thunk-lifetime-matrix-${{ github.run_id }}
          path: receipts-full
          retention-days: 30
