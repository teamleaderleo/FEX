name: Thunk cache-indexed rebind candidate ARM64

on:
  push:
    branches: [ci/thunk-rebind-diagnostic-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-rebind:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_SHA: 9eca19ac8743567ce2af7b4c82f2483d97c19b09
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-cache-index
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'fex=%s\nfieldwork=%s\ncarrier=%s\n' \
            "$(git -C src rev-parse HEAD)" "$(git -C fieldwork rev-parse HEAD)" "$GITHUB_SHA" > "$R/identity.txt"
          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro

      - name: Apply cache-indexed rebind candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/FEXCore/Source/Interface/Core/LookupCache.h')
          s = p.read_text()
          needle = '    return BlockList.insert_or_assign(Address, BlockEntry {(uintptr_t)HostCode, CodePages}).first->second;'
          replacement = '''    auto& Entry = BlockList.insert_or_assign(Address, BlockEntry {(uintptr_t)HostCode, CodePages}).first->second;
              // Custom-IR blocks have no decoded guest CodePages, but still need a
              // cache-retirement index for RemoveCustomIREntrypoint's range invalidation.
              if (CodePages.empty()) {
                this->CodePages[Address >> 12].push_back(Address);
              }
              return Entry;'''
          if s.count(needle) != 1:
              raise SystemExit(f'shared AddBlockMapping line count={s.count(needle)}')
          s = s.replace(needle, replacement, 1)

          local_old = '''    for (const auto& CodePage : Entry.CodePages) {
              CachedCodePages[CodePage >> 12].insert(Address);
            }'''
          local_new = '''    if (Entry.CodePages.empty()) {
              CachedCodePages[Address >> 12].insert(Address);
            } else {
              for (const auto& CodePage : Entry.CodePages) {
                CachedCodePages[CodePage >> 12].insert(Address);
              }
            }'''
          if s.count(local_old) != 1:
              raise SystemExit(f'local CacheBlockMapping block count={s.count(local_old)}')
          s = s.replace(local_old, local_new, 1)
          p.write_text(s)

          core = Path('src/FEXCore/Source/Interface/Core/Core.cpp')
          s = core.read_text()
          old = '  auto InsertedIterator = CustomIRHandlers.emplace(Entrypoint, CustomIRHandlerEntry {Handler, Creator, Data});\n  HasCustomIRHandlers = true;'
          new = '  auto InsertedIterator = CustomIRHandlers.emplace(Entrypoint, CustomIRHandlerEntry {Handler, Creator, Data});\n  fprintf(stderr, "DIAG_CUSTOM_ADD H=%#lx inserted=%d data=%p\\n", Entrypoint, InsertedIterator.second ? 1 : 0, Data);\n  HasCustomIRHandlers = true;'
          if s.count(old) != 1:
              raise SystemExit(f'custom add site count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '  CustomIRHandlers.erase(Entrypoint);\n  HasCustomIRHandlers = !CustomIRHandlers.empty();\n  SyscallHandler->InvalidateGuestCodeRange(Thread, Entrypoint, 1);'
          new = '  auto Erased = CustomIRHandlers.erase(Entrypoint);\n  HasCustomIRHandlers = !CustomIRHandlers.empty();\n  SyscallHandler->InvalidateGuestCodeRange(Thread, Entrypoint, 1);\n  fprintf(stderr, "DIAG_CUSTOM_REMOVE_RANGE H=%#lx handler=%zu\\n", Entrypoint, Erased);'
          if s.count(old) != 1:
              raise SystemExit(f'custom remove site count={s.count(old)}')
          s = s.replace(old, new, 1)

          fn = s.find('void ContextImpl::AddThunkTrampolineIRHandler')
          if fn < 0:
              raise SystemExit('thunk handler function missing')
          start = s.find('    if (Result->Data != (void*)GuestThunkEntrypoint) {', fn)
          if start < 0:
              raise SystemExit('duplicate block start missing')
          tail = '\n    }\n  }\n}\n\nvoid ContextImpl::AddForceTSOInformation'
          close = s.find(tail, start)
          if close < 0:
              raise SystemExit('duplicate block end missing')
          end = close + len('\n    }')
          new = '''    if (Result->Data != (void*)GuestThunkEntrypoint) {
              fprintf(stderr, "DIAG_DUP H=%#lx OLD=%p NEW=%#lx\\n", Entrypoint, Result->Data, GuestThunkEntrypoint);
              RemoveCustomIREntrypoint(nullptr, Entrypoint);
              AddThunkTrampolineIRHandler(Entrypoint, GuestThunkEntrypoint);
              return;
            }'''
          core.write_text(s[:start] + new + s[end:])
          PY
          git -C src diff --check
          git -C src diff -- FEXCore/Source/Interface/Core/LookupCache.h FEXCore/Source/Interface/Core/Core.cpp > "$R/cache-index.diff"
          cat "$R/cache-index.diff"

      - name: Build candidate FEX and full thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-fex.log" 2>&1
          make -C /tmp/repro/fex-full-thunk-pair clean
          make -C /tmp/repro/fex-full-thunk-pair HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++ > "$R/build-full-pair.log" 2>&1

      - name: Prepare rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute forced-different reload
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          set +e
          (cd "$ROOTFS/opt/fex-ci/full" && FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$FEX" /opt/fex-ci/full/guest/fex_full_lifetime --force-different) > "$R/rebind.stdout" 2> "$R/rebind.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/rebind.exit"
          grep -E 'DIAG_|generation|reload|re-register|retained|fresh|callback|native host stable|signal=|exit=' "$R/rebind.stdout" "$R/rebind.stderr" > "$R/key-lines.txt" || true
          cat "$R/key-lines.txt"
          exit 0

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunk-cache-index-rebind-${{ github.run_id }}
          path: receipts-cache-index
          retention-days: 30
