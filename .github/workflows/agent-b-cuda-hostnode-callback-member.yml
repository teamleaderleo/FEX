name: Agent B CUDA host-node callback_member candidate

on:
  push:
    branches: [ci/agent-b-cuda-hostnode-callback-member-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      PRODUCT_SHA: f3ab82a73fb48271ee12a882c98bc5d823a2b4d1
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host-thunks
      SYNTH: ${{ github.workspace }}/synthetic-cuda
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 8

      - name: Dependencies and exact-product provenance
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST" "$SYNTH"
          git log --oneline -8 | tee "$R/lineage.txt"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git diff --name-only "$PRODUCT_SHA" -- ThunkLibs FEXCore Source | tee "$R/pre-patch-product-source-diff.txt"
          test ! -s "$R/pre-patch-product-source-diff.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev

      - name: Native synthetic CUDA control
        shell: bash
        run: |
          set -euxo pipefail
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,libcuda.so.1 LinuxFieldwork/synthetic_libcuda_hostnode.c \
            -o "$SYNTH/libcuda.so.1"
          cc -O2 -Wall -Wextra -Werror LinuxFieldwork/cuda_hostnode_callback_probe.c -ldl \
            -o "$R/native-probe"
          LD_LIBRARY_PATH="$SYNTH" "$R/native-probe" > "$R/native.stdout" 2> "$R/native.stderr"
          echo $? > "$R/native.exit"
          cat "$R/native.stderr"
          grep -q 'CUDA_HOST_CALLBACK count=1 user=0x12345678' "$R/native.stderr"
          grep -q 'MARK add-return rc=0 node=0xc0de callbacks=1' "$R/native.stderr"

      - name: Apply generic nested callback_member generator to CUDA host-node params
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_nested_callback_member_generator.py
          git checkout "$PRODUCT_SHA" -- ThunkLibs/libdrm/libdrm_interface.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libcuda/libcuda_interface.cpp')
          s = p.read_text()
          old = '''template<>
          struct fex_gen_type<CUDA_HOST_NODE_PARAMS_st> : fexgen::opaque_type {};
          '''
          new = '''template<>
          struct fex_gen_type<CUDA_HOST_NODE_PARAMS_st> {};
          template<>
          struct fex_gen_config<&CUDA_HOST_NODE_PARAMS_st::_0> : fexgen::callback_member {};
          '''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/Generator ThunkLibs/include/common/GeneratorInterface.h ThunkLibs/libcuda/libcuda_interface.cpp \
            | tee "$R/cuda-callback-member.diff"
          test "$(git diff --name-only -- ThunkLibs FEXCore Source | sort | tr '\n' ' ')" = \
            'ThunkLibs/Generator/analysis.cpp ThunkLibs/Generator/analysis.h ThunkLibs/Generator/gen.cpp ThunkLibs/include/common/GeneratorInterface.h ThunkLibs/libcuda/libcuda_interface.cpp '

      - name: Build generated CUDA callback_member candidate
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer cuda-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 260 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libcuda-host.so "$HOST/libcuda-host.so"

          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest-build --target cuda-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 260 "$R/build-guest.log"; exit 1; }

      - name: Prove generated CUDA nested callback code shape
        shell: bash
        run: |
          set -euxo pipefail
          guest_inl="$(find guest-build -name 'thunkgen_guest_libcuda.inl' -print -quit)"
          host_inl="$(find build -name 'thunkgen_host_libcuda.inl' -print -quit)"
          test -n "$guest_inl"; test -n "$host_inl"
          grep -n -E 'fex_callback_copy_|AllocateHostTrampolineForGuestFunction\(a_[0-9]+->_0\)' "$guest_inl" \
            | tee "$R/generated-guest-markers.txt"
          grep -n -E 'fex_callback_[0-9]+__0|FinalizeHostTrampolineForGuestFunction\(fex_callback_[0-9]+__0\)' "$host_inl" \
            | tee "$R/generated-host-markers.txt"
          grep -q 'fex_callback_copy_' "$R/generated-guest-markers.txt"
          grep -q 'FinalizeHostTrampolineForGuestFunction' "$R/generated-host-markers.txt"

      - name: Prepare amd64 rootfs and guest probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-build/libcuda-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libcuda.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror LinuxFieldwork/cuda_hostnode_callback_probe.c -ldl \
            -o "$ROOTFS/opt/fex-ci/cuda-hostnode-probe"

      - name: Execute generated CUDA callback_member candidate
        shell: bash
        run: |
          set -uxo pipefail
          set +e
          LD_LIBRARY_PATH="$SYNTH" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$GITHUB_WORKSPACE/build/Bin/FEX" /opt/fex-ci/cuda-hostnode-probe \
            > "$R/candidate.stdout" 2> "$R/candidate.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/candidate.exit"
          printf 'native=%s\npristine_reference=132\ngenerated_candidate=%s\n' "$(cat "$R/native.exit")" "$rc" \
            | tee "$R/final-matrix.txt"
          cat "$R/candidate.stderr"
          test "$rc" -eq 0
          grep -q 'SYNTH_CUDA_ADD' "$R/candidate.stderr"
          grep -q 'CUDA_HOST_CALLBACK count=1 user=0x12345678' "$R/candidate.stderr"
          grep -q 'MARK add-return rc=0 node=0xc0de callbacks=1' "$R/candidate.stderr"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-cuda-hostnode-callback-member-${{ github.run_id }}
          path: receipts
          retention-days: 30
