name: Integrated resident Vulkan allocator callbacks v2

on:
  push:
    branches: [ci/integration-resident-vulkan-allocators-20260814]
    paths: [.github/workflows/integration-resident-vulkan-allocators-v2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vulkan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BASE: 48e28a2ce9da1334feb8d7b77dbade66efa24be2
      ALLOC_CARRIER: 669220a85abf80e34599696dbf102788956e726b
      OUTPUT_BRANCH: integration/per-library-resident-bridges-vulkan-allocators-20260814
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/integrated-v2-receipts
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: probe/fex-vulkan-customir-retirement
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and controls
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE" -- ThunkLibs FEXCore Source)"
          git fetch origin "$ALLOC_CARRIER"
          git show "$ALLOC_CARRIER":LinuxFieldwork/vk_allocator_custom_host_matrix.c > /tmp/allocator-matrix.c
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers binutils glslang-tools
          cat >"$R/min.comp" <<'EOF'
          #version 450
          layout(local_size_x = 1) in;
          void main() {}
          EOF
          glslangValidator -V -S comp "$R/min.comp" -o "$R/min.comp.spv"
          cc -O0 -g -Wall -Wextra -Werror /tmp/allocator-matrix.c -ldl -o "$R/native-probe"
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          VK_DRIVER_FILES="$ICD" timeout 30s "$R/native-probe" "$R/min.comp.spv" >"$R/native.out" 2>"$R/native.err"
          grep -q 'PASS custom-host allocator forwarding matrix' "$R/native.err"
          cat "$R/native.err"

      - name: Compose source candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old); assert n==1,(path,n,old[:120]); p.write_text(s.replace(old,new,1))

          gen=Path('ThunkLibs/Generator/gen.cpp')
          s=gen.read_text()
          helper='''      auto get_type_name_with_nonconst_pointee = [&](clang::QualType type) {\n        type = type.getLocalUnqualifiedType();\n        if (type->isPointerType()) {\n          // Strip away "const" from pointee type\n          type = context.getPointerType(type->getPointeeType().getLocalUnqualifiedType());\n        }\n        return get_type_name(context, type.getTypePtr());\n      };\n\n\n'''
          assert s.count(helper)==1
          s=s.replace(helper,'',1)
          old='get_type_name_with_nonconst_pointee(param_type)'
          assert s.count(old)==1
          s=s.replace(old,'get_type_name(context, param_type.getTypePtr())',1)
          gen.write_text(s)

          one('ThunkLibs/libvulkan/libvulkan_interface.cpp',
              '''// TODO: Should not be opaque, but it's usually NULL anyway. Supporting the contained function pointers will need more work.\ntemplate<>\nstruct fex_gen_type<VkAllocationCallbacks> : fexgen::opaque_type {};''',
              '''// Generate ABI conversion for Vulkan allocation callback members.\ntemplate<> struct fex_gen_type<VkSystemAllocationScope> {};\ntemplate<> struct fex_gen_type<VkInternalAllocationType> {};\ntemplate<> struct fex_gen_type<VkAllocationCallbacks> {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pUserData> : fexgen::custom_repack {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pfnAllocation> : fexgen::callback_member {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pfnReallocation> : fexgen::callback_member {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pfnFree> : fexgen::callback_member {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pfnInternalAllocation> : fexgen::callback_member {};\ntemplate<> struct fex_gen_config<&VkAllocationCallbacks::pfnInternalFree> : fexgen::callback_member {};''')

          one('ThunkLibs/libvulkan/Host.cpp',
              '''static void fexfn_impl_libvulkan_Vulkan_SetGuestXDisplayString(uintptr_t GuestTarget, uintptr_t GuestUnpacker) {\n  MakeHostTrampolineForGuestFunctionAt(GuestTarget, GuestUnpacker, &x11_manager.GuestXDisplayString);\n}\n''',
              '''static void fexfn_impl_libvulkan_Vulkan_SetGuestXDisplayString(uintptr_t GuestTarget, uintptr_t GuestUnpacker) {\n  MakeHostTrampolineForGuestFunctionAt(GuestTarget, GuestUnpacker, &x11_manager.GuestXDisplayString);\n}\n\nvoid fex_custom_repack_entry(host_layout<VkAllocationCallbacks>& into, const guest_layout<VkAllocationCallbacks>& from) {\n  into.data.pUserData = const_cast<void*>(from.data.pUserData.force_get_host_pointer());\n}\n\nbool fex_custom_repack_exit(guest_layout<VkAllocationCallbacks>&, const host_layout<VkAllocationCallbacks>&) {\n  return true;\n}\n''')

          p=Path('ThunkLibs/libvulkan/Host.cpp'); s=p.read_text()
          repl={
            'return LDR_PTR(vkCreateShaderModule)(a_0, a_1, nullptr, a_3);':'return LDR_PTR(vkCreateShaderModule)(a_0, a_1, a_2, a_3);',
            'auto ret = LDR_PTR(vkCreateInstance)(vk_struct_base, nullptr, &out);':'auto ret = LDR_PTR(vkCreateInstance)(vk_struct_base, a_1, &out);',
            'auto ret = LDR_PTR(vkCreateDevice)(a_0, a_1, nullptr, &out);':'auto ret = LDR_PTR(vkCreateDevice)(a_0, a_1, a_2, &out);',
            'return LDR_PTR(vkAllocateMemory)(a_0, a_1, nullptr, a_3);':'return LDR_PTR(vkAllocateMemory)(a_0, a_1, a_2, a_3);',
            'LDR_PTR(vkFreeMemory)(a_0, a_1, nullptr);':'LDR_PTR(vkFreeMemory)(a_0, a_1, a_2);',
            'return LDR_PTR(vkCreateDebugReportCallbackEXT)(a_0, &overridden_callback, nullptr, a_3);':'return LDR_PTR(vkCreateDebugReportCallbackEXT)(a_0, &overridden_callback, a_2, a_3);',
            'LDR_PTR(vkDestroyDebugReportCallbackEXT)(a_0, a_1, nullptr);':'LDR_PTR(vkDestroyDebugReportCallbackEXT)(a_0, a_1, a_2);',
            'return LDR_PTR(vkCreateDebugUtilsMessengerEXT)(a_0, &overridden_callback, nullptr, a_3);':'return LDR_PTR(vkCreateDebugUtilsMessengerEXT)(a_0, &overridden_callback, a_2, a_3);',
          }
          for old,new in repl.items(): assert s.count(old)==1,(old,s.count(old)); s=s.replace(old,new,1)
          p.write_text(s)

          one('ThunkLibs/libvulkan/Guest.cpp',
              '''#include "thunkgen_bridge_accessors_libvulkan.inl"\n#include "thunkgen_guest_libvulkan.inl"''',
              '''#include "thunkgen_bridge_accessors_libvulkan.inl"\n\n#define AllocateHostTrampolineForGuestFunction FEXAllocateResidentHostTrampolineForGuestFunction\n#include "thunkgen_guest_libvulkan.inl"\n#undef AllocateHostTrampolineForGuestFunction''')
          PY
          git diff --check
          git diff "$BASE" -- ThunkLibs >"$R/source.diff"
          test -s "$R/source.diff"
          grep -n 'FEXAllocateResidentHostTrampolineForGuestFunction' ThunkLibs/libvulkan/Guest.cpp | tee "$R/resident-route.txt"
          grep -nE 'vkCreateShaderModule\)\(a_0, a_1, a_2, a_3\)|vkCreateInstance\)\(vk_struct_base, a_1, &out\)|vkCreateDevice\)\(a_0, a_1, a_2, &out\)|vkAllocateMemory\)\(a_0, a_1, a_2, a_3\)|vkFreeMemory\)\(a_0, a_1, a_2\)|vkCreateDebugReportCallbackEXT\)\(a_0, &overridden_callback, a_2, a_3\)|vkDestroyDebugReportCallbackEXT\)\(a_0, a_1, a_2\)|vkCreateDebugUtilsMessengerEXT\)\(a_0, &overridden_callback, a_2, a_3\)' ThunkLibs/libvulkan/Host.cpp | tee "$R/forward-sites.txt"
          test "$(wc -l <"$R/forward-sites.txt")" -eq 8

      - name: Build common libraries with integrated generator
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer vulkan-host-64 cuda-host-64 wayland-client-host-64 -- -j"$(nproc)" >"$R/build-host.log" 2>&1 || { tail -n 420 "$R/build-host.log"; exit 1; }
          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest vulkan_bridge-guest cuda-guest cuda_bridge-guest wayland-client-guest wayland-client_bridge-guest -- -j"$(nproc)" >"$R/build-guest.log" 2>&1 || { tail -n 480 "$R/build-guest.log"; exit 1; }

      - name: Verify generation and ELF ownership
        shell: bash
        run: |
          set -euxo pipefail
          normal=guest/gen/thunkgen_guest_libvulkan.inl
          bridge=guest/gen/thunkgen_bridge_libvulkan.inl
          accessors=guest/gen/thunkgen_bridge_accessors_libvulkan.inl
          n="$(grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' "$normal")"; b="$(grep -Ec 'FEX_BRIDGE_ROLE' "$bridge")"
          printf 'normal=%s\nbridge_roles=%s\n' "$n" "$b" | tee "$R/signatures.txt"
          test "$n" -eq 480; test "$b" -eq 480
          for f in pfnAllocation pfnReallocation pfnFree pfnInternalAllocation pfnInternalFree; do grep -F ".$f = AllocateHostTrampolineForGuestFunction(" "$normal"; done
          host_inl="$(find build -name thunkgen_host_libvulkan.inl -print -quit)"; test -n "$host_inl"; echo "$host_inl" >"$R/host-inl-path.txt"
          grep -F 'FinalizeHostTrampolineForGuestFunction(fex_callback_' "$host_inl" | head -n 8 | tee "$R/finalizers.txt"
          grep -E 'make_repack_wrapper<.*const .*VkAllocationCallbacks' "$host_inl" | head -n 2 | tee "$R/const-wrapper.txt"
          grep -F 'FEXResidentBridgeUnpacker' "$accessors" >/dev/null
          readelf -d guest/libvulkan-guest.so >"$R/wrapper.dynamic"; readelf -d guest/libfex-vulkan-bridge.so >"$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          grep -q 'NEEDED.*libfex-vulkan-bridge.so' "$R/wrapper.dynamic"
          grep -q 'RUNPATH.*\$ORIGIN' "$R/wrapper.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"

      - name: Prepare amd64 runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >"$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"; trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"; docker export "$cid" | tar -C "$ROOTFS" -xf -; docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp guest/libfex-vulkan-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void*d,int x){(void)d;(void)x;return 0;} void*XGetVisualInfo(void*d,long m,void*t,int*n){(void)d;(void)m;(void)t;if(n)*n=0;return 0;} char*XDisplayString(void*d){(void)d;static char s[]=":0";return s;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          x86_64-linux-gnu-gcc -O0 -g -Wall -Wextra -Werror /tmp/allocator-matrix.c -ldl -o "$ROOTFS/opt/fex-ci/allocator"
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_pfn_unload_probe.c -ldl -o "$ROOTFS/opt/fex-ci/pfn"
          cp "$R/min.comp.spv" "$ROOTFS/opt/fex-ci/min.comp.spv"

      - name: Run allocator and PFN lifetime on one candidate
        shell: bash
        run: |
          set -uxo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          run(){ tag="$1"; shift; set +e; VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$GITHUB_WORKSPACE/build/HostLibs_64" timeout 30s "$GITHUB_WORKSPACE/build/Bin/FEX" "$@" >"$R/$tag.out" 2>"$R/$tag.err"; rc=$?; set -e; echo "$rc" >"$R/$tag.exit"; cat "$R/$tag.err"; return "$rc"; }
          run allocator /opt/fex-ci/allocator /opt/fex-ci/min.comp.spv
          grep -q 'PASS custom-host allocator forwarding matrix' "$R/allocator.err"
          grep -E -q 'DEVICE_CREATE_RETURN result=0 alloc_delta=[1-9]' "$R/allocator.err"
          grep -E -q 'MEM_ALLOC_RETURN result=0 alloc_delta=[1-9]' "$R/allocator.err"
          grep -E -q 'SHADER_CREATE_RETURN result=0 alloc_delta=[1-9]' "$R/allocator.err"
          run pfn-close /opt/fex-ci/pfn close
          run pfn-reload /opt/fex-ci/pfn reload
          grep -q 'PROBE return where=after-real-close result=0' "$R/pfn-close.err"
          grep -q 'PROBE acquired generation=2' "$R/pfn-reload.err"
          grep -q 'same-pfn=1' "$R/pfn-reload.err"
          grep -q 'PROBE return where=after-reload-new-pfn result=0' "$R/pfn-reload.err"
          printf 'allocator=%s\npfn_close=%s\npfn_reload=%s\nOUTCOME=resident_bridge_plus_generated_vulkan_allocators_passed\n' "$(cat "$R/allocator.exit")" "$(cat "$R/pfn-close.exit")" "$(cat "$R/pfn-reload.exit")" | tee "$R/final-matrix.txt"

      - name: Materialize source-only branch
        shell: bash
        run: |
          set -euxo pipefail
          git diff --binary "$BASE" -- ThunkLibs >/tmp/candidate.patch
          cp /tmp/candidate.patch "$R/source-only.patch"
          git reset --hard "$BASE"
          git checkout -B "$OUTPUT_BRANCH" "$BASE"
          git apply --index /tmp/candidate.patch
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -v '^ThunkLibs/' || true)"
          git config user.name Leo; git config user.email cheerleaderleo@outlook.com
          git commit -m 'Research: integrate resident Vulkan allocator callbacks'
          git rev-parse HEAD | tee "$R/integration-commit.txt"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-resident-vulkan-v2-${{ github.run_id }}
          path: integrated-v2-receipts
          retention-days: 30
