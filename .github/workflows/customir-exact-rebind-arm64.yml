name: CustomIR exact rebind conservative-feature A/B

on:
  push:
    branches: [codex/customir-exact-rebind]
    paths:
      - .github/workflows/customir-exact-rebind-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebind-ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: current-base
            source_sha: f1f1e6a36af0b7d5e194260a94a1666b899b0097
          - variant: exact-entry
            source_sha: 93fe514dc2b96c76fdc55614e4ef5f24fa1851ba
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      FIELDWORK_SHA: 9eca19ac8743567ce2af7b4c82f2483d97c19b09
      ROOTFS: ${{ github.workspace }}/rootfs-amd64-${{ matrix.variant }}
      RECEIPTS: ${{ github.workspace }}/receipts-${{ matrix.variant }}
      FEX_PORTABLE: 1
      # GitHub's hosted ARM VM advertises LRCPC2 but trapped the emitted LDAPUR
      # path. Keep TSO enabled and select FEX's conservative fallback codegen.
      FEX_HOSTFEATURES: disablelrcpc,disablelrcpc2
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out exact product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Check out retained synthetic fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Verify provenance and unpack fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RECEIPTS"
          test "$(git -C src rev-parse HEAD)" = "$SOURCE_SHA"
          git -C src rev-parse HEAD | tee "$RECEIPTS/source-sha.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu gdb
          base64 -d \
            fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 \
            > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/repro/fex-full-thunk-pair/guest/main.cpp")
          text = path.read_text(encoding="utf-8")
          needle = "int main(int argc, char** argv) {\n"
          replacement = needle + "  std::setvbuf(stdout, nullptr, _IONBF, 0);\n"
          if text.count(needle) != 1:
              raise SystemExit(f"expected one fixture main, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Build FEX and the retained thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$RECEIPTS/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v \
            > "$RECEIPTS/build-fex.log" 2>&1 \
            || { tail -n 520 "$RECEIPTS/build-fex.log"; exit 1; }
          make -C /tmp/repro/fex-full-thunk-pair clean
          make -C /tmp/repro/fex-full-thunk-pair \
            HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++ \
            > "$RECEIPTS/build-full-pair.log" 2>&1

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$RECEIPTS/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Run normally and capture a host backtrace on failure
        shell: bash
        run: |
          set -uxo pipefail
          fex="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          host="/tmp/repro/fex-full-thunk-pair/host"
          guest="/opt/fex-ci/full/guest/fex_full_lifetime"

          set +e
          (cd "$ROOTFS/opt/fex-ci/full" && \
            FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$host" timeout 30s \
            "$fex" "$guest" --force-different) \
            > "$RECEIPTS/rebind.stdout" 2> "$RECEIPTS/rebind.stderr"
          rc=$?
          set -e
          echo "$rc" | tee "$RECEIPTS/rebind.exit"
          grep -E 'generation|reload|re-register|retained|fresh|callback|native host stable' \
            "$RECEIPTS/rebind.stdout" "$RECEIPTS/rebind.stderr" \
            > "$RECEIPTS/key-lines.txt" || true
          cat "$RECEIPTS/key-lines.txt"

          if [ "$rc" -ne 0 ]; then
            set +e
            (cd "$ROOTFS/opt/fex-ci/full" && \
              FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$host" timeout 40s \
              gdb -q -batch \
                -ex 'set pagination off' \
                -ex 'set confirm off' \
                -ex 'handle SIGILL stop print nopass' \
                -ex 'handle SIGBUS stop print nopass' \
                -ex 'handle SIGSEGV stop print nopass' \
                -ex run \
                -ex 'info registers' \
                -ex 'info proc mappings' \
                -ex 'x/12i $pc' \
                -ex 'thread apply all bt full' \
                --args "$fex" "$guest" --force-different) \
              > "$RECEIPTS/gdb.txt" 2>&1
            gdb_rc=$?
            set -e
            echo "$gdb_rc" | tee "$RECEIPTS/gdb.exit"
            test -s "$RECEIPTS/gdb.txt"
          fi

          if [ "$rc" -ne 0 ]; then
            echo "${{ matrix.variant }}_UNEXPECTED_RUNTIME_FAILURE_CAPTURED" | tee "$RECEIPTS/gate.txt"
            exit 1
          elif [ "${{ matrix.variant }}" = current-base ]; then
            grep -q 'reload invoker.*DIFFERENT' "$RECEIPTS/rebind.stdout"
            grep -q 'native host stable' "$RECEIPTS/rebind.stdout"
            grep -q 'fresh/current callback.*rv=10010053 want=10010053' "$RECEIPTS/rebind.stdout"
            grep -q 'child Link after re-register.*signal=11' "$RECEIPTS/rebind.stdout"
            echo CURRENT_BASE_REBIND_NEGATIVE_OK | tee "$RECEIPTS/gate.txt"
          else
            grep -q 'reload invoker.*DIFFERENT' "$RECEIPTS/rebind.stdout"
            grep -q 'native host stable' "$RECEIPTS/rebind.stdout"
            grep -q 'fresh/current callback.*rv=10010053 want=10010053' "$RECEIPTS/rebind.stdout"
            grep -q 'child Link after re-register.*rv=1001035' "$RECEIPTS/rebind.stdout"
            grep -q 'child Link after re-register.*exit=0' "$RECEIPTS/rebind.stdout"
            echo EXACT_ENTRY_REBIND_OK | tee "$RECEIPTS/gate.txt"
          fi

      - name: Upload exact-head diagnostic receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customir-rebind-${{ matrix.variant }}-${{ github.run_id }}
          path: receipts-${{ matrix.variant }}
          retention-days: 30
