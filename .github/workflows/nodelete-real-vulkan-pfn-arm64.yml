name: NODELETE real Vulkan PFN lifetime

on:
  push:
    branches: [ci/nodelete-guest-thunk-policy-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-vulkan-pfn:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts
      H: ${{ github.workspace }}/host
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and native Vulkan control
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools binutils
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP"
          echo "$LVP" > "$R/lvp.txt"
          VK_DRIVER_FILES="$LVP" vulkaninfo --summary > "$R/native-vulkaninfo.out" 2> "$R/native-vulkaninfo.err"
          git rev-parse HEAD | tee "$R/fex-candidate-sha.txt"
          git diff --check

      - name: Build FEX runtime and Vulkan host thunk
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1 || { tail -n 240 "$R/build-host.log"; exit 1; }
          test -x build/Bin/FEX
          test -f build/HostLibs_64/libvulkan-host.so
          cp build/HostLibs_64/libvulkan-host.so "$H/libvulkan-host.so"

      - name: Build candidate Vulkan guest thunk
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ > "$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1 || { tail -n 240 "$R/build-guest.log"; exit 1; }
          test -f guest/libvulkan-guest.so
          file guest/libvulkan-guest.so | tee "$R/guest-file.txt"
          readelf -d guest/libvulkan-guest.so | tee "$R/guest-dynamic.txt"
          grep -q 'FLAGS_1.*NODELETE' "$R/guest-dynamic.txt"
          grep -Fq 'SONAME)             Library soname: [libvulkan.so.1]' "$R/guest-dynamic.txt"

      - name: Create amd64 rootfs and retained PFN probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat > /tmp/x11stub.c <<'EOF'
          int XSync(void *display, int discard) { (void)display; (void)discard; return 0; }
          void *XGetVisualInfo(void *display, long mask, void *templ, int *count) {
            (void)display; (void)mask; (void)templ; if (count) *count = 0; return 0;
          }
          const char *XDisplayString(void *display) { (void)display; return ":0"; }
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat > /tmp/pfn.c <<'EOF'
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          typedef int32_t VkResult;
          typedef void (*PFN_vkVoidFunction)(void);
          typedef PFN_vkVoidFunction (*PFN_vkGetInstanceProcAddr)(void *, const char *);
          typedef VkResult (*PFN_vkEnumerateInstanceVersion)(uint32_t *);

          static int mapped(void *p) {
            FILE *f = fopen("/proc/self/maps", "r");
            char line[512];
            uintptr_t x = (uintptr_t)p;
            if (!f) return -1;
            while (fgets(line, sizeof(line), f)) {
              unsigned long a, b;
              if (sscanf(line, "%lx-%lx", &a, &b) == 2 && x >= a && x < b) {
                fprintf(stderr, "MAP %p %s", p, line);
                fclose(f);
                return 1;
              }
            }
            fclose(f);
            fprintf(stderr, "UNMAPPED %p\n", p);
            return 0;
          }

          int main(void) {
            void *vulkan = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!vulkan) { fprintf(stderr, "DLERROR %s\n", dlerror()); return 2; }
            PFN_vkGetInstanceProcAddr gipa = (PFN_vkGetInstanceProcAddr)dlsym(vulkan, "vkGetInstanceProcAddr");
            if (!gipa) return 3;
            PFN_vkEnumerateInstanceVersion pfn = (PFN_vkEnumerateInstanceVersion)gipa(NULL, "vkEnumerateInstanceVersion");
            if (!pfn) return 4;
            uint32_t before = 0, after = 0;
            VkResult r1 = pfn(&before);
            fprintf(stderr, "BEFORE_CLOSE gipa=%p pfn=%p result=%d version=%u\n", (void *)gipa, (void *)pfn, r1, before);
            mapped((void *)gipa);
            if (r1 != 0) return 5;
            if (dlclose(vulkan) != 0) { fprintf(stderr, "DLCLOSE_ERROR %s\n", dlerror()); return 6; }
            fprintf(stderr, "AFTER_DLCLOSE\n");
            if (mapped((void *)gipa) != 1) return 7;
            VkResult r2 = pfn(&after);
            fprintf(stderr, "AFTER_CLOSE_CALL pfn=%p result=%d version=%u\n", (void *)pfn, r2, after);
            if (r2 != 0 || after != before) return 8;
            void *again = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!again) return 9;
            PFN_vkGetInstanceProcAddr gipa2 = (PFN_vkGetInstanceProcAddr)dlsym(again, "vkGetInstanceProcAddr");
            fprintf(stderr, "REOPEN gipa_old=%p gipa_new=%p\n", (void *)gipa, (void *)gipa2);
            if (gipa2 != gipa) return 10;
            dlclose(again);
            fprintf(stderr, "REAL_NODELETE_VULKAN_PFN_OK\n");
            return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/pfn.c -ldl -o "$ROOTFS/opt/fex-ci/pfn"
          file "$ROOTFS/opt/fex-ci/pfn" "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1" > "$R/x86-files.txt"

      - name: Run real retained PFN lifecycle
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/build/Bin/FEX"
          LVP="$(cat "$R/lvp.txt")"
          set +e
          VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" \
            "$FEX" /opt/fex-ci/pfn > "$R/pfn.out" 2> "$R/pfn.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/pfn.exit"
          cat "$R/pfn.err"
          test "$rc" -eq 0
          grep -q 'REAL_NODELETE_VULKAN_PFN_OK' "$R/pfn.err"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodelete-real-vulkan-pfn-${{ github.run_id }}
          path: receipts
          retention-days: 30
