name: Vulkan derived resident bridge runtime

on:
  push:
    branches: [diagnostic/thunkgen-guest-bridge-output]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts-runtime
      H: ${{ github.workspace }}/host-runtime
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb x11-utils binutils

      - name: Build FEX host and full derived bridge
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build build --target FEXServer vulkan-host-64 -- -j"$(nproc)" \
            >"$R/build-host.log" 2>&1
          cp build/HostLibs_64/libvulkan-host.so "$H/libvulkan-host.so"

          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan_bridge-guest vulkan-guest -- -j"$(nproc)" \
            >"$R/build-guest.log" 2>&1 || { tail -n 240 "$R/build-guest.log"; exit 1; }

          count_source="$(grep -c 'MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libvulkan.inl)"
          count_bridge="$(grep -c 'MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libvulkan_bridge.inl)"
          echo "SOURCE_SIGNATURES=$count_source" | tee "$R/signature-count.txt"
          echo "BRIDGE_SIGNATURES=$count_bridge" | tee -a "$R/signature-count.txt"
          test "$count_source" -eq "$count_bridge"

          stat -c 'BRIDGE_FILE_BYTES=%s' guest/libfex-vulkan-bridge.so | tee "$R/bridge-size.txt"
          readelf -lW guest/libfex-vulkan-bridge.so >"$R/bridge-program-headers.txt"
          readelf -d guest/libvulkan-guest.so >"$R/vulkan.dynamic"
          readelf -d guest/libfex-vulkan-bridge.so >"$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/vulkan.dynamic"
          grep -q 'NEEDED.*libfex-vulkan-bridge.so' "$R/vulkan.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"

      - name: Build amd64 rootfs
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >/dev/null
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp guest/libfex-vulkan-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-vulkan-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11stub.c <<'EOF'
          #include <stdio.h>
          int XSync(void *display, int discard) { fprintf(stderr,"GUEST_XSYNC display=%p discard=%d\n",display,discard); return 0; }
          void *XGetVisualInfo(void *display,long mask,void *templ,int *count) { fprintf(stderr,"GUEST_XGETVISUALINFO display=%p mask=%ld\n",display,mask); (void)templ; if(count)*count=0; return 0; }
          char *XDisplayString(void *display) { fprintf(stderr,"GUEST_XDISPLAYSTRING display=%p\n",display); return ":99"; }
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,libX11.so.6 /tmp/x11stub.c \
            -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

      - name: Build PFN probe
        run: |
          cat >/tmp/pfn.c <<'EOF'
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef void (*PFN)(void); typedef PFN (*GIPA)(void*,const char*); typedef int32_t (*ENUMVER)(uint32_t*);
          static int mapped(void*p){FILE*f=fopen("/proc/self/maps","r");char l[512];uintptr_t x=(uintptr_t)p;if(!f)return -1;while(fgets(l,sizeof(l),f)){unsigned long a,b;if(sscanf(l,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){fclose(f);return 1;}}fclose(f);return 0;}
          static int maps_name(const char*n){FILE*f=fopen("/proc/self/maps","r");char l[512];int c=0;if(!f)return -1;while(fgets(l,sizeof(l),f))if(strstr(l,n))++c;fclose(f);return c;}
          int main(void){void*h=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);if(!h)return 2;GIPA g=(GIPA)dlsym(h,"vkGetInstanceProcAddr");ENUMVER p=(ENUMVER)g(0,"vkEnumerateInstanceVersion");uint32_t a=0,b=0;if(!g||!p||p(&a))return 3;fprintf(stderr,"DERIVED_PFN_BEFORE gipa=%p H=%p bridge_maps=%d\n",(void*)g,(void*)p,maps_name("libfex-vulkan-bridge.so"));if(dlclose(h))return 4;fprintf(stderr,"DERIVED_PFN_AFTER_CLOSE gipa_mapped=%d bridge_maps=%d\n",mapped((void*)g),maps_name("libfex-vulkan-bridge.so"));if(mapped((void*)g)!=0)return 5;if(p(&b)||b!=a)return 6;fprintf(stderr,"DERIVED_PFN_OK version=%u\n",b);return 0;}
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/pfn.c -ldl -o "$ROOTFS/opt/fex-ci/pfn"

      - name: Build X11 callback probe
        run: |
          cat >/tmp/x11.c <<'EOF'
          #define VK_USE_PLATFORM_XLIB_KHR
          #include <vulkan/vulkan.h>
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          static int mapped(void*p){FILE*f=fopen("/proc/self/maps","r");char l[512];uintptr_t x=(uintptr_t)p;if(!f)return -1;while(fgets(l,sizeof(l),f)){unsigned long a,b;if(sscanf(l,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){fclose(f);return 1;}}fclose(f);return 0;}
          int main(void){void*h=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);if(!h)return 2;PFN_vkGetInstanceProcAddr g=(PFN_vkGetInstanceProcAddr)dlsym(h,"vkGetInstanceProcAddr");PFN_vkCreateInstance create=(PFN_vkCreateInstance)g(VK_NULL_HANDLE,"vkCreateInstance");if(!g||!create)return 3;const char*exts[]={VK_KHR_SURFACE_EXTENSION_NAME,VK_KHR_XLIB_SURFACE_EXTENSION_NAME};VkApplicationInfo ai={.sType=VK_STRUCTURE_TYPE_APPLICATION_INFO,.pApplicationName="derived",.apiVersion=VK_API_VERSION_1_0};VkInstanceCreateInfo ci={.sType=VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,.pApplicationInfo=&ai,.enabledExtensionCount=2,.ppEnabledExtensionNames=exts};VkInstance inst=VK_NULL_HANDLE;if(create(&ci,0,&inst)!=VK_SUCCESS)return 4;PFN_vkEnumeratePhysicalDevices en=(PFN_vkEnumeratePhysicalDevices)g(inst,"vkEnumeratePhysicalDevices");PFN_vkGetPhysicalDeviceXlibPresentationSupportKHR xp=(PFN_vkGetPhysicalDeviceXlibPresentationSupportKHR)g(inst,"vkGetPhysicalDeviceXlibPresentationSupportKHR");uint32_t n=0;if(!en||!xp||en(inst,&n,0)!=VK_SUCCESS||!n)return 5;VkPhysicalDevice*p=calloc(n,sizeof(*p));if(!p)return 6;if(en(inst,&n,p)!=VK_SUCCESS)return 7;fprintf(stderr,"DERIVED_X11_BEFORE gipa=%p xlib=%p\n",(void*)g,(void*)xp);(void)xp(p[0],0,(Display*)(uintptr_t)0x12345000,0);if(dlclose(h))return 8;fprintf(stderr,"DERIVED_X11_AFTER_CLOSE gipa_mapped=%d\n",mapped((void*)g));if(mapped((void*)g)!=0)return 9;fprintf(stderr,"DERIVED_X11_CALLBACK_BEGIN\n");VkBool32 r=xp(p[0],0,(Display*)(uintptr_t)0x12346000,0);fprintf(stderr,"DERIVED_X11_CALLBACK_RETURN result=%u\n",r);fprintf(stderr,"DERIVED_X11_OK\n");free(p);return 0;}
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/x11.c -ldl -o "$ROOTFS/opt/fex-ci/x11"

      - name: Build moved reload probe
        run: |
          cat >/tmp/moved.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mman.h>
          #ifndef MAP_FIXED_NOREPLACE
          #define MAP_FIXED_NOREPLACE 0x100000
          #endif
          typedef void(*PFN)(void);typedef PFN(*GIPA)(void*,const char*);typedef int32_t(*ENUMVER)(uint32_t*);struct range{uintptr_t a,b;};
          static int collect(void*needle,struct range*out,int cap){FILE*f=fopen("/proc/self/maps","r");char l[1024],path[512]={0};uintptr_t x=(uintptr_t)needle;if(!f)return -1;while(fgets(l,sizeof(l),f)){unsigned long a,b;char p[512]={0};if(sscanf(l,"%lx-%lx %*s %*s %*s %*s %511s",&a,&b,p)==3&&x>=a&&x<b){snprintf(path,sizeof(path),"%s",p);break;}}if(!path[0]){fclose(f);return -2;}rewind(f);int n=0;while(fgets(l,sizeof(l),f)){unsigned long a,b;char p[512]={0};if(sscanf(l,"%lx-%lx %*s %*s %*s %*s %511s",&a,&b,p)==3&&!strcmp(p,path)&&n<cap)out[n++]=(struct range){a,b};}fclose(f);return n;}
          static int reserve(struct range*r,int n){for(int i=0;i<n;i++){size_t z=r[i].b-r[i].a;if(mmap((void*)r[i].a,z,PROT_NONE,MAP_PRIVATE|MAP_ANONYMOUS|MAP_FIXED_NOREPLACE,-1,0)==MAP_FAILED){fprintf(stderr,"RESERVE_FAIL %p errno=%d\n",(void*)r[i].a,errno);return -1;}}return 0;}
          int main(void){struct range rr[16];void*h1=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);if(!h1)return 2;GIPA g1=(GIPA)dlsym(h1,"vkGetInstanceProcAddr");ENUMVER p1=(ENUMVER)g1(0,"vkEnumerateInstanceVersion");uint32_t a=0,b=0,c=0;if(!g1||!p1||p1(&a))return 3;int n=collect((void*)g1,rr,16);if(n<=0)return 4;fprintf(stderr,"DERIVED_GEN1 gipa=%p H=%p ranges=%d\n",(void*)g1,(void*)p1,n);if(dlclose(h1))return 5;if(p1(&b)||b!=a)return 6;if(reserve(rr,n))return 7;void*h2=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);if(!h2)return 8;GIPA g2=(GIPA)dlsym(h2,"vkGetInstanceProcAddr");ENUMVER p2=(ENUMVER)g2(0,"vkEnumerateInstanceVersion");fprintf(stderr,"DERIVED_GEN2 gipa=%p H=%p moved=%d same_H=%d\n",(void*)g2,(void*)p2,g2!=g1,p2==p1);if(!g2||!p2||g2==g1||p2!=p1||p2(&c)||c!=a)return 9;uint32_t d=0;if(p1(&d)||d!=a)return 10;fprintf(stderr,"DERIVED_MOVED_OK\n");return 0;}
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/moved.c -ldl -o "$ROOTFS/opt/fex-ci/moved"

      - name: Run all derived bridge discriminators
        run: |
          set -euxo pipefail
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" build/Bin/FEX /opt/fex-ci/pfn >"$R/pfn.out" 2>"$R/pfn.err"
          cat "$R/pfn.err"
          grep -q DERIVED_PFN_OK "$R/pfn.err"

          Xvfb :99 -screen 0 640x480x24 >"$R/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          DISPLAY=:99 VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" build/Bin/FEX /opt/fex-ci/x11 >"$R/x11.out" 2>"$R/x11.err"
          cat "$R/x11.err"
          grep -q 'GUEST_XSYNC display=0x12346000' "$R/x11.err"
          grep -q 'GUEST_XDISPLAYSTRING display=0x12346000' "$R/x11.err"
          grep -q DERIVED_X11_OK "$R/x11.err"

          VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" build/Bin/FEX /opt/fex-ci/moved >"$R/moved.out" 2>"$R/moved.err"
          cat "$R/moved.err"
          grep -q 'moved=1 same_H=1' "$R/moved.err"
          grep -q DERIVED_MOVED_OK "$R/moved.err"
          echo DERIVED_VULKAN_BRIDGE_RUNTIME_OK | tee "$R/result.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-derived-bridge-runtime-${{ github.run_id }}
          path: receipts-runtime
          retention-days: 30
