name: Agent M full 64-bit guest NODELETE build

on:
  push:
    branches: [ci/agent-m-arm64-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-guest-thunks-64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      R: ${{ github.workspace }}/receipts
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev libssl-dev pkg-config libcap-dev binutils \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libx11-dev libxcb1-dev libxrandr-dev libxrender-dev libwayland-dev libdrm-dev libasound2-dev libgl-dev libegl-dev

      - name: Apply generic guest lifetime policy
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/GuestLibs/CMakeLists.txt')
          s = p.read_text()
          old = '  target_link_libraries(${NAME}-guest PRIVATE lib${NAME}-guest-deps)\n'
          new = old + '  if (TARGET_TYPE STREQUAL "SHARED")\n    target_link_options(${NAME}-guest PRIVATE "LINKER:-z,nodelete")\n  endif()\n'
          if old not in s:
              raise SystemExit('add_guest_lib insertion point missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/GuestLibs/CMakeLists.txt | tee "$R/nodelete-policy.diff"

      - name: Build thunk generator
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/main-cmake.log" 2>&1
          cmake --build build --target thunkgen -- -j"$(nproc)" -v > "$R/thunkgen-build.log" 2>&1 || { tail -n 200 "$R/thunkgen-build.log"; exit 1; }
          THUNKGEN="$(find build -type f -name thunkgen -perm -111 | head -n1)"
          test -n "$THUNKGEN"
          realpath "$THUNKGEN" | tee "$R/thunkgen-path.txt"

      - name: Build and measure all real 64-bit guest thunks
        shell: bash
        run: |
          set -euxo pipefail
          THUNKGEN="$(cat "$R/thunkgen-path.txt")"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_CLANG_THUNKS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$THUNKGEN" \
            -DX86_DEV_ROOTFS=/ > "$R/guest-cmake.log" 2>&1 || { cat "$R/guest-cmake.log"; exit 1; }
          cmake --build guest-build --target \
            asound-guest vulkan-guest drm-guest wayland-client-guest VDSO-guest GL-guest EGL-guest cuda-guest \
            -- -j"$(nproc)" -v > "$R/all64-build.log" 2>&1 || { tail -n 360 "$R/all64-build.log"; exit 1; }

          : > "$R/footprint.tsv"
          printf 'label\tfile_bytes\tload_memsz_bytes\tneeded\n' >> "$R/footprint.tsv"

          check_so() {
            label="$1"; pattern="$2"; soname="$3"
            path="$(find guest-build -type f -name "$pattern" | head -n1)"
            test -n "$path"
            file "$path" | tee "$R/${label}-file.txt"
            readelf -d "$path" | tee "$R/${label}-dynamic.txt"
            readelf -W -l "$path" | tee "$R/${label}-program-headers.txt"
            grep -q 'FLAGS_1.*NODELETE' "$R/${label}-dynamic.txt"
            grep -Fq "SONAME)             Library soname: [$soname]" "$R/${label}-dynamic.txt"
            bytes="$(stat -c '%s' "$path")"
            load_mem="$(python3 - "$R/${label}-program-headers.txt" <<'PY'
          import sys
          total = 0
          for line in open(sys.argv[1]):
              fields = line.split()
              if fields and fields[0] == 'LOAD':
                  total += int(fields[5], 16)
          print(total)
          PY
            )"
            needed="$(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' "$R/${label}-dynamic.txt" | paste -sd, -)"
            printf '%s\t%s\t%s\t%s\n' "$label" "$bytes" "$load_mem" "$needed" | tee -a "$R/footprint.tsv"
            echo "ALL64_${label}_NODELETE_OK"
          }

          check_so asound 'libasound-guest.so*' 'libasound.so.2'
          check_so vulkan 'libvulkan-guest.so*' 'libvulkan.so.1'
          check_so drm 'libdrm-guest.so*' 'libdrm.so.2'
          check_so wayland_client 'libwayland-client-guest.so*' 'libwayland-client.so.0.20.0'
          check_so VDSO 'libVDSO-guest.so*' 'linux-vdso.so.1'
          check_so GL 'libGL-guest.so*' 'libGL.so.1'
          check_so EGL 'libEGL-guest.so*' 'libEGL.so.1'
          check_so cuda 'libcuda-guest.so*' 'libcuda.so.1'

          python3 - "$R/footprint.tsv" <<'PY' | tee "$R/footprint-summary.txt"
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1]), delimiter='\t'))
          file_total = sum(int(r['file_bytes']) for r in rows)
          load_total = sum(int(r['load_memsz_bytes']) for r in rows)
          print(f'WRAPPER_COUNT={len(rows)}')
          print(f'FILE_BYTES_TOTAL={file_total}')
          print(f'PT_LOAD_MEMSZ_TOTAL={load_total}')
          print(f'FILE_MIB_TOTAL={file_total / 1024 / 1024:.3f}')
          print(f'PT_LOAD_MIB_TOTAL={load_total / 1024 / 1024:.3f}')
          PY
          echo ALL_64_SHARED_GUEST_THUNKS_NODELETE_OK

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-m-all64-nodelete-${{ github.run_id }}
          path: receipts
          retention-days: 30
