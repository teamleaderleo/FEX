name: Agent M real 32-bit guest NODELETE build

on:
  push:
    branches: [ci/agent-m-arm64-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-guest-thunk-32:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      R: ${{ github.workspace }}/receipts
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev libssl-dev pkg-config libcap-dev binutils \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            gcc-13-multilib-x86-64-linux-gnu g++-13-multilib-x86-64-linux-gnu \
            libc6-dev-i386-cross

      - name: Apply generic guest lifetime policy
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/GuestLibs/CMakeLists.txt')
          s = p.read_text()
          old = '  target_link_libraries(${NAME}-guest PRIVATE lib${NAME}-guest-deps)\n'
          new = old + '  if (TARGET_TYPE STREQUAL "SHARED")\n    target_link_options(${NAME}-guest PRIVATE "LINKER:-z,nodelete")\n  endif()\n'
          if old not in s:
              raise SystemExit('add_guest_lib insertion point missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/GuestLibs/CMakeLists.txt | tee "$R/nodelete-policy.diff"

      - name: Build thunk generator
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/main-cmake.log" 2>&1
          cmake --build build --target thunkgen -- -j"$(nproc)" -v > "$R/thunkgen-build.log" 2>&1 || { tail -n 200 "$R/thunkgen-build.log"; exit 1; }
          THUNKGEN="$(find build -type f -name thunkgen -perm -111 | head -n1)"
          test -n "$THUNKGEN"
          realpath "$THUNKGEN" | tee "$R/thunkgen-path.txt"

      - name: Build real 32-bit Vulkan guest thunk
        shell: bash
        run: |
          set -euxo pipefail
          THUNKGEN="$(cat "$R/thunkgen-path.txt")"
          x86_64-linux-gnu-g++ -m32 -v 2>&1 | tail -n 20 | tee "$R/cross32-toolchain.txt"
          cmake -S ThunkLibs/GuestLibs -B guest-build-32 -G Ninja \
            -DBITNESS=32 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_CLANG_THUNKS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_32.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$THUNKGEN" \
            -DX86_DEV_ROOTFS=/ > "$R/guest32-cmake.log" 2>&1
          cmake --build guest-build-32 --target vulkan-guest -- -j"$(nproc)" -v > "$R/vulkan32-build.log" 2>&1 || { tail -n 280 "$R/vulkan32-build.log"; exit 1; }
          path="$(find guest-build-32 -type f -name 'libvulkan-guest.so*' | head -n1)"
          test -n "$path"
          file "$path" | tee "$R/vulkan32-file.txt"
          readelf -d "$path" | tee "$R/vulkan32-dynamic.txt"
          grep -q 'ELF 32-bit.*Intel 80386' "$R/vulkan32-file.txt"
          grep -q 'FLAGS_1.*NODELETE' "$R/vulkan32-dynamic.txt"
          grep -Fq 'SONAME)             Library soname: [libvulkan.so.1]' "$R/vulkan32-dynamic.txt"
          echo REAL_vulkan_32_NODELETE_OK

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-m-real-nodelete-32-${{ github.run_id }}
          path: receipts
          retention-days: 30
