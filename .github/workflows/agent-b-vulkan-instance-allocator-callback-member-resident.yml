name: Agent B generated Vulkan instance allocator resident bridge

on:
  push:
    branches: [ci/agent-b-vulkan-instance-allocator-callback-member-resident-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GREEN_SHA: 9a535085fc9e71c9cce9c3d9e653c7dc5a926194
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host-thunks
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Dependencies and provenance
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          git log --oneline -10 | tee "$R/lineage.txt"
          git cat-file -e "$GREEN_SHA^{commit}"
          git diff --name-only "$GREEN_SHA" -- ThunkLibs FEXCore Source | tee "$R/pre-patch-product-source-diff.txt"
          test ! -s "$R/pre-patch-product-source-diff.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers binutils

      - name: Native real instance allocator control
        shell: bash
        run: |
          set -uxo pipefail
          cc -O0 -g -Wall -Wextra -Werror LinuxFieldwork/vk_allocator_instance_probe.c -ldl -o "$R/native-probe"
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          set +e
          VK_DRIVER_FILES="$ICD" timeout 30s "$R/native-probe" > "$R/native.stdout" 2> "$R/native.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/native.exit"
          cat "$R/native.stderr"
          test "$rc" -eq 0
          grep -q 'PASS allocator native-valid create/destroy callbacks observed' "$R/native.stderr"
          grep -E -q 'MARK create-return result=0 .*alloc=[1-9]' "$R/native.stderr"
          grep -E -q 'MARK destroy-return .*free=[1-9]' "$R/native.stderr"

      - name: Apply generated members and forward allocator through custom create
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_vulkan_instance_allocator_callback_member.py
          git diff --check
          git diff -- \
            ThunkLibs/Generator \
            ThunkLibs/include/common/GeneratorInterface.h \
            ThunkLibs/libvulkan \
            | tee "$R/generated-vulkan-instance-allocator.diff"
          grep -n -A28 'FEXFN_IMPL(vkCreateInstance)' ThunkLibs/libvulkan/Host.cpp | tee "$R/create-instance-host.txt"
          grep -q 'LDR_PTR(vkCreateInstance)(vk_struct_base, a_1, &out)' "$R/create-instance-host.txt"
          ! grep -q 'LDR_PTR(vkCreateInstance)(vk_struct_base, nullptr, &out)' "$R/create-instance-host.txt"

      - name: Build FEX, Vulkan host thunk, wrapper, and full resident bridge
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer vulkan-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 380 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest-build --target vulkan_bridge-guest vulkan-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 440 "$R/build-guest.log"; exit 1; }

      - name: Prove generated allocator conversion reaches custom create
        shell: bash
        run: |
          set -euxo pipefail
          normal=guest-build/gen/thunkgen_guest_libvulkan.inl
          bridge=guest-build/gen/thunkgen_guest_libvulkan_bridge.inl
          accessors=guest-build/gen/thunkgen_guest_libvulkan_bridge_accessors.inl
          host_inl="$(find build -name 'thunkgen_host_libvulkan.inl' -print -quit)"
          test -f "$normal"; test -f "$bridge"; test -f "$accessors"; test -n "$host_inl"
          normal_count="$(grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' "$normal")"
          bridge_count="$(grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' "$bridge")"
          printf 'normal_callback_signatures=%s\nbridge_callback_signatures=%s\n' "$normal_count" "$bridge_count" | tee "$R/signature-counts.txt"
          test "$normal_count" -eq 480
          test "$bridge_count" -eq 480
          for member in pfnAllocation pfnReallocation pfnFree pfnInternalAllocation pfnInternalFree; do
            grep -m1 -n "fex_callback_copy_.*\.${member} = AllocateHostTrampolineForGuestFunction" "$normal" | tee -a "$R/generated-guest-markers.txt"
            grep -m1 -n "FinalizeHostTrampolineForGuestFunction(fex_callback_.*_${member})" "$host_inl" | tee -a "$R/generated-host-markers.txt"
          done
          grep -n 'FEXAllocateResidentHostTrampolineForGuestFunction' "$accessors" | tee "$R/resident-accessor.txt"
          grep -n '#define AllocateHostTrampolineForGuestFunction FEXAllocateResidentHostTrampolineForGuestFunction' ThunkLibs/libvulkan/Guest.cpp | tee "$R/wrapper-redirect.txt"
          readelf -d guest-build/libvulkan-guest.so | tee "$R/vulkan.dynamic"
          readelf -d guest-build/libfex-vulkan-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/vulkan.dynamic"
          grep -q 'NEEDED.*libfex-vulkan-bridge.so' "$R/vulkan.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"

      - name: Prepare amd64 rootfs and real instance probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-build/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp guest-build/libfex-vulkan-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-vulkan-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void*d,int x){(void)d;(void)x;return 0;}
          void*XGetVisualInfo(void*d,long m,void*t,int*n){(void)d;(void)m;(void)t;if(n)*n=0;return 0;}
          char*XDisplayString(void*d){(void)d;static char s[]=":0";return s;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 \
            /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          x86_64-linux-gnu-gcc -O0 -g -Wall -Wextra -Werror LinuxFieldwork/vk_allocator_instance_probe.c -ldl \
            -o "$ROOTFS/opt/fex-ci/instance-allocator-probe"

      - name: Execute real instance allocator under generated resident conversion
        shell: bash
        run: |
          set -uxo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          set +e
          VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$GITHUB_WORKSPACE/build/Bin/FEX" /opt/fex-ci/instance-allocator-probe \
            > "$R/fex.stdout" 2> "$R/fex.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/fex.exit"
          printf 'native=%s\npristine_reference=132\ngenerated_instance_candidate=%s\n' "$(cat "$R/native.exit")" "$rc" | tee "$R/final-matrix.txt"
          cat "$R/fex.stderr"
          test "$rc" -eq 0
          grep -q 'PASS allocator native-valid create/destroy callbacks observed' "$R/fex.stderr"
          grep -E -q 'MARK create-return result=0 .*alloc=[1-9]' "$R/fex.stderr"
          grep -E -q 'MARK destroy-return .*free=[1-9]' "$R/fex.stderr"
          echo 'OUTCOME=generated_vulkan_instance_allocator_callbacks_passed' | tee -a "$R/final-matrix.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-vulkan-instance-allocator-callback-member-resident-${{ github.run_id }}
          path: receipts
          retention-days: 30
