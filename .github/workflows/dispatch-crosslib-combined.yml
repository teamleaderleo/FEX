name: Dispatch combined bridge experiment

on:
  push:
    branches: [ci/crosslib-guest-bridge-runtime-20260814]
    paths:
      - .github/workflows/dispatch-crosslib-combined.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch combined bridge workflow on current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/crosslib-combined-bridge-build-arm64.yml/dispatches \
            -d '{"ref":"ci/crosslib-guest-bridge-runtime-20260814"}'
