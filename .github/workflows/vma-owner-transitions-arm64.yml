name: Failed MAP_FIXED thunk retirement rollback ARM64

on:
  push:
    branches: [ci/map-fixed-failure-rollback-20260814]
    paths:
      - diagnostics/vma-owner-transitions/vma_linkaddress_probe.cpp
      - .github/workflows/vma-owner-transitions-arm64.yml
      - .github/fieldwork/pre_map_fixed_retire.py
      - .github/fieldwork/add_revoked_h_state.py
      - .github/fieldwork/merge_callback_tombstone.py
      - .github/fieldwork/fix_retirement_lock_order.py
      - .github/fieldwork/promote_multiowner_claims.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-discriminator:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-map-fixed-failure
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4

      - name: Checkout exact FEX source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout lifetime helper
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1

      - name: Dependencies and identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config libcap-dev \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'carrier=%s\nfex=%s\nhelper=%s\n' \
            "$GITHUB_SHA" "$(git -C src rev-parse HEAD)" "$(git -C retirement-helper rev-parse HEAD)" \
            > "$R/identity.txt"

      - name: Build base FEX runtime
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-base.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build-base.log" 2>&1

      - name: Prepare amd64 rootfs and failed-MAP_FIXED probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci" "$ROOTFS/usr/lib/x86_64-linux-gnu"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          x86_64-linux-gnu-g++ -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Werror \
            -Wno-error=missing-field-initializers \
            -I"$GITHUB_WORKSPACE/src/ThunkLibs/include" \
            diagnostics/vma-owner-transitions/vma_linkaddress_probe.cpp \
            -o "$ROOTFS/opt/fex-ci/vma-linkaddress-probe"
          file "$ROOTFS/opt/fex-ci/vma-linkaddress-probe" > "$R/probe.file"

      - name: Apply current lifetime candidate and rebuild
        shell: bash
        run: |
          set -euxo pipefail
          python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
          python3 .github/fieldwork/promote_multiowner_claims.py src
          python3 .github/fieldwork/merge_callback_tombstone.py src
          python3 .github/fieldwork/fix_retirement_lock_order.py src
          python3 .github/fieldwork/add_revoked_h_state.py src
          git -C src diff --check
          git -C src diff > "$R/current-candidate.diff"
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build-current.log" 2>&1
          mkdir -p /tmp/fex-current
          cp src/build/Bin/FEX src/build/Bin/FEXServer /tmp/fex-current/

      - name: Run current candidate failed MAP_FIXED control
        shell: bash
        run: |
          set +e
          FEX_ROOTFS="$ROOTFS" timeout 30s /tmp/fex-current/FEX \
            /opt/fex-ci/vma-linkaddress-probe map-fixed-fail \
            > "$R/current-fail.stdout" 2> "$R/current-fail.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/current-fail.exit"
          printf 'current-fail=%s\n' "$rc" | tee "$R/current-matrix.txt"
          grep -E 'VMA |DIAG_REVOKED_H|DIAG_LOCKED|DIAG_MULTI' "$R/current-fail.stderr" \
            > "$R/current-fail.key-lines" || true
          cat "$R/current-fail.key-lines"

      - name: Add pre-MAP_FIXED retirement hook and rebuild
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/fieldwork/pre_map_fixed_retire.py src
          git -C src diff --check
          git -C src diff > "$R/pre-retire-no-rollback.diff"
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build-pre-retire.log" 2>&1

      - name: Run no-rollback failed MAP_FIXED discriminator
        shell: bash
        run: |
          set +e
          FEX_ROOTFS="$ROOTFS" timeout 30s "$GITHUB_WORKSPACE/src/build/Bin/FEX" \
            /opt/fex-ci/vma-linkaddress-probe map-fixed-fail \
            > "$R/pre-retire-fail.stdout" 2> "$R/pre-retire-fail.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/pre-retire-fail.exit"
          printf 'pre-retire-no-rollback-fail=%s\n' "$rc" | tee "$R/pre-retire-matrix.txt"
          grep -E 'VMA |DIAG_MAP_FIXED|DIAG_REVOKED_H|DIAG_LOCKED|DIAG_MULTI' "$R/pre-retire-fail.stderr" \
            > "$R/pre-retire-fail.key-lines" || true
          cat "$R/pre-retire-fail.key-lines"
          cat "$R/current-matrix.txt" "$R/pre-retire-matrix.txt" | tee "$R/matrix.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-fixed-failure-rollback-${{ github.run_id }}
          path: receipts-map-fixed-failure
          retention-days: 30
