name: Thunk retained-claim owner identity ARM64

on:
  push:
    branches: [ci/thunk-owner-claim-id-20260814]
    paths:
      - diagnostics/vma-owner-transitions/vma_linkaddress_probe.cpp
      - .github/workflows/vma-owner-transitions-arm64.yml
      - .github/fieldwork/add_vma_owner_id.py
      - .github/fieldwork/add_owner_claim_identity.py
      - .github/fieldwork/pre_map_fixed_retire.py
      - .github/fieldwork/add_map_fixed_rollback_transaction.py
      - .github/fieldwork/add_revoked_h_state.py
      - .github/fieldwork/merge_callback_tombstone.py
      - .github/fieldwork/fix_retirement_lock_order.py
      - .github/fieldwork/promote_multiowner_claims.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-claim:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-owner-claim
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4

      - name: Checkout exact FEX source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout lifetime helper
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1

      - name: Dependencies and identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config libcap-dev \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'carrier=%s\nfex=%s\nhelper=%s\n' \
            "$GITHUB_SHA" "$(git -C src rev-parse HEAD)" "$(git -C retirement-helper rev-parse HEAD)" \
            > "$R/identity.txt"

      - name: Build base FEX runtime
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-base.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build-base.log" 2>&1

      - name: Prepare amd64 rootfs and owner probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci" "$ROOTFS/usr/lib/x86_64-linux-gnu"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          x86_64-linux-gnu-g++ -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Werror \
            -Wno-error=missing-field-initializers \
            -I"$GITHUB_WORKSPACE/src/ThunkLibs/include" \
            diagnostics/vma-owner-transitions/vma_linkaddress_probe.cpp \
            -o "$ROOTFS/opt/fex-ci/vma-linkaddress-probe"
          file "$ROOTFS/opt/fex-ci/vma-linkaddress-probe" > "$R/probe.file"

      - name: Apply lifetime transaction and owner-aware retained claims
        shell: bash
        run: |
          set -euxo pipefail
          python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
          python3 .github/fieldwork/promote_multiowner_claims.py src
          python3 .github/fieldwork/merge_callback_tombstone.py src
          python3 .github/fieldwork/fix_retirement_lock_order.py src
          python3 .github/fieldwork/add_revoked_h_state.py src
          python3 .github/fieldwork/pre_map_fixed_retire.py src
          python3 .github/fieldwork/add_map_fixed_rollback_transaction.py src
          python3 .github/fieldwork/add_vma_owner_id.py src
          python3 .github/fieldwork/add_owner_claim_identity.py src
          git -C src diff --check
          git -C src diff > "$R/owner-claim.diff"
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build-owner-claim.log" 2>&1

      - name: Run owner-aware claim matrix
        shell: bash
        run: |
          set -uxo pipefail
          run_case() {
            mode="$1"; name="claim-$mode"
            set +e
            FEX_ROOTFS="$ROOTFS" timeout 30s "$GITHUB_WORKSPACE/src/build/Bin/FEX" \
              /opt/fex-ci/vma-linkaddress-probe "$mode" \
              > "$R/$name.stdout" 2> "$R/$name.stderr"
            rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
            printf '%s=%s\n' "$name" "$rc" | tee -a "$R/matrix.txt"
            grep -E 'VMA |DIAG_OWNER_|DIAG_MAP_FIXED|DIAG_ROLLBACK|DIAG_REVOKED_H|DIAG_MULTI' \
              "$R/$name.stderr" > "$R/$name.key-lines" || true
            cat "$R/$name.key-lines"
          }
          set -e
          : > "$R/matrix.txt"
          run_case map-fixed-fail
          run_case map-fixed
          run_case map-fixed-reregister
          run_case mprotect-owner

      - name: Assert generation-aware claim identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat "$R/claim-map-fixed-fail.exit")" = 0
          test "$(cat "$R/claim-map-fixed.exit")" = 139
          test "$(cat "$R/claim-map-fixed-reregister.exit")" = 0
          test "$(cat "$R/claim-mprotect-owner.exit")" = 0
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('receipts-owner-claim/claim-map-fixed-reregister.stderr').read_text()
          rows = re.findall(r'DIAG_OWNER_CLAIM_ACTIVE H=(0x[0-9a-f]+) T=(0x[0-9a-f]+) owner=(0x[0-9a-f]+) new=(\d+)', text)
          if len(rows) < 2:
              raise SystemExit(f'need two active owner claims, got {rows!r}')
          first, second = rows[0], rows[-1]
          if first[0] != second[0] or first[1] != second[1]:
              raise SystemExit(f'expected same H/T across ABA replacement: {first!r} {second!r}')
          if first[2] == second[2]:
              raise SystemExit(f'owner identity failed to change: {first!r} {second!r}')
          if first[3] != '1' or second[3] != '1':
              raise SystemExit(f'each generation must create a distinct claim: {first!r} {second!r}')
          Path('receipts-owner-claim/claim-identity.txt').write_text(
              f'H={first[0]}\nT={first[1]}\nowner1={first[2]}\nowner2={second[2]}\nnew1={first[3]}\nnew2={second[3]}\n'
          )
          print('OWNER_CLAIM_GENERATION_OK', first, second)
          PY

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunk-owner-claim-${{ github.run_id }}
          path: receipts-owner-claim
          retention-days: 30
