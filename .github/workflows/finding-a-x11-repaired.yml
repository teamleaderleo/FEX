name: Hosted ARM64 Finding A with X11 bootstrap

on:
  push:
    branches: [ci/finding-a-x11-repaired-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finding-a:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_SHA: 1b268a6742768086aa8355e997c10b4423319ba6
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      HOST_BASE: ${{ github.workspace }}/host-baseline
      HOST_CAND: ${{ github.workspace }}/host-candidate
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and identity
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST_BASE" "$HOST_CAND"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          test "$(git -C fieldwork rev-parse HEAD)" = "$FIELDWORK_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev \
            libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools
          printf 'fex=%s\nfieldwork=%s\ncarrier=%s\n' \
            "$(git -C src rev-parse HEAD)" "$(git -C fieldwork rev-parse HEAD)" "$GITHUB_SHA" > "$R/identity.txt"

      - name: Native ARM64 Lavapipe control
        run: |
          set -euxo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          echo "$ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$ICD" vulkaninfo --summary > "$R/native-vulkaninfo.stdout" 2> "$R/native-vulkaninfo.stderr"
          cc -O2 -Wall -Wextra fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c -ldl -o /tmp/callback-arm64
          VK_DRIVER_FILES="$ICD" /tmp/callback-arm64 report gipa positive > "$R/native-callback.stdout" 2> "$R/native-callback.stderr"

      - name: Build exact FEX and Vulkan thunks
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1
          test -x src/build/Bin/FEX
          test -x src/build/Bin/FEXServer
          test -x src/build/Bin/thunkgen
          test -f src/build/HostLibs_64/libvulkan-host.so
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST_BASE/libvulkan-host.so"
          cmake -S src/ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest-build --target vulkan-guest -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1
          test -f guest-build/libvulkan-guest.so

      - name: Prepare amd64 rootfs, X11 bootstrap stub, and probes
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-build/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void *d, int discard){(void)d;(void)discard;return 0;}
          void *XGetVisualInfo(void *d, long mask, void *t, int *n){(void)d;(void)mask;(void)t;if(n)*n=0;return 0;}
          char *XDisplayString(void *d){(void)d;static char s[] = ":0";return s;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 \
            /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/static.c <<'EOF'
          #include <unistd.h>
          int main(void){static const char s[]="STATIC_OK\n";return write(2,s,sizeof(s)-1)==(ssize_t)(sizeof(s)-1)?0:1;}
          EOF
          cat >/tmp/load.c <<'EOF'
          #include <dlfcn.h>
          int main(void){void *h=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);return h?0:2;}
          EOF
          x86_64-linux-gnu-gcc -static -O2 -Wall -Wextra -Werror /tmp/static.c -o "$ROOTFS/opt/fex-ci/static"
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/load.c -ldl -o "$ROOTFS/opt/fex-ci/load-vulkan"
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror \
            fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c -ldl \
            -o "$ROOTFS/opt/fex-ci/callback"

      - name: Baseline matrix
        run: |
          set -uxo pipefail
          ICD="$(cat "$R/lvp-icd.txt")"
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          run_case(){ name="$1"; shift; set +e; VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST_BASE" "$FEX" "$@" > "$R/$name.stdout" 2> "$R/$name.stderr"; rc=$?; set -e; echo "$rc" > "$R/$name.exit"; }
          set -e
          run_case static /opt/fex-ci/static
          run_case load-vulkan /opt/fex-ci/load-vulkan
          run_case direct /opt/fex-ci/callback report direct positive
          run_case gipa-baseline /opt/fex-ci/callback report gipa positive
          printf 'static=%s\nload_vulkan=%s\ndirect=%s\ngipa_baseline=%s\n' \
            "$(cat "$R/static.exit")" "$(cat "$R/load-vulkan.exit")" "$(cat "$R/direct.exit")" "$(cat "$R/gipa-baseline.exit")" | tee "$R/baseline-matrix.txt"

      - name: Apply diagnostic create routing and rerun GIPA
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ThunkLibs/libvulkan/Host.cpp')
          s=p.read_text()
          old='  } else if (a_1 == "vkFreeMemory"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkFreeMemory;\n'
          new=old+'  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;\n'
          if s.count(old)!=1: raise SystemExit(f'anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git -C src diff -- ThunkLibs/libvulkan/Host.cpp > "$R/diagnostic.diff"
          cmake --build src/build --target vulkan-host-64 -- -j"$(nproc)" -v > "$R/rebuild-candidate.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST_CAND/libvulkan-host.so"
          ICD="$(cat "$R/lvp-icd.txt")"
          set +e
          VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST_CAND" \
            "$GITHUB_WORKSPACE/src/build/Bin/FEX" /opt/fex-ci/callback report gipa positive \
            > "$R/gipa-candidate.stdout" 2> "$R/gipa-candidate.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/gipa-candidate.exit"
          printf 'static=%s\nload_vulkan=%s\ndirect=%s\ngipa_baseline=%s\ngipa_candidate=%s\n' \
            "$(cat "$R/static.exit")" "$(cat "$R/load-vulkan.exit")" "$(cat "$R/direct.exit")" \
            "$(cat "$R/gipa-baseline.exit")" "$rc" | tee "$R/final-matrix.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finding-a-x11-repaired-${{ github.run_id }}
          path: receipts
          if-no-files-found: warn
