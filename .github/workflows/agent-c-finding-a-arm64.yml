name: Agent C disposable ARM64 Finding A probe

on:
  push:
    branches:
      - ci/agent-c-finding-a-arm64-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finding-a:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_PROBE_SHA: 1b268a6742768086aa8355e997c10b4423319ba6
      DEBIAN_FRONTEND: noninteractive
      ROOTFS_DIR: ${{ github.workspace }}/rootfs-amd64
      RECEIPT_DIR: ${{ github.workspace }}/receipts
      HOST_BASE: ${{ github.workspace }}/host-baseline
      HOST_CANDIDATE: ${{ github.workspace }}/host-candidate
      FEX_PORTABLE: 1

    steps:
      - name: Checkout disposable CI branch
        uses: actions/checkout@v4

      - name: Checkout exact FEX source under test
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: fex-src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned internal probe sources
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_PROBE_SHA }}
          path: fieldwork-probes
          fetch-depth: 1

      - name: Runner and exact-head receipt
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RECEIPT_DIR" "$HOST_BASE" "$HOST_CANDIDATE"
          actual="$(git -C fex-src rev-parse HEAD)"
          test "$actual" = "$FEX_SHA"
          {
            echo "requested_fex_sha=$FEX_SHA"
            echo "actual_fex_sha=$actual"
            echo "fieldwork_probe_sha=$(git -C fieldwork-probes rev-parse HEAD)"
            echo "ci_branch_sha=$GITHUB_SHA"
            date -u +%FT%TZ
            uname -a
            uname -m
            lscpu
            cat /etc/os-release
            free -h
            df -h
          } | tee "$RECEIPT_DIR/runner-and-head.txt"
          git -C fex-src submodule status --recursive > "$RECEIPT_DIR/submodules.txt"

      - name: Install focused dependency delta
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update 2>&1 | tee "$RECEIPT_DIR/apt-update.log"
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld libclang-dev llvm-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            mesa-vulkan-drivers vulkan-tools \
            2>&1 | tee "$RECEIPT_DIR/apt-install.log"
          dpkg-query -W > "$RECEIPT_DIR/dpkg.txt"

      - name: Native ARM64 Lavapipe control
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" | tee "$RECEIPT_DIR/lvp-icd-path.txt"
          cp "$LVP_ICD" "$RECEIPT_DIR/lvp-icd.json"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary \
            >"$RECEIPT_DIR/native-vulkaninfo.stdout" \
            2>"$RECEIPT_DIR/native-vulkaninfo.stderr"
          cc -O2 -Wall -Wextra \
            fieldwork-probes/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c \
            -ldl -o /tmp/callback-probe-arm64
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-probe-arm64 report gipa positive \
            >"$RECEIPT_DIR/native-callback.stdout" \
            2>"$RECEIPT_DIR/native-callback.stderr"

      - name: Configure exact FEX source
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S fex-src -B fex-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF \
            -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ \
            2>&1 | tee "$RECEIPT_DIR/cmake-host-configure.log"

      - name: Build only FEX runtime support plus 64-bit Vulkan host thunk
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build fex-src/build --target vulkan-host-64 FEXServer -- -j"$(nproc)" -v \
            2>&1 | tee "$RECEIPT_DIR/build-vulkan-host-64.log"
          test -x fex-src/build/Bin/FEX
          test -x fex-src/build/Bin/FEXServer
          test -x fex-src/build/Bin/thunkgen
          test -f fex-src/build/HostLibs_64/libvulkan-host.so
          cp fex-src/build/HostLibs_64/libvulkan-host.so "$HOST_BASE/libvulkan-host.so"
          file fex-src/build/Bin/FEX fex-src/build/Bin/FEXServer fex-src/build/Bin/thunkgen "$HOST_BASE/libvulkan-host.so" \
            | tee "$RECEIPT_DIR/host-artifacts-file.txt"
          readelf -d "$HOST_BASE/libvulkan-host.so" > "$RECEIPT_DIR/host-vulkan-baseline.dynamic.txt"

      - name: Configure and build only 64-bit Vulkan guest thunk
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S fex-src/ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/fex-src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/fex-src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/fex-src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ \
            2>&1 | tee "$RECEIPT_DIR/cmake-guest-configure.log"
          cmake --build guest-build --target vulkan-guest -- -j"$(nproc)" -v \
            2>&1 | tee "$RECEIPT_DIR/build-vulkan-guest.log"
          test -f guest-build/libvulkan-guest.so
          file guest-build/libvulkan-guest.so | tee "$RECEIPT_DIR/guest-vulkan.file.txt"
          readelf -d guest-build/libvulkan-guest.so > "$RECEIPT_DIR/guest-vulkan.dynamic.txt"

      - name: Create amd64 Ubuntu runtime rootfs without amd64 execution
        shell: bash
        run: |
          set -euxo pipefail
          docker version > "$RECEIPT_DIR/docker-version.txt"
          docker pull --platform=linux/amd64 ubuntu:24.04 2>&1 | tee "$RECEIPT_DIR/rootfs-pull.log"
          docker image inspect ubuntu:24.04 > "$RECEIPT_DIR/rootfs-image-inspect.json"
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS_DIR"
          docker export "$cid" | tar -C "$ROOTFS_DIR" -xf -
          docker rm "$cid"
          trap - EXIT
          test -x "$ROOTFS_DIR/lib64/ld-linux-x86-64.so.2"
          file "$ROOTFS_DIR/lib64/ld-linux-x86-64.so.2" > "$RECEIPT_DIR/rootfs-loader.txt"
          cat "$ROOTFS_DIR/etc/os-release" > "$RECEIPT_DIR/rootfs-os-release.txt"
          du -sh "$ROOTFS_DIR" > "$RECEIPT_DIR/rootfs-size.txt"

          mkdir -p "$ROOTFS_DIR/usr/lib/x86_64-linux-gnu"
          cp guest-build/libvulkan-guest.so "$ROOTFS_DIR/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS_DIR/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS_DIR/usr/lib/x86_64-linux-gnu/" || true

      - name: Build x86-64 phase and callback probes
        shell: bash
        run: |
          set -euxo pipefail
          cat >/tmp/static-smoke.c <<'EOF'
          #include <unistd.h>
          int main(void) {
            static const char text[] = "STATIC_SMOKE_MAIN\n";
            return write(2, text, sizeof(text) - 1) == (ssize_t)(sizeof(text) - 1) ? 0 : 1;
          }
          EOF
          cat >/tmp/phase-probe.c <<'EOF'
          #include <dlfcn.h>
          #include <string.h>
          #include <unistd.h>
          static void marker(const char *text) {
            const size_t len = strlen(text);
            const ssize_t written = write(2, text, len);
            (void)written;
          }
          int main(int argc, char **argv) {
            marker("PHASE_MAIN\n");
            if (argc == 1 || strcmp(argv[1], "plain") == 0) {
              marker("PHASE_PLAIN_EXIT\n");
              return 0;
            }
            if (strcmp(argv[1], "vulkan") != 0) return 64;
            marker("PHASE_BEFORE_DLOPEN\n");
            void *handle = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!handle) {
              marker("PHASE_DLOPEN_ERROR ");
              const char *error = dlerror();
              marker(error ? error : "unknown");
              marker("\n");
              return 2;
            }
            marker("PHASE_AFTER_DLOPEN\n");
            return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -static -O2 -Wall -Wextra /tmp/static-smoke.c -o /tmp/static-smoke-x86
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra /tmp/phase-probe.c -ldl -o /tmp/phase-probe-x86
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra \
            fieldwork-probes/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c \
            -ldl -o /tmp/callback-probe-x86
          mkdir -p "$ROOTFS_DIR/opt/fex-ci"
          cp /tmp/static-smoke-x86 "$ROOTFS_DIR/opt/fex-ci/static-smoke"
          cp /tmp/phase-probe-x86 "$ROOTFS_DIR/opt/fex-ci/phase-probe"
          cp /tmp/callback-probe-x86 "$ROOTFS_DIR/opt/fex-ci/callback-probe"
          file /tmp/static-smoke-x86 /tmp/phase-probe-x86 /tmp/callback-probe-x86 \
            > "$RECEIPT_DIR/x86-probes.file.txt"

      - name: Run guest phase discriminators and baseline Finding A
        shell: bash
        run: |
          set -uxo pipefail
          LVP_ICD="$(cat "$RECEIPT_DIR/lvp-icd-path.txt")"
          FEX_BIN="$GITHUB_WORKSPACE/fex-src/build/Bin/FEX"
          run_case() {
            local name="$1"; shift
            set +e
            VK_DRIVER_FILES="$LVP_ICD" \
            FEX_ROOTFS="$ROOTFS_DIR" \
            FEX_THUNKHOSTLIBS="$HOST_BASE" \
              "$FEX_BIN" "$@" \
              >"$RECEIPT_DIR/${name}.stdout" \
              2>"$RECEIPT_DIR/${name}.stderr"
            local rc=$?
            set -e
            echo "$rc" | tee "$RECEIPT_DIR/${name}.exit"
          }
          set -e
          run_case static-smoke /opt/fex-ci/static-smoke
          run_case dynamic-plain /opt/fex-ci/phase-probe plain
          run_case dynamic-vulkan /opt/fex-ci/phase-probe vulkan
          run_case report-direct /opt/fex-ci/callback-probe report direct positive
          run_case report-gipa-baseline /opt/fex-ci/callback-probe report gipa positive
          {
            for f in static-smoke dynamic-plain dynamic-vulkan report-direct report-gipa-baseline; do
              printf '%s=' "$f"; cat "$RECEIPT_DIR/$f.exit"
            done
          } | tee "$RECEIPT_DIR/baseline-matrix.txt"

      - name: Apply diagnostic-only Finding A route and rebuild only 64-bit host thunk
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fex-src/ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          old = '''  } else if (a_1 == "vkFreeMemory"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkFreeMemory;\n'''
          new = old + '''  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one insertion anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          test "$(git -C fex-src rev-parse HEAD)" = "$FEX_SHA"
          git -C fex-src diff -- ThunkLibs/libvulkan/Host.cpp > "$RECEIPT_DIR/finding-a-diagnostic.diff"
          cmake --build fex-src/build --target vulkan-host-64 -- -j"$(nproc)" -v \
            2>&1 | tee "$RECEIPT_DIR/rebuild-vulkan-host-64-candidate.log"
          cp fex-src/build/HostLibs_64/libvulkan-host.so "$HOST_CANDIDATE/libvulkan-host.so"
          file "$HOST_CANDIDATE/libvulkan-host.so" > "$RECEIPT_DIR/host-vulkan-candidate.file.txt"

      - name: Run Finding A candidate and classify first owner
        shell: bash
        run: |
          set -uxo pipefail
          LVP_ICD="$(cat "$RECEIPT_DIR/lvp-icd-path.txt")"
          FEX_BIN="$GITHUB_WORKSPACE/fex-src/build/Bin/FEX"
          set +e
          VK_DRIVER_FILES="$LVP_ICD" \
          FEX_ROOTFS="$ROOTFS_DIR" \
          FEX_THUNKHOSTLIBS="$HOST_CANDIDATE" \
            "$FEX_BIN" /opt/fex-ci/callback-probe report gipa positive \
            >"$RECEIPT_DIR/report-gipa-candidate.stdout" \
            2>"$RECEIPT_DIR/report-gipa-candidate.stderr"
          candidate=$?
          set -e
          echo "$candidate" | tee "$RECEIPT_DIR/report-gipa-candidate.exit"

          static="$(cat "$RECEIPT_DIR/static-smoke.exit")"
          plain="$(cat "$RECEIPT_DIR/dynamic-plain.exit")"
          vulkan="$(cat "$RECEIPT_DIR/dynamic-vulkan.exit")"
          direct="$(cat "$RECEIPT_DIR/report-direct.exit")"
          baseline="$(cat "$RECEIPT_DIR/report-gipa-baseline.exit")"
          {
            echo "fex_sha=$FEX_SHA"
            echo "static_smoke=$static"
            echo "dynamic_plain=$plain"
            echo "dynamic_vulkan=$vulkan"
            echo "report_direct=$direct"
            echo "report_gipa_baseline=$baseline"
            echo "report_gipa_candidate=$candidate"
            if [ "$static" != 0 ]; then
              echo "first_owner=fex-runtime-or-rootfs"
            elif [ "$plain" != 0 ]; then
              echo "first_owner=dynamic-guest-loader-rootfs"
            elif [ "$vulkan" != 0 ]; then
              echo "first_owner=vulkan-guest-thunk-staging"
            elif [ "$direct" != 0 ]; then
              echo "first_owner=vulkan-direct-thunk-path"
            elif [ "$baseline" = 132 ] && [ "$candidate" = 0 ]; then
              echo "first_owner=finding-a-dynamic-callback-routing"
              echo "classification=Finding-A-reproduced-and-discriminated"
            elif [ "$baseline" != 0 ] && [ "$candidate" = 0 ]; then
              echo "first_owner=finding-a-dynamic-callback-routing"
              echo "classification=diagnostic-route-changes-product-behavior"
            elif [ "$baseline" = 0 ]; then
              echo "first_owner=none-for-this-reproducer"
              echo "classification=baseline-does-not-reproduce"
            else
              echo "first_owner=fex-vulkan-callback-runtime"
              echo "classification=product-log-review"
            fi
          } | tee "$RECEIPT_DIR/classification.txt"

      - name: Upload complete receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-finding-a-arm64-${{ github.run_id }}
          path: |
            receipts/
            .github/workflows/agent-c-finding-a-arm64.yml
          if-no-files-found: warn
          retention-days: 14
