name: Vulkan combined routing candidate
on:
  workflow_dispatch:
  push:
    branches: [linux-fieldwork/vulkan-procaddr-native-first-experiment]
    paths:
      - LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
      - LINUX_FIELDWORK_GENERATED_CUSTOM_REGISTRY.py
      - LINUX_FIELDWORK_DEBUG_UTILS_PNEXT_CLEAN.py
      - .github/workflows/linux-fieldwork-vulkan-combined.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: probe/fex-vulkan-callback-ci
          path: fieldwork
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld clang-tools libclang-dev llvm-dev pkg-config ccache gcc-x86-64-linux-gnu g++-x86-64-linux-gnu gcc-i686-linux-gnu g++-i686-linux-gnu libcap-dev libglfw3-dev libepoxy-dev python3-dev libsdl2-dev libasound2-dev libdrm-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev libgl-dev libegl-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
      - name: Apply combined candidate
        run: |
          set -euxo pipefail
          git apply --check LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
          git apply LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
          python3 LINUX_FIELDWORK_GENERATED_CUSTOM_REGISTRY.py
          python3 LINUX_FIELDWORK_DEBUG_UTILS_PNEXT_CLEAN.py
          git diff --check
      - name: Build FEX
        run: |
          set -euxo pipefail
          C=$(dirname "$(find /usr/lib/llvm-18 -name ClangConfig.cmake -print -quit)")
          L=$(dirname "$(find /usr/lib/llvm-18 -name LLVMConfig.cmake -print -quit)")
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$PWD/install" -DUSE_LINKER=lld -DENABLE_LTO=False -DENABLE_ASSERTIONS=True -DBUILD_TESTING=False -DBUILD_THUNKS=True -DBUILD_FEXCONFIG=False -DENABLE_CLANG_THUNKS=True -DRANGES_NATIVE=OFF -DClang_DIR="$C" -DLLVM_DIR="$L"
          cmake --build build -j"$(nproc)"
          cmake --install build
      - name: Verify generated custom registry
        run: |
          set -euxo pipefail
          files=$(grep -RIl '#define FOREACH_internal_CUSTOM_HOST_SYMBOL' build)
          test -n "$files"
          for symbol in vkCreateInstance vkCreateDevice vkAllocateMemory vkFreeMemory vkCreateShaderModule vkCreateDebugReportCallbackEXT vkDestroyDebugReportCallbackEXT vkCreateDebugUtilsMessengerEXT vkAcquireXlibDisplayEXT vkGetRandROutputDisplayEXT vkGetPhysicalDeviceXcbPresentationSupportKHR vkGetPhysicalDeviceXlibPresentationSupportKHR; do
            grep -R -q "EXPAND($symbol)" build
          done
          ! grep -R '#define FOREACH_internal_CUSTOM_HOST_SYMBOL' build | grep -q 'vkGetInstanceProcAddr'
          ! grep -R '#define FOREACH_internal_CUSTOM_HOST_SYMBOL' build | grep -q 'vkGetDeviceProcAddr'
      - name: Compile probes and fixture
        run: |
          set -euxo pipefail
          P=fieldwork/investigations/fex-vulkan-thunk-lifecycle
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror "$P/fex_vulkan_callback_probe.c" -ldl -o /tmp/callback
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror "$P/procaddr_semantics_probe.c" -ldl -o /tmp/procaddr
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror "$P/procaddr_repeat_probe.c" -ldl -o /tmp/procaddr-repeat
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror "$P/debug_utils_pnext_zero_probe.c" -ldl -o /tmp/pnext-zero
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror "$P/debug_callback_pnext_adjacent_zero_probe.c" -ldl -o /tmp/pnext-adjacent
          x86_64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -Wl,-soname,libX11.so.6 "$P/x11_symbol_fixture.c" -o /tmp/libX11.so.6
      - name: Build minimal x86 rootfs
        run: |
          set -euxo pipefail
          sudo systemctl start docker || true
          sudo docker pull --platform linux/amd64 ubuntu:24.04
          cid=$(sudo docker create --platform linux/amd64 ubuntu:24.04)
          mkdir rootfs
          sudo docker export "$cid" | sudo tar -C rootfs -xf -
          sudo docker rm "$cid"
          sudo mkdir -p rootfs/tmp rootfs/usr/lib/x86_64-linux-gnu
          sudo cp /tmp/callback /tmp/procaddr /tmp/procaddr-repeat /tmp/pnext-zero /tmp/pnext-adjacent rootfs/tmp/
          sudo cp /tmp/libX11.so.6 rootfs/usr/lib/x86_64-linux-gnu/libX11.so.6
          sudo cp install/share/fex-emu/GuestThunks/libvulkan-guest.so rootfs/usr/lib/x86_64-linux-gnu/libvulkan.so.1
      - name: Run complete matrix
        run: |
          set -euxo pipefail
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          mkdir -p "$HOME/.fex-emu" evidence
          printf '{"Config":{"RootFS":"%s/rootfs","ThunkConfig":"%s/install/share/fex-emu/ThunksDB.json"},"ThunksDB":{"Vulkan":1}}\n' "$PWD" "$PWD" > "$HOME/.fex-emu/Config.json"
          run_case() {
            name=$1; shift
            VK_ICD_FILENAMES="$ICD" FEX_ROOTFS="$PWD/rootfs" FEX_THUNKCONFIG="$PWD/install/share/fex-emu/ThunksDB.json" FEX_THUNKGUESTLIBS="$PWD/install/share/fex-emu/GuestThunks" FEX_THUNKHOSTLIBS="$PWD/install/lib/fex-emu/HostThunks" install/bin/FEX "$@" >"evidence/$name.log" 2>&1
            echo "$name=0"
            cat "evidence/$name.log"
          }
          run_case direct-report /tmp/callback report direct 0
          run_case direct-utils /tmp/callback utils direct 0
          run_case dynamic-report /tmp/callback report gipa 0
          run_case dynamic-utils /tmp/callback utils gipa 0
          run_case procaddr /tmp/procaddr
          run_case procaddr-repeat /tmp/procaddr-repeat
          run_case pnext-zero /tmp/pnext-zero
          run_case pnext-adjacent /tmp/pnext-adjacent
          grep -Eq 'PNEXT_ZERO_CREATE result=0 instance=0x[0-9a-fA-F]+ callback_count=0' evidence/pnext-zero.log
          grep -Eq 'PNEXT_ADJACENT_CREATE result=0 instance=0x[0-9a-fA-F]+ report_count=0 utils_count=0' evidence/pnext-adjacent.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-combined-${{ github.run_id }}
          path: evidence
          retention-days: 7
