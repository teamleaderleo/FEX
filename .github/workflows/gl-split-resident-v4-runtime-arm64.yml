name: GL split resident bridge v4 full runtime

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/fieldwork/apply_gl_split_bridge.py
      - .github/fieldwork/prune_gl_wrapper_bridge_duplicates.py
      - .github/workflows/gl-split-resident-v4-runtime-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-split-v4-full:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-v3
      R: ${{ github.workspace }}/receipts-gl-v3
      H: ${{ github.workspace }}/host-gl-v3
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Extract v3 full-runtime shell steps and add wrapper pruning
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/gl-split-resident-v3-runtime-arm64.yml').read_text().splitlines()
          scripts=[]; i=0
          while i < len(source):
              line=source[i]; stripped=line.lstrip()
              if stripped != 'run: |': i+=1; continue
              base=len(line)-len(stripped); block=[]; i+=1
              while i < len(source):
                  row=source[i]
                  if row.strip() and len(row)-len(row.lstrip()) <= base: break
                  block.append('' if not row.strip() else row[base+2:]); i+=1
              text='\n'.join(block)+'\n'
              if 'python3 .github/fieldwork/apply_gl_split_bridge.py .' in text:
                  text=text.replace(
                      'python3 .github/fieldwork/apply_gl_split_bridge.py .',
                      'python3 .github/fieldwork/apply_gl_split_bridge.py .\npython3 .github/fieldwork/prune_gl_wrapper_bridge_duplicates.py .')
                  text=text.replace(
                      'git diff --check',
                      'git diff --check\ngit diff -- ThunkLibs/libGL/libGL_Guest.cpp ThunkLibs/libGL/ResidentBridge.cpp ThunkLibs/GuestLibs/CMakeLists.txt > "$R/v4-source.diff"')
              scripts.append(text)
          if len(scripts) != 4:
              raise SystemExit(f'expected 4 shell steps, got {len(scripts)}')
          out=Path('/tmp/gl-v4-full-steps'); out.mkdir(exist_ok=True)
          for n,s in enumerate(scripts,1):
              p=out/f'{n:02d}.sh'; p.write_text('#!/usr/bin/env bash\n'+s); p.chmod(0o755); print('EXTRACTED',p)
          PY

      - name: Execute v4 full-runtime experiment
        shell: bash
        run: |
          set -euxo pipefail
          for step in /tmp/gl-v4-full-steps/*.sh; do
            echo "===== $step ====="
            "$step"
          done

      - name: Assert GL PFN and malloc-callback lifetime after physical wrapper unload
        shell: bash
        run: |
          set -euxo pipefail
          cat "$R/probe.err"
          grep -q 'AFTER_CLOSE_BEGIN' "$R/probe.err"
          after_line="$(grep -n 'AFTER_CLOSE_BEGIN' "$R/probe.err" | head -1 | cut -d: -f1)"
          tail -n "+$after_line" "$R/probe.err" > "$R/after-close-v4.txt"
          grep -q 'GL_BRIDGE_MALLOC' "$R/after-close-v4.txt"
          grep -q 'GUEST_XSYNC display=0x12346000' "$R/after-close-v4.txt"
          grep -q 'GUEST_XDISPLAYSTRING display=0x12346000' "$R/after-close-v4.txt"
          grep -q 'REAL_GL_SPLIT_V3_OK' "$R/after-close-v4.txt"
          echo REAL_GL_SPLIT_V4_FULL_OK

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-split-v4-full-${{ github.run_id }}
          path: receipts-gl-v3
          retention-days: 30
