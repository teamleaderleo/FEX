name: Agent C Vulkan 32-bit device-group pNext repro

on:
  workflow_dispatch:
  push:
    branches:
      - ci/agent-c-vulkan-load-sigill-20260814
    paths:
      - .github/workflows/agent-c-pnext-device-group-32.yml

permissions:
  contents: read

env:
  FEX_SHA: c011366706eaf65a00380003989b3a10811212b6
  DEBIAN_FRONTEND: noninteractive
  ROOTFS: ${{ github.workspace }}/rootfs-i386
  HOST: ${{ github.workspace }}/host32
  R: ${{ github.workspace }}/receipts
  FEX_PORTABLE: 1

jobs:
  repro32:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          {
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-i686-linux-gnu g++-i686-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools debootstrap

      - name: Build native and i386 probes; validate native control
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

          cat >/tmp/pnext-device-group.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #define VK_NO_PROTOTYPES
          #include <vulkan/vulkan.h>

          #define LOAD(name) \
            PFN_##name name = (PFN_##name)dlsym(vk, #name); \
            if (!(name)) { fprintf(stderr, "MISSING_%s\n", #name); return 20; }

          static void mark(const char *s) {
            fputs(s, stderr);
            fputc('\n', stderr);
            fflush(stderr);
          }

          int main(void) {
            void *vk = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!vk) { fprintf(stderr, "DLOPEN=%s\n", dlerror()); return 10; }
            mark("PNEXT_AFTER_DLOPEN");

            LOAD(vkCreateInstance);
            LOAD(vkDestroyInstance);
            LOAD(vkEnumeratePhysicalDevices);
            LOAD(vkGetPhysicalDeviceQueueFamilyProperties);
            LOAD(vkCreateDevice);
            LOAD(vkDestroyDevice);

            VkApplicationInfo app = {
              .sType = VK_STRUCTURE_TYPE_APPLICATION_INFO,
              .pApplicationName = "fex-pnext-device-group-32",
              .apiVersion = VK_API_VERSION_1_1,
            };
            VkInstanceCreateInfo ici = {
              .sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,
              .pApplicationInfo = &app,
            };
            VkInstance instance = VK_NULL_HANDLE;
            VkResult r = vkCreateInstance(&ici, NULL, &instance);
            fprintf(stderr, "CREATE_INSTANCE=%d instance=%p\n", r, (void*)instance);
            if (r != VK_SUCCESS || instance == VK_NULL_HANDLE) return 21;
            mark("PNEXT_AFTER_INSTANCE");

            uint32_t count = 0;
            r = vkEnumeratePhysicalDevices(instance, &count, NULL);
            if (r != VK_SUCCESS || count == 0) return 22;
            VkPhysicalDevice *pds = calloc(count, sizeof(*pds));
            if (!pds) return 23;
            r = vkEnumeratePhysicalDevices(instance, &count, pds);
            if (r != VK_SUCCESS || count == 0) return 24;
            VkPhysicalDevice pd = pds[0];
            free(pds);

            uint32_t qcount = 0;
            vkGetPhysicalDeviceQueueFamilyProperties(pd, &qcount, NULL);
            if (qcount == 0) return 25;
            VkQueueFamilyProperties *qprops = calloc(qcount, sizeof(*qprops));
            if (!qprops) return 26;
            vkGetPhysicalDeviceQueueFamilyProperties(pd, &qcount, qprops);
            uint32_t qfam = UINT32_MAX;
            for (uint32_t i = 0; i < qcount; ++i) {
              if (qprops[i].queueCount != 0) { qfam = i; break; }
            }
            free(qprops);
            if (qfam == UINT32_MAX) return 27;

            float priority = 1.0f;
            VkDeviceQueueCreateInfo qci = {
              .sType = VK_STRUCTURE_TYPE_DEVICE_QUEUE_CREATE_INFO,
              .queueFamilyIndex = qfam,
              .queueCount = 1,
              .pQueuePriorities = &priority,
            };

            VkPhysicalDevice group_pds[1] = { pd };
            VkDeviceGroupDeviceCreateInfo group = {
              .sType = VK_STRUCTURE_TYPE_DEVICE_GROUP_DEVICE_CREATE_INFO,
              .pNext = NULL,
              .physicalDeviceCount = 1,
              .pPhysicalDevices = group_pds,
            };
            VkDeviceCreateInfo dci = {
              .sType = VK_STRUCTURE_TYPE_DEVICE_CREATE_INFO,
              .pNext = &group,
              .queueCreateInfoCount = 1,
              .pQueueCreateInfos = &qci,
            };
            fprintf(stderr,
                    "PNEXT_BEFORE_CREATE_DEVICE group_stype=%u count=%u ptr=%p pd=%p sizeof_group=%zu sizeof_ptr=%zu\n",
                    (unsigned)group.sType, group.physicalDeviceCount,
                    (void*)group.pPhysicalDevices, (void*)pd,
                    sizeof(group), sizeof(void*));
            fflush(stderr);

            VkDevice device = VK_NULL_HANDLE;
            r = vkCreateDevice(pd, &dci, NULL, &device);
            fprintf(stderr, "CREATE_DEVICE=%d device=%p\n", r, (void*)device);
            fflush(stderr);
            if (r != VK_SUCCESS || device == VK_NULL_HANDLE) return 28;
            mark("PNEXT_AFTER_CREATE_DEVICE");

            vkDestroyDevice(device, NULL);
            vkDestroyInstance(instance, NULL);
            mark("PNEXT_CLEANUP_DONE");
            if (dlclose(vk) != 0) return 29;
            mark("PNEXT_RETURN");
            return 0;
          }
          EOF

          cc -O2 -g -Wall -Wextra -Werror \
            -Isrc/External/Vulkan-Headers/include /tmp/pnext-device-group.c -ldl \
            -o /tmp/pnext-arm64
          i686-linux-gnu-gcc -O2 -g -Wall -Wextra -Werror \
            -Isrc/External/Vulkan-Headers/include /tmp/pnext-device-group.c -ldl \
            -o /tmp/pnext-i386
          file /tmp/pnext-arm64 /tmp/pnext-i386 | tee "$R/probes.file.txt"

          set +e
          VK_DRIVER_FILES="$LVP_ICD" /tmp/pnext-arm64 >"$R/native.out" 2>"$R/native.err"
          native_rc=$?
          set -e
          echo "$native_rc" | tee "$R/native.exit"
          cat "$R/native.err"
          test "$native_rc" -eq 0
          grep -Fxq 'PNEXT_AFTER_CREATE_DEVICE' "$R/native.err"
          grep -Fxq 'PNEXT_RETURN' "$R/native.err"

      - name: Configure FEX and discover 32-bit Vulkan target
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF \
            -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-host.log" 2>&1
          ninja -C src/build -t targets all | grep -E '(^|:)vulkan-host|vulkan-host' | tee "$R/vulkan-targets.txt" || true
          grep -E '^vulkan-host-32:' "$R/vulkan-targets.txt"

      - name: Build 32-bit host and guest Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build src/build --target FEXServer vulkan-host-32 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_32/libvulkan-host.so "$HOST/libvulkan-host.so"

          cmake -S src/ThunkLibs/GuestLibs -B guest32 -G Ninja \
            -DBITNESS=32 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_32.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-guest.log" 2>&1
          cmake --build guest32 --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1
          file src/build/Bin/FEX "$HOST/libvulkan-host.so" guest32/libvulkan-guest.so | tee "$R/built.file.txt"

      - name: Build i386 guest rootfs
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap \
            --arch=i386 --foreign --variant=minbase --components=main,universe \
            --include=libvulkan1,libx11-6 \
            noble "$ROOTFS" http://archive.ubuntu.com/ubuntu \
            >"$R/debootstrap.log" 2>&1

          sudo find "$ROOTFS" -type f -name '*.deb' -print | sort > "$R/rootfs-debs.txt"
          sed -n 's/^I: Extracting \([^ ]*\)\.\.\.$/\1/p' "$R/debootstrap.log" | sort -u > "$R/rootfs-already-extracted.txt"
          : > "$R/rootfs-deferred-extracted.txt"
          while IFS= read -r deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            if grep -Fxq "$pkg" "$R/rootfs-already-extracted.txt"; then
              continue
            fi
            echo "$pkg" >> "$R/rootfs-deferred-extracted.txt"
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done < "$R/rootfs-debs.txt"

          sudo cp guest32/libvulkan-guest.so "$ROOTFS/usr/lib/i386-linux-gnu/libvulkan.so.1"
          sudo ln -sf libvulkan.so.1 "$ROOTFS/usr/lib/i386-linux-gnu/libvulkan.so"
          sudo mkdir -p "$ROOTFS/usr/local/bin"
          sudo install -m755 /tmp/pnext-i386 "$ROOTFS/usr/local/bin/pnext-device-group"

          X11="$ROOTFS/usr/lib/i386-linux-gnu/libX11.so.6"
          test -e "$X11"
          for sym in XSync XGetVisualInfo XDisplayString; do
            i686-linux-gnu-readelf -Ws "$X11" | grep -E " ${sym}(@|$)" | head -1
          done
          file "$ROOTFS/usr/local/bin/pnext-device-group" "$ROOTFS/usr/lib/i386-linux-gnu/libvulkan.so.1" "$X11" | tee "$R/rootfs.file.txt"

      - name: Run 32-bit pNext probe through FEX
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          set +e
          timeout 90s env \
            VK_DRIVER_FILES="$LVP_ICD" \
            FEX_ROOTFS="$ROOTFS" \
            FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /usr/local/bin/pnext-device-group \
            >"$R/fex.out" 2>"$R/fex.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/fex.exit"
          cat "$R/fex.err"

          {
            echo "native_exit=$(cat "$R/native.exit")"
            echo "fex_exit=$rc"
            if grep -q 'Unrecognized VkStructureType' "$R/fex.err"; then
              echo 'unrecognized_stype=1'
            else
              echo 'unrecognized_stype=0'
            fi
            if grep -Fxq 'PNEXT_AFTER_CREATE_DEVICE' "$R/fex.err"; then
              echo 'fex_after_create_device=1'
            else
              echo 'fex_after_create_device=0'
            fi
          } | tee "$R/summary.txt"

          test "$rc" -ne 124

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-pnext-device-group-32-${{ github.run_id }}
          path: receipts
          retention-days: 30
