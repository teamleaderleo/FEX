name: Stock GL GLX-path unload control

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/workflows/gl-stock-glx-unload-control-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-stock-glx-unload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-stock-glx
      R: ${{ github.workspace }}/receipts-gl-stock-glx
      H: ${{ github.workspace }}/host-gl-stock-glx
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and stock build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev xvfb x11-utils
          CC=clang-18 CXX=clang++-18 cmake -S . -B build-stock-glx -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build-stock-glx --target FEX FEXServer GL-host-64 -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1
          cp build-stock-glx/HostLibs_64/libGL-host.so "$H/libGL-host.so"
          cmake -S ThunkLibs/GuestLibs -B guest-stock-glx -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build-stock-glx/Bin/thunkgen" -DX86_DEV_ROOTFS=/ > "$R/cmake-guest.log" 2>&1
          cmake --build guest-stock-glx --target GL-guest -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1
          readelf -d guest-stock-glx/libGL-guest.so | tee "$R/wrapper.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"

      - name: Build matched X11 stub and GLX probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-stock-glx/libGL-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libGL.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cat >/tmp/x11stub.c <<'EOF'
          #include <stdio.h>
          typedef int (*XErrorHandler)(void *, void *);
          int XSync(void*d,int discard){fprintf(stderr,"GUEST_XSYNC display=%p discard=%d\n",d,discard);return 0;}
          void *XGetVisualInfo(void*d,long m,void*t,int*c){fprintf(stderr,"GUEST_XGETVISUALINFO display=%p mask=%ld\n",d,m);(void)t;if(c)*c=0;return 0;}
          char *XDisplayString(void*d){fprintf(stderr,"GUEST_XDISPLAYSTRING display=%p\n",d);static char s[]=":99";return s;}
          XErrorHandler XSetErrorHandler(XErrorHandler h){return h;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/glstockglx.c <<'EOF'
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef void (*VoidFunc)(void); typedef VoidFunc(*GLXGET)(const unsigned char*); typedef void*(*CFG)(void*,int,int*);
          static int mapped(void*p){FILE*f=fopen("/proc/self/maps","r");char l[1024];uintptr_t x=(uintptr_t)p;if(!f)return -1;while(fgets(l,sizeof l,f)){unsigned long a,b;if(sscanf(l,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){int ok=strstr(l,"/usr/lib/x86_64-linux-gnu/libGL.so.1")!=0;fprintf(stderr,"MAP %p %s",p,l);fclose(f);return ok;}}fclose(f);fprintf(stderr,"UNMAPPED %p\n",p);return 0;}
          int main(void){
            void*x11=dlopen("libX11.so.6",RTLD_NOW|RTLD_LOCAL);if(!x11)return 2;
            void*h=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL);if(!h)return 3;
            GLXGET get=(GLXGET)dlsym(h,"glXGetProcAddress");if(!get)return 4;
            CFG cfg=(CFG)get((const unsigned char*)"glXGetFBConfigs");if(!cfg)return 5;
            int n=0;void*p=cfg((void*)0x12345000,0,&n);fprintf(stderr,"BEFORE_CLOSE configs=%p count=%d\n",p,n);if(!p||n<=0)return 6;
            if(dlclose(h))return 7;
            int m=mapped((void*)get);fprintf(stderr,"AFTER_CLOSE wrapper_mapped=%d\n",m);
            return m==0?0:20;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/glstockglx.c -ldl -o "$ROOTFS/opt/fex-ci/glstockglx"

      - name: Execute matched stock GLX unload control
        shell: bash
        run: |
          set -euxo pipefail
          Xvfb :99 -screen 0 640x480x24 +extension GLX > "$R/xvfb.log" 2>&1 &
          pid=$!; trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.1; done
          DISPLAY=:99 xdpyinfo >/dev/null
          set +e
          DISPLAY=:99 FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 40s build-stock-glx/Bin/FEX /opt/fex-ci/glstockglx > "$R/probe.out" 2> "$R/probe.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/probe.exit"
          cat "$R/probe.err"
          test "$rc" -eq 0 -o "$rc" -eq 20

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-stock-glx-unload-${{ github.run_id }}
          path: receipts-gl-stock-glx
          retention-days: 30
