name: Agent C x86 Vulkan headless compute

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths:
      - .github/workflows/agent-c-headless-compute.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: c011366706eaf65a00380003989b3a10811212b6
      DEBIAN_FRONTEND: noninteractive
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host
      FEX_PORTABLE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          {
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools debootstrap \
            glslang-tools

      - name: Native Lavapipe control
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

      - name: Build exact candidate and focused Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"
          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1

      - name: Build x86 compute probe and SPIR-V
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/add.comp <<'EOF'
          #version 450
          layout(local_size_x = 1) in;
          layout(set = 0, binding = 0) buffer Data { uint values[]; } data;
          void main() {
            data.values[gl_GlobalInvocationID.x] += 1;
          }
          EOF
          glslangValidator -V /tmp/add.comp -o /tmp/add.spv | tee "$R/glslang.txt"

          cat > /tmp/vulkan-compute.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #define VK_NO_PROTOTYPES
          #include <vulkan/vulkan.h>

          #define LOAD(name) \
            PFN_##name name = (PFN_##name)dlsym(vk, #name); \
            if (!(name)) { fprintf(stderr, "MISSING_%s\n", #name); return 20; }
          #define VKCHECK(expr, code) do { VkResult _r = (expr); if (_r != VK_SUCCESS) { \
            fprintf(stderr, "VK_FAIL line=%d result=%d\n", __LINE__, _r); return (code); } } while (0)

          static void marker(const char *s) {
            ssize_t n = write(2, s, strlen(s));
            (void)n;
          }

          static uint32_t *read_spv(const char *path, size_t *bytes) {
            FILE *f = fopen(path, "rb");
            if (!f) return NULL;
            if (fseek(f, 0, SEEK_END) != 0) { fclose(f); return NULL; }
            long n = ftell(f);
            if (n <= 0 || (n % 4) != 0) { fclose(f); return NULL; }
            rewind(f);
            uint32_t *p = malloc((size_t)n);
            if (!p) { fclose(f); return NULL; }
            if (fread(p, 1, (size_t)n, f) != (size_t)n) { free(p); fclose(f); return NULL; }
            fclose(f);
            *bytes = (size_t)n;
            return p;
          }

          int main(void) {
            void *vk = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!vk) { fprintf(stderr, "DLOPEN=%s\n", dlerror()); return 10; }
            marker("COMPUTE_AFTER_DLOPEN\n");

            LOAD(vkCreateInstance);
            LOAD(vkDestroyInstance);
            LOAD(vkEnumeratePhysicalDevices);
            LOAD(vkGetPhysicalDeviceQueueFamilyProperties);
            LOAD(vkGetPhysicalDeviceMemoryProperties);
            LOAD(vkCreateDevice);
            LOAD(vkDestroyDevice);
            LOAD(vkGetDeviceQueue);
            LOAD(vkCreateBuffer);
            LOAD(vkDestroyBuffer);
            LOAD(vkGetBufferMemoryRequirements);
            LOAD(vkAllocateMemory);
            LOAD(vkFreeMemory);
            LOAD(vkBindBufferMemory);
            LOAD(vkMapMemory);
            LOAD(vkUnmapMemory);
            LOAD(vkCreateDescriptorSetLayout);
            LOAD(vkDestroyDescriptorSetLayout);
            LOAD(vkCreateDescriptorPool);
            LOAD(vkDestroyDescriptorPool);
            LOAD(vkAllocateDescriptorSets);
            LOAD(vkUpdateDescriptorSets);
            LOAD(vkCreateShaderModule);
            LOAD(vkDestroyShaderModule);
            LOAD(vkCreatePipelineLayout);
            LOAD(vkDestroyPipelineLayout);
            LOAD(vkCreateComputePipelines);
            LOAD(vkDestroyPipeline);
            LOAD(vkCreateCommandPool);
            LOAD(vkDestroyCommandPool);
            LOAD(vkAllocateCommandBuffers);
            LOAD(vkBeginCommandBuffer);
            LOAD(vkCmdBindPipeline);
            LOAD(vkCmdBindDescriptorSets);
            LOAD(vkCmdDispatch);
            LOAD(vkEndCommandBuffer);
            LOAD(vkQueueSubmit);
            LOAD(vkQueueWaitIdle);

            VkApplicationInfo app = {
              .sType = VK_STRUCTURE_TYPE_APPLICATION_INFO,
              .pApplicationName = "fex-headless-compute",
              .apiVersion = VK_API_VERSION_1_0,
            };
            VkInstanceCreateInfo ici = {
              .sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,
              .pApplicationInfo = &app,
            };
            VkInstance instance = VK_NULL_HANDLE;
            VKCHECK(vkCreateInstance(&ici, NULL, &instance), 21);
            marker("COMPUTE_AFTER_INSTANCE\n");

            uint32_t pd_count = 0;
            VKCHECK(vkEnumeratePhysicalDevices(instance, &pd_count, NULL), 22);
            if (pd_count == 0) return 23;
            VkPhysicalDevice *pds = calloc(pd_count, sizeof(*pds));
            if (!pds) return 24;
            VKCHECK(vkEnumeratePhysicalDevices(instance, &pd_count, pds), 25);
            VkPhysicalDevice pd = pds[0];
            free(pds);

            uint32_t q_count = 0;
            vkGetPhysicalDeviceQueueFamilyProperties(pd, &q_count, NULL);
            VkQueueFamilyProperties *qprops = calloc(q_count, sizeof(*qprops));
            if (!qprops) return 26;
            vkGetPhysicalDeviceQueueFamilyProperties(pd, &q_count, qprops);
            uint32_t qfam = UINT32_MAX;
            for (uint32_t i = 0; i < q_count; ++i) {
              if (qprops[i].queueFlags & VK_QUEUE_COMPUTE_BIT) { qfam = i; break; }
            }
            free(qprops);
            if (qfam == UINT32_MAX) return 27;

            float priority = 1.0f;
            VkDeviceQueueCreateInfo qci = {
              .sType = VK_STRUCTURE_TYPE_DEVICE_QUEUE_CREATE_INFO,
              .queueFamilyIndex = qfam,
              .queueCount = 1,
              .pQueuePriorities = &priority,
            };
            VkDeviceCreateInfo dci = {
              .sType = VK_STRUCTURE_TYPE_DEVICE_CREATE_INFO,
              .queueCreateInfoCount = 1,
              .pQueueCreateInfos = &qci,
            };
            VkDevice device = VK_NULL_HANDLE;
            VKCHECK(vkCreateDevice(pd, &dci, NULL, &device), 28);
            marker("COMPUTE_AFTER_DEVICE\n");
            VkQueue queue = VK_NULL_HANDLE;
            vkGetDeviceQueue(device, qfam, 0, &queue);

            const VkDeviceSize buffer_size = 64u * sizeof(uint32_t);
            VkBufferCreateInfo bci = {
              .sType = VK_STRUCTURE_TYPE_BUFFER_CREATE_INFO,
              .size = buffer_size,
              .usage = VK_BUFFER_USAGE_STORAGE_BUFFER_BIT,
              .sharingMode = VK_SHARING_MODE_EXCLUSIVE,
            };
            VkBuffer buffer = VK_NULL_HANDLE;
            VKCHECK(vkCreateBuffer(device, &bci, NULL, &buffer), 29);
            VkMemoryRequirements req;
            vkGetBufferMemoryRequirements(device, buffer, &req);
            VkPhysicalDeviceMemoryProperties mp;
            vkGetPhysicalDeviceMemoryProperties(pd, &mp);
            uint32_t memory_type = UINT32_MAX;
            for (uint32_t i = 0; i < mp.memoryTypeCount; ++i) {
              VkMemoryPropertyFlags want = VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT | VK_MEMORY_PROPERTY_HOST_COHERENT_BIT;
              if ((req.memoryTypeBits & (1u << i)) && (mp.memoryTypes[i].propertyFlags & want) == want) {
                memory_type = i;
                break;
              }
            }
            if (memory_type == UINT32_MAX) return 30;
            VkMemoryAllocateInfo mai = {
              .sType = VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO,
              .allocationSize = req.size,
              .memoryTypeIndex = memory_type,
            };
            VkDeviceMemory memory = VK_NULL_HANDLE;
            VKCHECK(vkAllocateMemory(device, &mai, NULL, &memory), 31);
            VKCHECK(vkBindBufferMemory(device, buffer, memory, 0), 32);

            uint32_t *mapped = NULL;
            VKCHECK(vkMapMemory(device, memory, 0, buffer_size, 0, (void**)&mapped), 33);
            for (uint32_t i = 0; i < 64; ++i) mapped[i] = i;
            vkUnmapMemory(device, memory);

            VkDescriptorSetLayoutBinding binding = {
              .binding = 0,
              .descriptorType = VK_DESCRIPTOR_TYPE_STORAGE_BUFFER,
              .descriptorCount = 1,
              .stageFlags = VK_SHADER_STAGE_COMPUTE_BIT,
            };
            VkDescriptorSetLayoutCreateInfo dlci = {
              .sType = VK_STRUCTURE_TYPE_DESCRIPTOR_SET_LAYOUT_CREATE_INFO,
              .bindingCount = 1,
              .pBindings = &binding,
            };
            VkDescriptorSetLayout dsl = VK_NULL_HANDLE;
            VKCHECK(vkCreateDescriptorSetLayout(device, &dlci, NULL, &dsl), 34);
            VkDescriptorPoolSize pool_size = { .type = VK_DESCRIPTOR_TYPE_STORAGE_BUFFER, .descriptorCount = 1 };
            VkDescriptorPoolCreateInfo dpci = {
              .sType = VK_STRUCTURE_TYPE_DESCRIPTOR_POOL_CREATE_INFO,
              .maxSets = 1,
              .poolSizeCount = 1,
              .pPoolSizes = &pool_size,
            };
            VkDescriptorPool pool = VK_NULL_HANDLE;
            VKCHECK(vkCreateDescriptorPool(device, &dpci, NULL, &pool), 35);
            VkDescriptorSetAllocateInfo dsai = {
              .sType = VK_STRUCTURE_TYPE_DESCRIPTOR_SET_ALLOCATE_INFO,
              .descriptorPool = pool,
              .descriptorSetCount = 1,
              .pSetLayouts = &dsl,
            };
            VkDescriptorSet set = VK_NULL_HANDLE;
            VKCHECK(vkAllocateDescriptorSets(device, &dsai, &set), 36);
            VkDescriptorBufferInfo dbi = { .buffer = buffer, .offset = 0, .range = buffer_size };
            VkWriteDescriptorSet write = {
              .sType = VK_STRUCTURE_TYPE_WRITE_DESCRIPTOR_SET,
              .dstSet = set,
              .dstBinding = 0,
              .descriptorCount = 1,
              .descriptorType = VK_DESCRIPTOR_TYPE_STORAGE_BUFFER,
              .pBufferInfo = &dbi,
            };
            vkUpdateDescriptorSets(device, 1, &write, 0, NULL);

            size_t spv_bytes = 0;
            uint32_t *spv = read_spv("/usr/local/share/add.spv", &spv_bytes);
            if (!spv) return 37;
            VkShaderModuleCreateInfo smci = {
              .sType = VK_STRUCTURE_TYPE_SHADER_MODULE_CREATE_INFO,
              .codeSize = spv_bytes,
              .pCode = spv,
            };
            VkShaderModule shader = VK_NULL_HANDLE;
            VKCHECK(vkCreateShaderModule(device, &smci, NULL, &shader), 38);
            free(spv);
            VkPipelineLayoutCreateInfo plci = {
              .sType = VK_STRUCTURE_TYPE_PIPELINE_LAYOUT_CREATE_INFO,
              .setLayoutCount = 1,
              .pSetLayouts = &dsl,
            };
            VkPipelineLayout layout = VK_NULL_HANDLE;
            VKCHECK(vkCreatePipelineLayout(device, &plci, NULL, &layout), 39);
            VkPipelineShaderStageCreateInfo stage = {
              .sType = VK_STRUCTURE_TYPE_PIPELINE_SHADER_STAGE_CREATE_INFO,
              .stage = VK_SHADER_STAGE_COMPUTE_BIT,
              .module = shader,
              .pName = "main",
            };
            VkComputePipelineCreateInfo cpci = {
              .sType = VK_STRUCTURE_TYPE_COMPUTE_PIPELINE_CREATE_INFO,
              .stage = stage,
              .layout = layout,
            };
            VkPipeline pipeline = VK_NULL_HANDLE;
            VKCHECK(vkCreateComputePipelines(device, VK_NULL_HANDLE, 1, &cpci, NULL, &pipeline), 40);
            marker("COMPUTE_AFTER_PIPELINE\n");

            VkCommandPoolCreateInfo pool_ci = {
              .sType = VK_STRUCTURE_TYPE_COMMAND_POOL_CREATE_INFO,
              .queueFamilyIndex = qfam,
            };
            VkCommandPool cmd_pool = VK_NULL_HANDLE;
            VKCHECK(vkCreateCommandPool(device, &pool_ci, NULL, &cmd_pool), 41);
            VkCommandBufferAllocateInfo cbai = {
              .sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_ALLOCATE_INFO,
              .commandPool = cmd_pool,
              .level = VK_COMMAND_BUFFER_LEVEL_PRIMARY,
              .commandBufferCount = 1,
            };
            VkCommandBuffer cmd = VK_NULL_HANDLE;
            VKCHECK(vkAllocateCommandBuffers(device, &cbai, &cmd), 42);
            VkCommandBufferBeginInfo cbbi = { .sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_BEGIN_INFO };
            VKCHECK(vkBeginCommandBuffer(cmd, &cbbi), 43);
            vkCmdBindPipeline(cmd, VK_PIPELINE_BIND_POINT_COMPUTE, pipeline);
            vkCmdBindDescriptorSets(cmd, VK_PIPELINE_BIND_POINT_COMPUTE, layout, 0, 1, &set, 0, NULL);
            vkCmdDispatch(cmd, 64, 1, 1);
            VKCHECK(vkEndCommandBuffer(cmd), 44);
            VkSubmitInfo si = {
              .sType = VK_STRUCTURE_TYPE_SUBMIT_INFO,
              .commandBufferCount = 1,
              .pCommandBuffers = &cmd,
            };
            VKCHECK(vkQueueSubmit(queue, 1, &si, VK_NULL_HANDLE), 45);
            VKCHECK(vkQueueWaitIdle(queue), 46);
            marker("COMPUTE_AFTER_DISPATCH\n");

            mapped = NULL;
            VKCHECK(vkMapMemory(device, memory, 0, buffer_size, 0, (void**)&mapped), 47);
            for (uint32_t i = 0; i < 64; ++i) {
              if (mapped[i] != i + 1) {
                fprintf(stderr, "VERIFY_FAIL index=%u got=%u expected=%u\n", i, mapped[i], i + 1);
                return 48;
              }
            }
            vkUnmapMemory(device, memory);
            marker("COMPUTE_VERIFY_OK\n");

            vkDestroyCommandPool(device, cmd_pool, NULL);
            vkDestroyPipeline(device, pipeline, NULL);
            vkDestroyPipelineLayout(device, layout, NULL);
            vkDestroyShaderModule(device, shader, NULL);
            vkDestroyDescriptorPool(device, pool, NULL);
            vkDestroyDescriptorSetLayout(device, dsl, NULL);
            vkDestroyBuffer(device, buffer, NULL);
            vkFreeMemory(device, memory, NULL);
            vkDestroyDevice(device, NULL);
            vkDestroyInstance(instance, NULL);
            marker("COMPUTE_CLEANUP_DONE\n");
            marker("COMPUTE_BEFORE_DLCLOSE\n");
            if (dlclose(vk) != 0) return 49;
            marker("COMPUTE_AFTER_DLCLOSE\n");
            marker("COMPUTE_RETURN\n");
            return 0;
          }
          EOF

          x86_64-linux-gnu-gcc -O2 -g -Wall -Wextra -Werror \
            -I"$GITHUB_WORKSPACE/src/External/Vulkan-Headers/include" \
            /tmp/vulkan-compute.c -ldl -o /tmp/vulkan-compute
          file /tmp/vulkan-compute /tmp/add.spv | tee "$R/compute-inputs.file.txt"
          sha256sum /tmp/vulkan-compute /tmp/add.spv | tee "$R/compute-inputs.sha256.txt"

      - name: Build package-resolved amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap \
            --arch=amd64 --foreign --variant=minbase --components=main,universe \
            --include=libvulkan1,libx11-6 \
            noble "$ROOTFS" http://archive.ubuntu.com/ubuntu \
            >"$R/debootstrap.log" 2>&1
          sudo find "$ROOTFS" -type f -name '*.deb' -print | sort | tee "$R/rootfs-debs.txt"
          sed -n 's/^I: Extracting \([^ ]*\)\.\.\.$/\1/p' "$R/debootstrap.log" \
            | sort -u | tee "$R/rootfs-already-extracted.txt"
          : > "$R/rootfs-deferred-extracted.txt"
          while IFS= read -r deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            if grep -Fxq "$pkg" "$R/rootfs-already-extracted.txt"; then
              continue
            fi
            echo "$pkg" | tee -a "$R/rootfs-deferred-extracted.txt"
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done < "$R/rootfs-debs.txt"

          sudo cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          sudo ln -sf libvulkan.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so"
          sudo mkdir -p "$ROOTFS/usr/local/bin" "$ROOTFS/usr/local/share"
          sudo install -m755 /tmp/vulkan-compute "$ROOTFS/usr/local/bin/vulkan-compute"
          sudo install -m644 /tmp/add.spv "$ROOTFS/usr/local/share/add.spv"

          X11="$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          test -e "$X11"
          for sym in XSync XGetVisualInfo XDisplayString; do
            x86_64-linux-gnu-readelf -Ws "$X11" | grep -E " ${sym}(@|$)" | head -1
          done

      - name: Run x86 headless compute through FEX
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          set +e
          timeout 90s env \
            VK_DRIVER_FILES="$LVP_ICD" \
            FEX_ROOTFS="$ROOTFS" \
            FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /usr/local/bin/vulkan-compute \
            >"$R/fex-compute.out" 2>"$R/fex-compute.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/fex-compute.exit"
          cat "$R/fex-compute.err"

          # Functional success is the verified compute result; teardown is recorded separately.
          grep -Fxq 'COMPUTE_VERIFY_OK' "$R/fex-compute.err"
          if test "$rc" -eq 124; then
            echo 'compute probe timed out' >&2
            exit 1
          fi

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-headless-compute-${{ github.run_id }}
          path: receipts
          if-no-files-found: warn
          retention-days: 30
