name: Derived GL resident bridge runtime

on:
  push:
    branches: [diagnostic/gl-derived-bridge-output]
    paths:
      - .github/workflows/gl-derived-bridge-runtime.yml
      - ThunkLibs/Generator/extract_guest_bridge.py
      - ThunkLibs/libGL/**
      - ThunkLibs/libGL_bridge/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-derived:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-derived
      R: ${{ github.workspace }}/receipts-gl-derived
      H: ${{ github.workspace }}/host-gl-derived
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev xvfb
          git rev-parse HEAD | tee "$R/carrier-sha.txt"

      - name: Build FEX and stock GL host thunk
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer GL-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 320 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libGL-host.so "$H/libGL-host.so"

      - name: Wire committed derived bridge into guest build
        shell: bash
        run: |
          set -euxo pipefail
          test -f ThunkLibs/Generator/extract_guest_bridge.py
          test -f ThunkLibs/libGL_bridge/Guest.cpp
          grep -q 'FEXGetResidentCallerForHostFunction' ThunkLibs/libGL/libGL_Guest.cpp
          grep -q 'FEXAllocateResidentHostTrampolineForGuestFunction' ThunkLibs/libGL/libGL_Guest.cpp

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/GuestLibs/CMakeLists.txt')
          s = p.read_text()
          anchor = '''generate(libGL ${CMAKE_CURRENT_SOURCE_DIR}/../libGL/libGL_interface.cpp)\ntarget_include_directories_from_pkgconfig(libGL-guest-deps gl)\ntarget_include_directories_from_pkgconfig(libGL-guest-deps "xcb;x11;xrandr;xrender")\nadd_guest_lib(GL "libGL.so.1")\n'''
          block = '''generate(libGL ${CMAKE_CURRENT_SOURCE_DIR}/../libGL/libGL_interface.cpp)\ntarget_include_directories_from_pkgconfig(libGL-guest-deps gl)\ntarget_include_directories_from_pkgconfig(libGL-guest-deps "xcb;x11;xrandr;xrender")\n\n# Diagnostic target wiring only: product source and extractor are committed on this branch.\nset(GL_GUEST_INL "${CMAKE_CURRENT_BINARY_DIR}/gen/thunkgen_guest_libGL.inl")\nset(GL_BRIDGE_INL "${CMAKE_CURRENT_BINARY_DIR}/gen/thunkgen_guest_libGL_bridge.inl")\nset(GL_BRIDGE_ACCESSORS "${CMAKE_CURRENT_BINARY_DIR}/gen/thunkgen_guest_libGL_bridge_accessors.inl")\nadd_custom_command(\n  OUTPUT "${GL_BRIDGE_INL}" "${GL_BRIDGE_ACCESSORS}"\n  DEPENDS "${GL_GUEST_INL}" "${FEX_PROJECT_SOURCE_DIR}/ThunkLibs/Generator/extract_guest_bridge.py"\n  COMMAND "${Python3_EXECUTABLE}"\n    "${FEX_PROJECT_SOURCE_DIR}/ThunkLibs/Generator/extract_guest_bridge.py"\n    "${GL_GUEST_INL}" "${GL_BRIDGE_INL}" "${GL_BRIDGE_ACCESSORS}" --prefix libGL\n  VERBATIM)\nadd_custom_target(GL-bridge-generated DEPENDS "${GL_BRIDGE_INL}" "${GL_BRIDGE_ACCESSORS}")\n\nadd_library(libGL_bridge-guest-deps INTERFACE)\ntarget_link_libraries(libGL_bridge-guest-deps INTERFACE libGL-guest-deps)\nset(GEN_libGL_bridge "${GL_BRIDGE_INL}" "${GL_BRIDGE_ACCESSORS}")\nadd_guest_lib(GL_bridge "libfex-GL-bridge.so")\nset_target_properties(GL_bridge-guest PROPERTIES OUTPUT_NAME "fex-GL-bridge")\ntarget_link_options(GL_bridge-guest PRIVATE "LINKER:-z,nodelete")\nadd_dependencies(GL_bridge-guest GL-bridge-generated)\n\nadd_guest_lib(GL "libGL.so.1")\ntarget_link_libraries(GL-guest PRIVATE GL_bridge-guest)\nadd_dependencies(GL-guest GL-bridge-generated)\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'GL guest CMake anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor, block, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/GuestLibs/CMakeLists.txt | tee "$R/cmake-wiring.diff"

          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest --target GL-guest GL_bridge-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 400 "$R/build-guest.log"; exit 1; }

          test -f guest/libGL-guest.so
          test -f guest/libfex-GL-bridge.so
          readelf -d guest/libGL-guest.so | tee "$R/wrapper.dynamic"
          readelf -d guest/libfex-GL-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          grep -q 'NEEDED.*libfex-GL-bridge.so' "$R/wrapper.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"
          grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL.inl | tee "$R/guest-callback-count.txt"
          grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL_bridge.inl | tee "$R/bridge-callback-count.txt"
          diff -u <(grep -E '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL.inl | sed -E 's/^[[:space:]]+//') \
                  <(grep -E '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL_bridge.inl | sed -E 's/^[[:space:]]+//') \
                  > "$R/callback-set.diff"
          stat -c 'bridge_file_bytes=%s' guest/libfex-GL-bridge.so | tee "$R/bridge-size.txt"

      - name: Create amd64 rootfs and moved-reload probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libGL-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libGL.so.1"
          cp guest/libfex-GL-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-GL-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11stub.c <<'EOF'
          #include <stdio.h>
          typedef int (*XErrorHandler)(void *, void *);
          int XSync(void*d,int discard){fprintf(stderr,"GUEST_XSYNC display=%p discard=%d\n",d,discard);return 0;}
          void *XGetVisualInfo(void*d,long m,void*t,int*c){(void)d;(void)m;(void)t;if(c)*c=0;return 0;}
          const char *XDisplayString(void*d){fprintf(stderr,"GUEST_XDISPLAYSTRING display=%p\n",d);return ":99";}
          XErrorHandler XSetErrorHandler(XErrorHandler h){return h;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/glprobe.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>

          typedef void (*VoidFunc)(void);
          typedef VoidFunc (*GLXGET)(const unsigned char *);
          typedef unsigned int (*GLGETERROR)(void);
          typedef int (*GLXQUERYEXT)(void *, int *, int *);
          struct span { uintptr_t a,b; }; static struct span old[16]; static unsigned oldn;

          static int map_has(void *p,const char *needle,int verbose){FILE*f=fopen("/proc/self/maps","r");char l[1024];uintptr_t x=(uintptr_t)p;if(!f)return -1;while(fgets(l,sizeof l,f)){unsigned long a,b;if(sscanf(l,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){if(verbose)fprintf(stderr,"MAP %p %s",p,l);int ok=strstr(l,needle)!=0;fclose(f);return ok;}}fclose(f);if(verbose)fprintf(stderr,"UNMAPPED %p\n",p);return 0;}
          static int maps_contain(const char *needle){FILE*f=fopen("/proc/self/maps","r");char l[1024];if(!f)return 0;while(fgets(l,sizeof l,f)){if(strstr(l,needle)){fclose(f);return 1;}}fclose(f);return 0;}
          static void capture(void){FILE*f=fopen("/proc/self/maps","r");char l[1024];oldn=0;if(!f)exit(70);while(fgets(l,sizeof l,f)){unsigned long a,b;if(strstr(l,"/usr/lib/x86_64-linux-gnu/libGL.so.1")&&sscanf(l,"%lx-%lx",&a,&b)==2&&oldn<16){old[oldn++]=(struct span){a,b};fprintf(stderr,"OLD_GL_RANGE %lx-%lx\n",a,b);}}fclose(f);if(!oldn)exit(71);}
          static void reserve_old(void){for(unsigned i=0;i<oldn;i++){size_t n=old[i].b-old[i].a;void*r=mmap((void*)old[i].a,n,PROT_NONE,MAP_PRIVATE|MAP_ANONYMOUS|MAP_FIXED_NOREPLACE,-1,0);if(r==MAP_FAILED){fprintf(stderr,"RESERVE_FAIL %lx-%lx errno=%d %s\n",old[i].a,old[i].b,errno,strerror(errno));exit(72);}}}
          int main(void){
            void*x11hold=dlopen("libX11.so.6",RTLD_NOW|RTLD_LOCAL);if(!x11hold){fprintf(stderr,"X11_HOLD_FAIL %s\n",dlerror());return 1;}
            void*h=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL);if(!h){fprintf(stderr,"DLOPEN_FAIL %s\n",dlerror());return 2;}
            GLXGET get0=(GLXGET)dlsym(h,"glXGetProcAddress");if(!get0)return 3;
            GLGETERROR p0=(GLGETERROR)get0((const unsigned char*)"glGetError");if(!p0)return 4;
            GLXQUERYEXT q0=(GLXQUERYEXT)get0((const unsigned char*)"glXQueryExtension");if(!q0)return 16;
            unsigned int e0=p0();fprintf(stderr,"GEN1 get=%p H=%p glxH=%p error=%u bridge=%d\n",(void*)get0,(void*)p0,(void*)q0,e0,maps_contain("/libfex-GL-bridge.so"));if(e0!=0)return 5;if(!maps_contain("/libfex-GL-bridge.so"))return 6;capture();
            if(dlclose(h))return 7;if(map_has((void*)get0,"/usr/lib/x86_64-linux-gnu/libGL.so.1",1)!=0)return 8;if(!maps_contain("/libfex-GL-bridge.so"))return 9;
            unsigned int er=p0();fprintf(stderr,"RETAINED_AFTER_CLOSE error=%u\n",er);if(er!=0)return 10;
            void*fresh_display=malloc(16);if(!fresh_display)return 17;int error_base=-1,event_base=-1;
            fprintf(stderr,"POST_CLOSE_GLX_BEGIN H=%p display=%p\n",(void*)q0,fresh_display);
            int qrc=q0(fresh_display,&error_base,&event_base);
            fprintf(stderr,"POST_CLOSE_GLX_END rc=%d error=%d event=%d\n",qrc,error_base,event_base);
            fprintf(stderr,"DERIVED_GLX_CALLBACK_AFTER_CLOSE_OK\n");
            free(fresh_display);
            reserve_old();
            void*h2=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL);if(!h2){fprintf(stderr,"RELOAD_FAIL %s\n",dlerror());return 11;}GLXGET get1=(GLXGET)dlsym(h2,"glXGetProcAddress");GLGETERROR p1=(GLGETERROR)get1((const unsigned char*)"glGetError");
            fprintf(stderr,"GEN2 get_old=%p get_new=%p moved=%d H_old=%p H_new=%p same_H=%d bridge=%d\n",(void*)get0,(void*)get1,get0!=get1,(void*)p0,(void*)p1,p0==p1,maps_contain("/libfex-GL-bridge.so"));if(get0==get1||p0!=p1)return 12;unsigned int e1=p1();if(e1!=0)return 13;if(dlclose(h2))return 14;unsigned int ef=p0();fprintf(stderr,"FINAL_RETAINED error=%u\n",ef);if(ef!=0)return 15;
            if(dlclose(x11hold))return 18;
            fprintf(stderr,"DERIVED_GL_BRIDGE_OK\n");return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation /tmp/glprobe.c -ldl -o "$ROOTFS/opt/fex-ci/glprobe"

      - name: Run derived GL bridge lifetime
        shell: bash
        run: |
          set -uxo pipefail
          Xvfb :99 -screen 0 640x480x24 +extension GLX -nolisten tcp > "$R/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 50); do
            test -S /tmp/.X11-unix/X99 && break
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99
          export DISPLAY=:99
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 45s \
            build/Bin/FEX /opt/fex-ci/glprobe > "$R/probe.out" 2> "$R/probe.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/probe.exit"
          cat "$R/probe.err"
          test "$rc" -eq 0
          grep -q 'DERIVED_GL_BRIDGE_OK' "$R/probe.err"
          grep -q 'DERIVED_GLX_CALLBACK_AFTER_CLOSE_OK' "$R/probe.err"
          grep -q 'moved=1' "$R/probe.err"
          grep -q 'same_H=1' "$R/probe.err"
          python3 - "$R/probe.err" <<'PY'
          import sys
          text = open(sys.argv[1]).read()
          markers = [
              'POST_CLOSE_GLX_BEGIN',
              'GUEST_XSYNC',
              'GUEST_XDISPLAYSTRING',
              'POST_CLOSE_GLX_END',
              'DERIVED_GLX_CALLBACK_AFTER_CLOSE_OK',
          ]
          offsets = [text.find(marker) for marker in markers]
          if any(offset < 0 for offset in offsets) or offsets != sorted(offsets):
              raise SystemExit(f'bad GLX callback marker order: {list(zip(markers, offsets))}')
          print('GLX_CALLBACK_MARKER_ORDER_OK')
          PY

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-derived-bridge-${{ github.run_id }}
          path: receipts-gl-derived
          retention-days: 30
