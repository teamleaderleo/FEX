name: Agent C amend GDPA self query

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths:
      - .github/workflows/agent-c-amend-gdpa-self.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vulkan-callback-proc-routing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve guest GDPA self entrypoint after native approval
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libvulkan/Guest.cpp')
          s = p.read_text()
          old = '''PFN_vkVoidFunction vkGetDeviceProcAddr(VkDevice a_0, const char* a_1) {
            auto Ret = fexfn_pack_vkGetDeviceProcAddr(a_0, a_1);
            if (!Ret) {
              return nullptr;
            }
            return MakeGuestCallable(__FUNCTION__, Ret, a_1);
          }
          '''
          new = '''PFN_vkVoidFunction vkGetDeviceProcAddr(VkDevice a_0, const char* a_1) {
            auto Ret = fexfn_pack_vkGetDeviceProcAddr(a_0, a_1);
            if (!Ret) {
              return nullptr;
            }

            if (a_1 == std::string_view {"vkGetDeviceProcAddr"}) {
              return (PFN_vkVoidFunction)vkGetDeviceProcAddr;
            }

            return MakeGuestCallable(__FUNCTION__, Ret, a_1);
          }
          '''
          # GitHub Actions YAML removes the common script indentation above.
          if s.count(old) != 1:
              raise SystemExit(f'expected one guest GDPA body, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/libvulkan/Guest.cpp
          git config user.name 'Agent C internal fieldwork'
          git config user.email 'actions@users.noreply.github.com'
          git add ThunkLibs/libvulkan/Guest.cpp
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/vulkan-callback-proc-routing
