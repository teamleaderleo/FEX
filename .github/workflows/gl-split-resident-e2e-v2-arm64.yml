name: Real GL split resident bridge lifetime v2

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/workflows/gl-split-resident-e2e-v2-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-split-v2:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-split
      R: ${{ github.workspace }}/receipts-gl-split
      H: ${{ github.workspace }}/host-gl-split
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Extract original experiment shell steps with probe-only fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/gl-split-resident-e2e-arm64.yml').read_text().splitlines()
          scripts = []
          i = 0
          while i < len(source):
              line = source[i]
              stripped = line.lstrip()
              if stripped != 'run: |':
                  i += 1
                  continue
              base = len(line) - len(stripped)
              block = []
              i += 1
              while i < len(source):
                  row = source[i]
                  if row.strip() and len(row) - len(row.lstrip()) <= base:
                      break
                  if not row.strip():
                      block.append('')
                  else:
                      block.append(row[base + 2:])
                  i += 1
              text = '\n'.join(block) + '\n'

              # Probe-only fix 1: keep the tiny C formatting warning from
              # aborting the experiment under -Werror.
              text = text.replace(
                  'x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/glprobe.c',
                  'x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation /tmp/glprobe.c')

              # Probe-only fix 2: before dlclose(), glXGetProcAddress itself
              # must still belong to the wrapper. The original assertion was
              # accidentally inverted and returned 10 on the expected mapping.
              bad = 'if(map_has((void*)get0,"/usr/lib/x86_64-linux-gnu/libGL.so.1",1)!=0)return 10;if(map_has(T,"/libfex-GL-bridge.so",1)!=1)return 11;'
              good = 'if(map_has((void*)get0,"/usr/lib/x86_64-linux-gnu/libGL.so.1",1)!=1)return 10;if(map_has(T,"/libfex-GL-bridge.so",1)!=1)return 11;'
              text = text.replace(bad, good)
              scripts.append(text)

          if len(scripts) < 5:
              raise SystemExit(f'expected at least five original shell steps, got {len(scripts)}')
          out = Path('/tmp/gl-split-v2-steps')
          out.mkdir(exist_ok=True)
          for n, script in enumerate(scripts, 1):
              p = out / f'{n:02d}.sh'
              p.write_text('#!/usr/bin/env bash\n' + script)
              p.chmod(0o755)
              print(f'EXTRACTED {p} bytes={p.stat().st_size}')
          PY

      - name: Execute original experiment steps
        shell: bash
        run: |
          set -euxo pipefail
          for step in /tmp/gl-split-v2-steps/*.sh; do
            echo "===== EXECUTING $step ====="
            "$step"
          done

      - name: Assert real GL split lifetime result
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$R/glprobe.err"
          cat "$R/glprobe.err"
          grep -q 'REAL_GL_SPLIT_BRIDGE_OK' "$R/glprobe.err"
          grep -q 'AFTER_CLOSE H=' "$R/glprobe.err"
          grep -q 'AFTER_RELOAD' "$R/glprobe.err"
          grep -q 'FINAL_CALL' "$R/glprobe.err"
          echo REAL_GL_SPLIT_BRIDGE_V2_PASS

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-split-resident-e2e-v2-${{ github.run_id }}
          path: receipts-gl-split
          retention-days: 30
