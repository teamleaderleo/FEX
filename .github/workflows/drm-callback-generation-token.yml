name: DRM callback generation token carrier

on:
  push:
    branches: [ci/drm-callback-generation-token-20260814]
    paths:
      - .github/workflows/drm-callback-generation-token.yml
      - .github/fieldwork/apply_callback_generation_token_diag.py
      - AGENTS.md
      - CONTRIBUTING.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PRODUCT_SHA: f3ab82a73fb48271ee12a882c98bc5d823a2b4d1
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-token
      HOST: ${{ github.workspace }}/host-thunks
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10

      - name: Dependencies and product provenance
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          git log --oneline -10 | tee "$R/lineage.txt"
          git diff --name-only "$PRODUCT_SHA" -- ThunkLibs FEXCore Source | tee "$R/pre-patch-product-source-diff.txt"
          test ! -s "$R/pre-patch-product-source-diff.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libdrm-dev libgl-dev

      - name: Native pipe-fed control
        shell: bash
        run: |
          set -euxo pipefail
          cc -O2 -Wall -Wextra -Werror -I/usr/include/libdrm \
            LinuxFieldwork/drm_event_callback_probe.c -ldl -o "$R/native-probe"
          "$R/native-probe" > "$R/native.stdout" 2> "$R/native.stderr"
          echo $? > "$R/native.exit"
          grep -q 'DRM_CALLBACK count=1' "$R/native.stderr"
          grep -q 'MARK handle-return rc=0 callbacks=1' "$R/native.stderr"

      - name: Apply real DRM callback bridge and private token carrier
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_drm_event_callback_bridge.py
          python3 .github/fieldwork/apply_callback_generation_token_diag.py
          git diff --check
          git diff -- \
            ThunkLibs/libdrm/libdrm_interface.cpp \
            ThunkLibs/libdrm/Guest.cpp \
            ThunkLibs/include/common/Host.h \
            Source/Tools/LinuxEmulation/Thunks.cpp \
            | tee "$R/callback-token.diff"
          printf '%s\n' \
            Source/Tools/LinuxEmulation/Thunks.cpp \
            ThunkLibs/include/common/Host.h \
            ThunkLibs/libdrm/Guest.cpp \
            ThunkLibs/libdrm/libdrm_interface.cpp \
            > "$R/expected-product-diff.txt"
          git diff --name-only -- ThunkLibs FEXCore Source | sort > "$R/actual-product-diff.txt"
          diff -u "$R/expected-product-diff.txt" "$R/actual-product-diff.txt"

      - name: Build candidate FEX and DRM thunks
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer drm-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 200 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libdrm-host.so "$HOST/libdrm-host.so"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest-build --target drm-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 200 "$R/build-guest.log"; exit 1; }

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-build/libdrm-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libdrm.so.2"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -I/usr/include/libdrm \
            LinuxFieldwork/drm_event_callback_probe.c -ldl -o "$ROOTFS/opt/fex-ci/drm-event-probe"

      - name: Execute real callback token carrier
        shell: bash
        run: |
          set -uxo pipefail
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$GITHUB_WORKSPACE/build/Bin/FEX" /opt/fex-ci/drm-event-probe \
            > "$R/candidate.stdout" 2> "$R/candidate.stderr"
          candidate_rc=$?
          set -e
          echo "$candidate_rc" > "$R/candidate.exit"
          cat "$R/candidate.stderr"
          test "$candidate_rc" = 0
          grep -q 'DRM_CALLBACK count=1' "$R/candidate.stderr"
          grep -q 'MARK handle-return rc=0 callbacks=1' "$R/candidate.stderr"
          grep -Eq 'DIAG_CALLBACK_TOKEN token=[1-9][0-9]* ' "$R/candidate.stderr"
          token="$(sed -n 's/.*DIAG_CALLBACK_TOKEN token=\([0-9][0-9]*\).*/\1/p' "$R/candidate.stderr" | head -1)"
          test -n "$token"
          printf 'native=%s\ncandidate=%s\ncallback_token=%s\n' \
            "$(cat "$R/native.exit")" "$candidate_rc" "$token" | tee "$R/final-matrix.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drm-callback-generation-token-${{ github.run_id }}
          path: receipts-token
          retention-days: 30
