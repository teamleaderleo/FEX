name: Agent C Vulkan current-main consolidated regression

on:
  workflow_dispatch:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths: [.github/workflows/agent-c-vulkan-current-main-consolidated.yml]

permissions:
  contents: read

env:
  FEX_SHA: 2665bfecd29387357c40e63432c684b36f21849a
  UPSTREAM_BASE_SHA: f3ab82a73fb48271ee12a882c98bc5d823a2b4d1
  FIELDWORK_SHA: 6a03da49448260780731a4fb72a01f1d51f3967f
  DEBIAN_FRONTEND: noninteractive
  ROOTFS: ${{ github.workspace }}/rootfs-amd64
  HOST: ${{ github.workspace }}/host
  R: ${{ github.workspace }}/receipts
  FEX_PORTABLE: 1

jobs:
  consolidated:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Exact identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          test "$(git -C fieldwork rev-parse HEAD)" = "$FIELDWORK_SHA"
          git -C src diff --exit-code
          {
            echo "upstream_base_sha=$UPSTREAM_BASE_SHA"
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            echo "fieldwork_sha=$(git -C fieldwork rev-parse HEAD)"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools \
            vulkan-validationlayers debootstrap
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" | tee "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

      - name: Generate exact 760-name non-beta corpus
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import collections, json, pathlib, xml.etree.ElementTree as ET
          root=ET.parse('src/External/Vulkan-Headers/registry/vk.xml').getroot()
          aliases={}
          for c in root.findall('./commands/command'):
            if c.get('alias'):
              aliases[c.get('name')]=c.get('alias')
          def canon(n):
            seen=set()
            while n in aliases and n not in seen:
              seen.add(n); n=aliases[n]
            return n
          regular=set(); nonbeta=set(); beta=set()
          for feature in root.findall('./feature'):
            if 'vulkan' not in set((feature.get('api') or '').split(',')): continue
            for req in feature.findall('./require'):
              if 'vulkan' not in set((req.get('api') or 'vulkan').split(',')): continue
              for cmd in req.findall('command'):
                n=cmd.get('name')
                if n: regular.add(n); nonbeta.add(n)
          for ext in root.findall('./extensions/extension'):
            if 'vulkan' not in set((ext.get('supported') or '').split(',')): continue
            is_beta=(ext.get('provisional') == 'true')
            for req in ext.findall('./require'):
              req_api=req.get('api')
              if req_api and 'vulkan' not in set(req_api.split(',')): continue
              for cmd in req.findall('command'):
                n=cmd.get('name')
                if not n: continue
                regular.add(n)
                (beta if is_beta else nonbeta).add(n)
          beta_only=regular-nonbeta
          names=sorted(nonbeta)
          summary={
            'all_regular_spellings':len(regular),
            'nonbeta_spellings':len(names),
            'beta_only_spellings':len(beta_only),
            'nonbeta_alias_spellings':sum(n in aliases for n in names),
            'nonbeta_canonical_commands':len({canon(n) for n in names}),
          }
          expected={
            'all_regular_spellings':773,
            'nonbeta_spellings':760,
            'beta_only_spellings':13,
            'nonbeta_alias_spellings':105,
            'nonbeta_canonical_commands':655,
          }
          print(json.dumps(summary,indent=2))
          if summary != expected:
            raise SystemExit(f'unexpected corpus: {summary}')
          pathlib.Path('receipts/commands.txt').write_text(''.join(n+'\n' for n in names))
          pathlib.Path('receipts/corpus-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Build probes and native controls
        shell: bash
        run: |
          set -euxo pipefail
          CB=fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c
          PN=fieldwork/investigations/fex-vulkan-thunk-lifecycle/instance_pnext_callback_integrity_probe.c
          PR=fieldwork/investigations/fex-vulkan-thunk-lifecycle/vulkan_proc_availability_probe.c
          INC=-Isrc/External/Vulkan-Headers/include
          cc -O2 -g -Wall -Wextra -Werror "$CB" -ldl -o /tmp/callback-arm64
          x86_64-linux-gnu-gcc -O2 -g -Wall -Wextra -Werror "$CB" -ldl -o /tmp/callback-x86_64
          x86_64-linux-gnu-gcc -O2 -g -std=gnu11 -Wall -Wextra -Werror $INC "$PN" -ldl -o /tmp/pnext-x86_64
          cc -O2 -g -std=gnu11 -Wall -Wextra -Werror $INC "$PR" -ldl -o /tmp/proc-arm64
          x86_64-linux-gnu-gcc -O2 -g -std=gnu11 -Wall -Wextra -Werror $INC "$PR" -ldl -o /tmp/proc-x86_64
          file /tmp/callback-arm64 /tmp/callback-x86_64 /tmp/pnext-x86_64 /tmp/proc-arm64 /tmp/proc-x86_64 | tee "$R/probes.file.txt"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-arm64 report gipa positive >"$R/native-report.out" 2>"$R/native-report.err"
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-arm64 utils gipa positive >"$R/native-utils.out" 2>"$R/native-utils.err"
          grep -q '^PROBE_FINISH callback_count=[1-9][0-9]* status=0' "$R/native-report.err"
          grep -q '^PROBE_FINISH callback_count=[1-9][0-9]* status=0' "$R/native-utils.err"
          VK_DRIVER_FILES="$LVP_ICD" /tmp/proc-arm64 "$R/commands.txt" >"$R/native-proc.tsv" 2>"$R/native-proc.err"
          test "$(($(wc -l < "$R/native-proc.tsv") - 1))" -eq 760

      - name: Build focused current-main Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"
          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1
          file src/build/Bin/FEX src/build/Bin/FEXServer "$HOST/libvulkan-host.so" guest/libvulkan-guest.so >"$R/build-products.file.txt"

      - name: Build amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap --arch=amd64 --foreign --variant=minbase --components=main,universe \
            --include=libvulkan1,libx11-6 noble "$ROOTFS" http://archive.ubuntu.com/ubuntu >"$R/debootstrap.log" 2>&1
          sudo find "$ROOTFS" -type f -name '*.deb' -print | sort > "$R/rootfs-debs.txt"
          sed -n 's/^I: Extracting \([^ ]*\)\.\.\.$/\1/p' "$R/debootstrap.log" | sort -u > "$R/rootfs-already-extracted.txt"
          while IFS= read -r deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            grep -Fxq "$pkg" "$R/rootfs-already-extracted.txt" && continue
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done < "$R/rootfs-debs.txt"
          sudo cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          sudo ln -sf libvulkan.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so"
          sudo mkdir -p "$ROOTFS/usr/local/bin" "$ROOTFS/usr/local/share"
          sudo install -m755 /tmp/callback-x86_64 "$ROOTFS/usr/local/bin/callback-probe"
          sudo install -m755 /tmp/pnext-x86_64 "$ROOTFS/usr/local/bin/pnext-probe"
          sudo install -m755 /tmp/proc-x86_64 "$ROOTFS/usr/local/bin/proc-probe"
          sudo install -m644 "$R/commands.txt" "$ROOTFS/usr/local/share/vulkan-commands.txt"
          X11="$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          for sym in XSync XGetVisualInfo XDisplayString; do
            x86_64-linux-gnu-readelf -Ws "$X11" | grep -E " ${sym}(@|$)" | head -1
          done

      - name: Run callback routing matrix through FEX
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          run_case() {
            local name="$1" kind="$2" lookup="$3"
            timeout 90s env VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
              "$FEX" /usr/local/bin/callback-probe "$kind" "$lookup" 0 \
              >"$R/callback-${name}.out" 2>"$R/callback-${name}.err"
            grep -q '^PROBE_FINISH callback_count=0 status=0' "$R/callback-${name}.err"
          }
          run_case report-direct report direct
          run_case report-gipa report gipa
          run_case utils-direct utils direct
          run_case utils-gipa utils gipa
          printf 'report-direct=0\nreport-gipa=0\nutils-direct=0\nutils-gipa=0\n' | tee "$R/callback-summary.txt"

      - name: Run mixed pNext restoration through FEX
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          timeout 90s env VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /usr/local/bin/pnext-probe >"$R/pnext.out" 2>"$R/pnext.err"
          cat "$R/pnext.err"
          grep -q '^RESTORE_AFTER_CREATE .*ici_same=1 report_same=1 utils_same=1 callbacks=0/0' "$R/pnext.err"
          grep -q '^RESTORE_AFTER_DESTROY ici_same=1 report_same=1 utils_same=1 callbacks=0/0' "$R/pnext.err"
          grep -q '^RESTORE_RETURN unchanged=1 callbacks=0' "$R/pnext.err"
          ! grep -q '^UNEXPECTED_' "$R/pnext.err"
          printf 'pnext_exit=0\nguest_chain_unchanged=1\nguest_callbacks=0\n' | tee "$R/pnext-summary.txt"

      - name: Run 760-name non-beta proc parity through FEX
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          timeout 120s env VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /usr/local/bin/proc-probe /usr/local/share/vulkan-commands.txt \
            >"$R/fex-proc.tsv" 2>"$R/fex-proc.err"
          test "$(($(wc -l < "$R/fex-proc.tsv") - 1))" -eq 760
          python3 fieldwork/investigations/fex-vulkan-thunk-lifecycle/compare_vulkan_proc_availability.py \
            "$R/native-proc.tsv" "$R/fex-proc.tsv" --json "$R/proc-diff.json" --text "$R/proc-summary.txt"
          cat "$R/proc-summary.txt"
          python3 - <<'PY'
          import json
          data=json.load(open('receipts/proc-diff.json'))
          for name in ('gipa_null','gipa_instance','gdpa_device'):
            col=data['columns'][name]
            if col['fex_extra_nonnull'] or col['fex_missing_nonnull']:
              raise SystemExit(f'{name} mismatch: {col}')
            if col['matches'] != 760:
              raise SystemExit(f'{name} match count: {col}')
          PY

      - name: Final consolidated summary
        shell: bash
        run: |
          set -euxo pipefail
          cat "$R/callback-summary.txt" "$R/pnext-summary.txt" "$R/proc-summary.txt"
          cat >"$R/final-summary.txt" <<EOF
          upstream_base=$UPSTREAM_BASE_SHA
          candidate=$FEX_SHA
          callback_matrix=pass
          pnext_restoration=pass
          nonbeta_proc_count=760
          gipa_null=760/760
          gipa_instance=760/760
          gdpa_device=760/760
          EOF
          cat "$R/final-summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-c-vulkan-current-main-consolidated-${{ github.run_id }}
          path: receipts
          retention-days: 30
