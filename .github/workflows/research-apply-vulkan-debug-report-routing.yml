name: Research validate guest thunk lifetime

on:
  push:
    branches: [linux-fieldwork/fex-guest-thunk-selfpin]
    paths:
      - .github/workflows/research-apply-vulkan-debug-report-routing.yml

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang-18 lld-18 clang-tools-18 libclang-18-dev llvm-18-dev pkg-config ccache gcc-x86-64-linux-gnu g++-x86-64-linux-gnu gcc-i686-linux-gnu g++-i686-linux-gnu libc6-dev-i386-cross libcap-dev libglfw3-dev libepoxy-dev python3-dev libsdl2-dev libasound2-dev libdrm-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev libgl-dev libegl-dev libvulkan-dev
      - name: Build
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$PWD/install" -DUSE_LINKER=lld -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DENABLE_LTO=False -DENABLE_ASSERTIONS=True -DBUILD_TESTING=True -DBUILD_THUNKS=True -DBUILD_FEX_LINUX_TESTS=True -DBUILD_FEXCONFIG=False -DENABLE_CLANG_THUNKS=True -DRANGES_NATIVE=OFF
          cmake --build build -j"$(nproc)"
      - name: Run regression
        run: ctest --test-dir build --output-on-failure -R '^thunk_testlib\.64\.jit\.flt$'
