name: Minimal GL split resident PFN lifetime

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/fieldwork/apply_gl_split_bridge.py
      - .github/workflows/gl-split-resident-v3-pfn-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-split-v3-pfn:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-v3-pfn
      R: ${{ github.workspace }}/receipts-gl-v3-pfn
      H: ${{ github.workspace }}/host-gl-v3-pfn
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies, minimal transform, and build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev
          python3 .github/fieldwork/apply_gl_split_bridge.py .
          git diff --check
          CC=clang-18 CXX=clang++-18 cmake -S . -B build-pfn -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build-pfn --target FEX FEXServer GL-host-64 -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1
          cp build-pfn/HostLibs_64/libGL-host.so "$H/libGL-host.so"
          cmake -S ThunkLibs/GuestLibs -B guest-pfn -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build-pfn/Bin/thunkgen" -DX86_DEV_ROOTFS=/ > "$R/cmake-guest.log" 2>&1
          cmake --build guest-pfn --target GL-guest GL-lifetime-bridge -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1
          readelf -d guest-pfn/libGL-guest.so | tee "$R/wrapper.dynamic"
          readelf -d guest-pfn/libfex-GL-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"

      - name: Build amd64 PFN lifetime probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-pfn/libGL-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libGL.so.1"
          cp guest-pfn/libfex-GL-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-GL-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cat >/tmp/x11stub.c <<'EOF'
          typedef int (*XErrorHandler)(void *, void *);
          int XSync(void*d,int discard){(void)d;(void)discard;return 0;}
          void *XGetVisualInfo(void*d,long m,void*t,int*c){(void)d;(void)m;(void)t;if(c)*c=0;return 0;}
          char *XDisplayString(void*d){(void)d;static char s[]=":0";return s;}
          XErrorHandler XSetErrorHandler(XErrorHandler h){return h;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/glpfn.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mman.h>
          typedef void (*VoidFunc)(void); typedef VoidFunc(*GLXGET)(const unsigned char*); typedef unsigned int(*ERR)(void); typedef uintptr_t(*LOOK)(const char*);
          struct range{uintptr_t a,b;} old[16]; static int oldn;
          static int map_has(void*p,const char*n){FILE*f=fopen("/proc/self/maps","r");char l[1024];uintptr_t x=(uintptr_t)p;if(!f)return -1;while(fgets(l,sizeof l,f)){unsigned long a,b;if(sscanf(l,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){int ok=strstr(l,n)!=0;fprintf(stderr,"MAP %p %s",p,l);fclose(f);return ok;}}fclose(f);fprintf(stderr,"UNMAPPED %p\n",p);return 0;}
          static void capture(void){FILE*f=fopen("/proc/self/maps","r");char l[1024];oldn=0;while(f&&fgets(l,sizeof l,f)&&oldn<16){unsigned long a,b;if(strstr(l,"/usr/lib/x86_64-linux-gnu/libGL.so.1")&&sscanf(l,"%lx-%lx",&a,&b)==2){old[oldn++]=(struct range){a,b};fprintf(stderr,"OLD %lx-%lx\n",a,b);}}if(f)fclose(f);}
          static int reserve(void){for(int i=0;i<oldn;i++){size_t n=old[i].b-old[i].a;void*p=mmap((void*)old[i].a,n,PROT_NONE,MAP_PRIVATE|MAP_ANONYMOUS|MAP_FIXED_NOREPLACE,-1,0);if(p==MAP_FAILED){fprintf(stderr,"RESERVE_FAIL %d %lx-%lx errno=%d\n",i,old[i].a,old[i].b,errno);return -1;}fprintf(stderr,"RESERVED %lx-%lx\n",old[i].a,old[i].b);}return 0;}
          int main(void){
            void*h=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL);if(!h)return 2;GLXGET get0=(GLXGET)dlsym(h,"glXGetProcAddress");if(!get0)return 3;ERR p0=(ERR)get0((const unsigned char*)"glGetError");if(!p0)return 4;
            void*bh=dlopen("libfex-GL-bridge.so",RTLD_NOW|RTLD_NOLOAD);if(!bh)return 5;LOOK lookup=(LOOK)dlsym(bh,"FEXGLBridgeLookup");if(!lookup)return 6;void*t=(void*)lookup("glGetError");
            fprintf(stderr,"GEN1 get=%p H=%p T=%p error=%u\n",(void*)get0,(void*)p0,t,p0());if(p0()!=0)return 7;if(map_has(t,"/libfex-GL-bridge.so")!=1)return 8;capture();dlclose(bh);if(dlclose(h))return 9;
            if(map_has((void*)get0,"/usr/lib/x86_64-linux-gnu/libGL.so.1")!=0)return 10;if(map_has(t,"/libfex-GL-bridge.so")!=1)return 11;fprintf(stderr,"AFTER_CLOSE retained_error=%u\n",p0());if(p0()!=0)return 12;if(reserve())return 13;
            void*h2=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL);if(!h2){fprintf(stderr,"RELOAD_FAIL %s\n",dlerror());return 14;}GLXGET get1=(GLXGET)dlsym(h2,"glXGetProcAddress");ERR p1=(ERR)get1((const unsigned char*)"glGetError");fprintf(stderr,"GEN2 get_old=%p get_new=%p moved=%d H_old=%p H_new=%p same_H=%d error=%u\n",(void*)get0,(void*)get1,get0!=get1,(void*)p0,(void*)p1,p0==p1,p1());if(get0==get1||p0!=p1||p1()!=0)return 15;if(dlclose(h2))return 16;if(p0()!=0)return 17;fprintf(stderr,"REAL_GL_SPLIT_V3_PFN_OK\n");return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -Wno-error=misleading-indentation /tmp/glpfn.c -ldl -o "$ROOTFS/opt/fex-ci/glpfn"

      - name: Execute PFN-only unload and moved reload
        shell: bash
        run: |
          set -euxo pipefail
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 40s build-pfn/Bin/FEX /opt/fex-ci/glpfn > "$R/probe.out" 2> "$R/probe.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/probe.exit"
          cat "$R/probe.err"
          test "$rc" -eq 0
          grep -q 'AFTER_CLOSE retained_error=0' "$R/probe.err"
          grep -q 'moved=1' "$R/probe.err"
          grep -q 'same_H=1' "$R/probe.err"
          grep -q 'REAL_GL_SPLIT_V3_PFN_OK' "$R/probe.err"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-split-v3-pfn-${{ github.run_id }}
          path: receipts-gl-v3-pfn
          retention-days: 30
