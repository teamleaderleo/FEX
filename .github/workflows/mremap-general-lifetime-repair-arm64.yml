name: General mremap lifetime repair ARM64

on:
  push:
    branches: [ci/mremap-general-lifetime-repair-20260814]
    paths:
      - diagnostics/mremap-general-owner/**
      - .github/fieldwork/**
      - .github/workflows/mremap-general-lifetime-repair-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mremap-general-lifetime-repair-20260814
  cancel-in-progress: true

jobs:
  mremap-general-repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-mremap-general-repair
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config libcap-dev \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'carrier=%s\nfex=%s\nhelper=%s\nkernel=%s\n' \
            "$GITHUB_SHA" "$(git -C src rev-parse HEAD)" "$(git -C retirement-helper rev-parse HEAD)" "$(uname -a)" \
            > "$R/identity.txt"

      - name: Apply generalized remap lifetime candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
          python3 .github/fieldwork/promote_multiowner_claims.py src
          python3 .github/fieldwork/merge_callback_tombstone.py src
          python3 .github/fieldwork/fix_retirement_lock_order.py src
          python3 .github/fieldwork/add_revoked_h_state.py src
          python3 .github/fieldwork/pre_map_fixed_retire.py src
          python3 .github/fieldwork/add_map_fixed_rollback_transaction.py src
          python3 .github/fieldwork/add_vma_owner_id.py src
          python3 .github/fieldwork/add_owner_claim_identity.py src
          python3 .github/fieldwork/add_mremap_fixed_lifetime_transaction.py src
          python3 .github/fieldwork/extend_mremap_dontunmap_lifetime_transaction.py src
          python3 .github/fieldwork/extend_mremap_general_lifetime_transaction.py src
          git -C src diff --check
          git -C src diff > "$R/repair.diff"

      - name: Build FEX and probe
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build.log" 2>&1
          x86_64-linux-gnu-g++ -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Werror \
            -I"$GITHUB_WORKSPACE/src/ThunkLibs/include" \
            diagnostics/mremap-general-owner/mremap_general_owner.cpp \
            -o "$R/mremap-general-owner"

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci" "$ROOTFS/usr/lib/x86_64-linux-gnu"
          cp "$R/mremap-general-owner" "$ROOTFS/opt/fex-ci/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/"

      - name: Execute repaired move, grow, and shrink cases
        shell: bash
        run: |
          set -uxo pipefail
          run_case() {
            name="$1"; shift
            set +e
            FEX_ROOTFS="$ROOTFS" timeout 20s \
              "$GITHUB_WORKSPACE/src/build/Bin/FEX" /opt/fex-ci/mremap-general-owner "$@" \
              > "$R/$name.stdout" 2> "$R/$name.stderr"
            rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
            echo "===== $name rc=$rc ====="
            grep -E 'MREMAP_GENERAL|DIAG_MREMAP_|DIAG_ROLLBACK|DIAG_OWNER_CLAIM|DIAG_MULTI|DIAG_REVOKED_H' \
              "$R/$name.stderr" | tee "$R/$name.key" || true
          }
          set -e
          run_case move --move
          run_case move-reregister --move-reregister
          run_case grow --grow
          run_case shrink-reuse --shrink-reuse
          printf 'move=%s\nmove-reregister=%s\ngrow=%s\nshrink-reuse=%s\n' \
            "$(cat "$R/move.exit")" "$(cat "$R/move-reregister.exit")" \
            "$(cat "$R/grow.exit")" "$(cat "$R/shrink-reuse.exit")" | tee "$R/matrix.txt"

      - name: Assert generalized remap causal repair
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat "$R/move.exit")" = 139
          test "$(cat "$R/move-reregister.exit")" = 0
          test "$(cat "$R/grow.exit")" = 0
          test "$(cat "$R/shrink-reuse.exit")" = 139

          grep -q 'DIAG_MREMAP_PREPARE_SOURCE .*maymove=1 shrink=0' "$R/move.stderr"
          grep -q 'DIAG_MREMAP_COMMIT_SOURCE .*moved=1 definite=0' "$R/move.stderr"
          grep -q 'DIAG_REVOKED_H_INSTALL H=0x700000050000' "$R/move.stderr"

          grep -q 'MREMAP_GENERAL move-reregister H=0x700000050000' "$R/move-reregister.stderr"
          grep -q 'DIAG_OWNER_CLAIM_ACTIVE H=0x700000050000' "$R/move-reregister.stderr"
          grep -q 'MREMAP_GENERAL move-final H-value=111 reregister=1' "$R/move-reregister.stderr"

          grep -q 'MREMAP_GENERAL grow .* H-value=111 same=1' "$R/grow.stderr"
          if grep -q 'DIAG_MREMAP_PREPARE_SOURCE' "$R/grow.stderr"; then
            echo 'in-place no-MAYMOVE grow unexpectedly retired its source' >&2
            exit 1
          fi

          grep -q 'DIAG_MREMAP_PREPARE_TAIL .*maymove=0' "$R/shrink-reuse.stderr"
          grep -q 'DIAG_MREMAP_COMMIT_TAIL .*moved=0' "$R/shrink-reuse.stderr"
          grep -q 'MREMAP_GENERAL shrink-keep value=111' "$R/shrink-reuse.stderr"
          grep -q 'DIAG_REVOKED_H_INSTALL H=0x700000053000' "$R/shrink-reuse.stderr"
          if grep -q 'MREMAP_GENERAL shrink-final .*tail-value=333' "$R/shrink-reuse.stderr"; then
            echo 'truncated-tail H reattached to reused address after repair' >&2
            exit 1
          fi

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mremap-general-lifetime-repair-${{ github.run_id }}
          path: receipts-mremap-general-repair
          retention-days: 30
