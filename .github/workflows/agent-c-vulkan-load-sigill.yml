name: Agent C Vulkan guest load SIGILL tracer

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      DEBIAN_FRONTEND: noninteractive
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host
      FEX_PORTABLE: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          {
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            echo "ci_sha=$GITHUB_SHA"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools

      - name: Native ARM64 Lavapipe control
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

      - name: Build focused FEX and Vulkan thunks
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"

          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1
          file guest/libvulkan-guest.so "$HOST/libvulkan-host.so" > "$R/thunk-files.txt"
          x86_64-linux-gnu-objdump -d guest/libvulkan-guest.so > "$R/guest-objdump.txt"
          grep -n -B2 -A4 '0f 3f' "$R/guest-objdump.txt" | head -120 > "$R/op-thunk-sites.txt" || true

      - name: Build amd64 rootfs with diagnostic guest X11 symbols
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >"$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11-stub.c <<'EOF'
          long XSync(void) { return 0; }
          void *XGetVisualInfo(void) { return 0; }
          const char *XDisplayString(void) { return ":fex-ci-stub"; }
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 \
            -Wl,-soname,libX11.so.6 /tmp/x11-stub.c \
            -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          x86_64-linux-gnu-readelf -Ws "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6" \
            | grep -E 'XSync|XGetVisualInfo|XDisplayString' | tee "$R/x11-stub-symbols.txt"

          cat >/tmp/trace.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <stdint.h>
          #include <string.h>
          #include <sys/ucontext.h>
          #include <unistd.h>

          static void putstr(const char *s) { ssize_t n = write(2, s, strlen(s)); (void)n; }
          static void puthex(uintptr_t v) {
            static const char h[] = "0123456789abcdef";
            char b[2 + sizeof(v) * 2 + 2];
            size_t p = 0; b[p++]='0'; b[p++]='x';
            for (int i = (int)(sizeof(v) * 2) - 1; i >= 0; --i) b[p++] = h[(v >> (i * 4)) & 15];
            b[p++]='\n'; ssize_t n = write(2, b, p); (void)n;
          }
          static void dump_maps(void) {
            int fd = open("/proc/self/maps", O_RDONLY);
            if (fd < 0) return;
            char b[4096]; ssize_t n;
            while ((n = read(fd, b, sizeof(b))) > 0) { ssize_t w = write(2, b, (size_t)n); (void)w; }
            close(fd);
          }
          static void on_sigill(int sig, siginfo_t *si, void *vctx) {
            (void)sig;
            ucontext_t *ctx = (ucontext_t*)vctx;
            putstr("SIGILL_CAUGHT\nsi_addr="); puthex((uintptr_t)si->si_addr);
          #ifdef REG_RIP
            putstr("rip="); puthex((uintptr_t)ctx->uc_mcontext.gregs[REG_RIP]);
          #endif
            putstr("MAPS_BEGIN\n"); dump_maps(); putstr("MAPS_END\n");
            _exit(132);
          }
          int main(void) {
            struct sigaction sa = {0};
            sa.sa_sigaction = on_sigill; sa.sa_flags = SA_SIGINFO; sigemptyset(&sa.sa_mask);
            sigaction(SIGILL, &sa, 0);
            putstr("TRACE_BEFORE_DLOPEN\n");
            void *h = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!h) { putstr("TRACE_DLOPEN_ERROR\n"); putstr(dlerror()); putstr("\n"); return 2; }
            putstr("TRACE_AFTER_DLOPEN\n");
            return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O0 -g -Wall -Wextra -Werror /tmp/trace.c -ldl -o "$ROOTFS/opt/fex-ci/trace"
          file "$ROOTFS/opt/fex-ci/trace" "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6" > "$R/trace-files.txt"

      - name: Run Vulkan load with diagnostic guest X11 helpers
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /opt/fex-ci/trace >"$R/trace.out" 2>"$R/trace.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/trace.exit"
          cat "$R/trace.err"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-vulkan-load-sigill-${{ github.run_id }}
          path: receipts
          if-no-files-found: warn
          retention-days: 14
