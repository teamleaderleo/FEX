name: Agent C callback routing candidate

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_SHA: 1b268a6742768086aa8355e997c10b4423319ba6
      DEBIAN_FRONTEND: noninteractive
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host
      FEX_PORTABLE: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          test "$(git -C fieldwork rev-parse HEAD)" = "$FIELDWORK_SHA"
          {
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            echo "fieldwork_sha=$(git -C fieldwork rev-parse HEAD)"
            echo "ci_sha=$GITHUB_SHA"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools

      - name: Native ARM64 callback control
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"
          cc -O2 -Wall -Wextra \
            fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c \
            -ldl -o /tmp/callback-arm64
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-arm64 report gipa positive \
            >"$R/native-callback.out" 2>"$R/native-callback.err"

      - name: Apply candidate and build FEX Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          python3 fieldwork/investigations/fex-vulkan-thunk-lifecycle/apply_native_first_callback_candidate.py \
            src/ThunkLibs/libvulkan/Host.cpp
          git -C src diff --check
          git -C src diff -- ThunkLibs/libvulkan/Host.cpp > "$R/candidate.diff"

          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"

          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1
          file src/build/Bin/FEX "$HOST/libvulkan-host.so" guest/libvulkan-guest.so > "$R/artifacts.file.txt"

      - name: Build repaired amd64 rootfs and callback probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >"$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11-stub.c <<'EOF'
          long XSync(void) { return 0; }
          void *XGetVisualInfo(void) { return 0; }
          const char *XDisplayString(void) { return ":fex-ci-stub"; }
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wl,-soname,libX11.so.6 \
            /tmp/x11-stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          x86_64-linux-gnu-gcc -O2 -Wall -Wextra \
            fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c \
            -ldl -o "$ROOTFS/opt/fex-ci/callback-probe"
          file "$ROOTFS/opt/fex-ci/callback-probe" "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6" > "$R/guest-files.txt"

      - name: Run direct and GIPA candidate
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          run_case() {
            local name="$1"; shift
            set +e
            VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
              "$FEX" "$@" >"$R/$name.out" 2>"$R/$name.err"
            local rc=$?
            set -e
            echo "$rc" | tee "$R/$name.exit"
            cat "$R/$name.err"
          }
          set -e
          run_case direct /opt/fex-ci/callback-probe report direct 0
          run_case gipa /opt/fex-ci/callback-probe report gipa 0
          {
            printf 'direct='; cat "$R/direct.exit"
            printf 'gipa='; cat "$R/gipa.exit"
          } | tee "$R/callback-matrix.txt"
          test "$(cat "$R/direct.exit")" = 0
          test "$(cat "$R/gipa.exit")" = 0

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-callback-candidate-${{ github.run_id }}
          path: receipts
          if-no-files-found: warn
          retention-days: 14
