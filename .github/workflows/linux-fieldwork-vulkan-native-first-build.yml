name: Linux Fieldwork Vulkan native-first build

on:
  workflow_dispatch:
  push:
    branches: [linux-fieldwork/vulkan-procaddr-native-first-experiment]
    paths:
      - LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
      - .github/workflows/linux-fieldwork-vulkan-native-first-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld clang-tools libclang-dev llvm-dev pkg-config ccache gcc-x86-64-linux-gnu g++-x86-64-linux-gnu gcc-i686-linux-gnu g++-i686-linux-gnu libcap-dev libglfw3-dev libepoxy-dev python3-dev libsdl2-dev libasound2-dev libdrm-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev libgl-dev libegl-dev libvulkan-dev

      - name: Apply experiment
        run: |
          set -euxo pipefail
          git apply --check LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
          git apply LINUX_FIELDWORK_NATIVE_FIRST_V3.patch
          git diff --check
          grep -q 'vkCreateDebugReportCallbackEXT' ThunkLibs/libvulkan/Host.cpp
          grep -q 'vkDestroyDebugReportCallbackEXT' ThunkLibs/libvulkan/Host.cpp
          grep -q 'vkCreateDebugUtilsMessengerEXT' ThunkLibs/libvulkan/Host.cpp

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld -DENABLE_LTO=False -DENABLE_ASSERTIONS=True -DBUILD_TESTING=False -DBUILD_THUNKS=True -DBUILD_FEXCONFIG=False -DENABLE_CLANG_THUNKS=True -DRANGES_NATIVE=OFF

      - name: Build Vulkan thunks
        run: |
          cmake --build build --target vulkan-host-64 guest-libs -j"$(nproc)"
