name: GL split ELF symbol retention audit

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/fieldwork/apply_gl_split_bridge.py
      - .github/fieldwork/prune_gl_wrapper_bridge_duplicates.py
      - .github/workflows/gl-split-v3-symbol-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      R: ${{ github.workspace }}/receipts-gl-symbols
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and thunkgen
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev binutils
          CC=clang-18 CXX=clang++-18 cmake -S . -B build-symbols -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_X86_HOST_DEBUG=ON -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build-symbols --target thunkgen -- -j"$(nproc)" -v > "$R/build-thunkgen.log" 2>&1

      - name: Build stock GL wrapper
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ThunkLibs/GuestLibs -B guest-stock-symbols -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build-symbols/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-stock.log" 2>&1
          cmake --build guest-stock-symbols --target GL-guest -- -j"$(nproc)" -v > "$R/build-stock.log" 2>&1
          cp guest-stock-symbols/libGL-guest.so "$R/libGL-stock.so"

      - name: Build v3 split and v4-pruned split
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/fieldwork/apply_gl_split_bridge.py .
          git diff --check
          cmake -S ThunkLibs/GuestLibs -B guest-v3-symbols -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build-symbols/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-v3.log" 2>&1
          cmake --build guest-v3-symbols --target GL-guest GL-lifetime-bridge -- -j"$(nproc)" -v > "$R/build-v3.log" 2>&1
          cp guest-v3-symbols/libGL-guest.so "$R/libGL-v3.so"
          cp guest-v3-symbols/libfex-GL-bridge.so "$R/libfex-GL-bridge.so"

          python3 .github/fieldwork/prune_gl_wrapper_bridge_duplicates.py .
          git diff --check
          cmake -S ThunkLibs/GuestLibs -B guest-v4-symbols -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build-symbols/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-v4.log" 2>&1
          cmake --build guest-v4-symbols --target GL-guest GL-lifetime-bridge -- -j"$(nproc)" -v > "$R/build-v4.log" 2>&1
          cp guest-v4-symbols/libGL-guest.so "$R/libGL-v4.so"

      - name: Audit GNU unique and callback-specialization symbols
        shell: bash
        run: |
          set -euxo pipefail
          for so in "$R/libGL-stock.so" "$R/libGL-v3.so" "$R/libGL-v4.so" "$R/libfex-GL-bridge.so"; do
            base="$(basename "$so")"
            readelf -Ws "$so" > "$R/$base.symbols.txt"
            printf '%s unique=%s fexcallback=%s invoke_callback=%s\n' \
              "$base" \
              "$(grep -c ' UNIQUE ' "$R/$base.symbols.txt" || true)" \
              "$(grep -c 'fexcallback_' "$R/$base.symbols.txt" || true)" \
              "$(grep -c 'fexthunks_invoke_callback' "$R/$base.symbols.txt" || true)" \
              | tee -a "$R/counts.txt"
            grep -E ' UNIQUE |fexcallback_|fexthunks_invoke_callback' "$R/$base.symbols.txt" \
              > "$R/$base.interesting.txt" || true
          done
          cat "$R/counts.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-split-symbol-audit-${{ github.run_id }}
          path: receipts-gl-symbols
          retention-days: 30
