name: Vulkan custom-host allocator forwarding clean matrix

on:
  workflow_dispatch:
  push:
    branches: [ci/vulkan-custom-host-allocator-forwarding-clean-20260814]
    paths:
      - .github/workflows/vulkan-custom-host-allocator-forwarding-clean.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      CANDIDATE_SHA: 715ff36bff2fd9f2353ab31613dc41ae106f3938
      SUPPORT_SHA: 24b1349efd1a9650b8041971049cb68315f12e50
      MATRIX_SHA: 8fae18d4691aa8adb8938a7cd735a4685c4bf9e3
      FEX_PORTABLE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: carrier

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.SUPPORT_SHA }}
          path: support

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.MATRIX_SHA }}
          path: matrix-support

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.CANDIDATE_SHA }}
          path: product
          submodules: recursive

      - name: Install dependencies and prove candidate identity
        run: |
          set -euxo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE_SHA"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build nasm clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers glslang-tools

      - name: Apply validated allocator mediation plus custom-host forwarding only
        working-directory: product
        run: |
          set -euxo pipefail
          python3 ../support/LINUX_FIELDWORK_ALLOCATOR_TRAMPOLINE.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          repls = {
              'return LDR_PTR(vkCreateShaderModule)(a_0, a_1, nullptr, a_3);':
                  'return LDR_PTR(vkCreateShaderModule)(a_0, a_1, a_2, a_3);',
              'auto ret = LDR_PTR(vkCreateDevice)(a_0, a_1, nullptr, &out);':
                  'auto ret = LDR_PTR(vkCreateDevice)(a_0, a_1, a_2, &out);',
              'return LDR_PTR(vkAllocateMemory)(a_0, a_1, nullptr, a_3);':
                  'return LDR_PTR(vkAllocateMemory)(a_0, a_1, a_2, a_3);',
              'LDR_PTR(vkFreeMemory)(a_0, a_1, nullptr);':
                  'LDR_PTR(vkFreeMemory)(a_0, a_1, a_2);',
          }
          for old, new in repls.items():
              count = s.count(old)
              assert count == 1, (old, count)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff --name-only | tee ../product-files.txt
          printf '%s\n' \
            ThunkLibs/libvulkan/Guest.cpp \
            ThunkLibs/libvulkan/Host.cpp \
            ThunkLibs/libvulkan/libvulkan_interface.cpp \
            | sort > ../expected-product-files.txt
          sort ../product-files.txt > ../actual-product-files.txt
          diff -u ../expected-product-files.txt ../actual-product-files.txt
          grep -n -E 'vkCreateShaderModule\)\(a_0, a_1, a_2, a_3\)|vkCreateDevice\)\(a_0, a_1, a_2, &out\)|vkAllocateMemory\)\(a_0, a_1, a_2, a_3\)|vkFreeMemory\)\(a_0, a_1, a_2\)' ThunkLibs/libvulkan/Host.cpp | tee ../forwarded-sites.txt
          test "$(wc -l < ../forwarded-sites.txt)" -eq 4

      - name: Re-run const repack regression
        working-directory: product
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=ON \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/
          cmake --build build --target thunkgentest -- -j"$(nproc)"
          build/Bin/thunkgentest "StructRepacking" | tee ../thunkgentest.txt

      - name: Build plain FEX Vulkan thunk path
        working-directory: product
        run: |
          set -euxo pipefail
          cmake --build build --target FEX FEXServer vulkan-host-64 -- -j"$(nproc)"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$PWD" -DGENERATOR_EXE="$PWD/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/
          cmake --build guest-build --target vulkan-guest -- -j"$(nproc)"

      - name: Prepare native and FEX allocator matrix
        run: |
          set -euxo pipefail
          mkdir -p receipts host-thunks
          cat > receipts/min.comp <<'EOF'
          #version 450
          layout(local_size_x = 1) in;
          void main() {}
          EOF
          glslangValidator -V -S comp receipts/min.comp -o receipts/min.comp.spv
          cc -O0 -g -Wall -Wextra -Werror matrix-support/LinuxFieldwork/vk_allocator_custom_host_matrix.c -ldl -o receipts/native-probe

          docker pull --platform=linux/amd64 ubuntu:24.04
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir rootfs-amd64
          docker export "$cid" | tar -C rootfs-amd64 -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p rootfs-amd64/usr/lib/x86_64-linux-gnu rootfs-amd64/opt/fex-ci
          cp product/guest-build/libvulkan-guest.so rootfs-amd64/usr/lib/x86_64-linux-gnu/libvulkan.so.1
          cp product/build/HostLibs_64/libvulkan-host.so host-thunks/libvulkan-host.so
          cp receipts/min.comp.spv rootfs-amd64/opt/fex-ci/min.comp.spv
          x86_64-linux-gnu-gcc -O0 -g -Wall -Wextra -Werror matrix-support/LinuxFieldwork/vk_allocator_custom_host_matrix.c -ldl -o rootfs-amd64/opt/fex-ci/allocator-matrix
          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void *d, int discard){(void)d;(void)discard;return 0;}
          void *XGetVisualInfo(void *d, long mask, void *t, int *n){(void)d;(void)mask;(void)t;if(n)*n=0;return 0;}
          char *XDisplayString(void *d){(void)d;static char s[] = ":0";return s;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o rootfs-amd64/usr/lib/x86_64-linux-gnu/libX11.so.6

      - name: Execute clean custom-host allocator matrix
        run: |
          set -uxo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          set +e
          VK_DRIVER_FILES="$ICD" timeout 30s receipts/native-probe receipts/min.comp.spv >receipts/native.stdout 2>receipts/native.stderr
          native_rc=$?
          VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$PWD/rootfs-amd64" FEX_THUNKHOSTLIBS="$PWD/host-thunks" \
            timeout 30s product/build/Bin/FEX /opt/fex-ci/allocator-matrix /opt/fex-ci/min.comp.spv \
            >receipts/fex.stdout 2>receipts/fex.stderr
          fex_rc=$?
          set -e
          printf 'candidate=%s\nnative=%s\nfex=%s\n' "$CANDIDATE_SHA" "$native_rc" "$fex_rc" | tee receipts/final-matrix.txt
          printf '%s\n' '--- native ---'; cat receipts/native.stderr
          printf '%s\n' '--- fex ---'; cat receipts/fex.stderr
          test "$native_rc" -eq 0
          test "$fex_rc" -eq 0
          for file in receipts/native.stderr receipts/fex.stderr; do
            grep -q 'PASS custom-host allocator forwarding matrix' "$file"
            grep -E -q 'DEVICE_CREATE_RETURN result=0 alloc_delta=[1-9]' "$file"
            grep -E -q 'MEM_ALLOC_RETURN result=0 alloc_delta=[1-9]' "$file"
            grep -E -q 'MEM_FREE_RETURN free_delta=[1-9]' "$file"
            grep -E -q 'SHADER_CREATE_RETURN result=0 alloc_delta=[1-9]' "$file"
            grep -E -q 'SHADER_DESTROY_RETURN free_delta=[1-9]' "$file"
            grep -E -q 'DEVICE_DESTROY_RETURN free_delta=[1-9]' "$file"
          done
          printf '%s\n' 'OUTCOME=clean_candidate_manual_mediation_plus_four_custom_host_allocator_forwards_passed' >> receipts/final-matrix.txt

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-custom-host-allocator-clean-${{ github.run_id }}
          path: |
            receipts
            product-files.txt
            expected-product-files.txt
            actual-product-files.txt
            forwarded-sites.txt
            thunkgentest.txt
          retention-days: 30
