name: CUDA committed resident PFN runtime v1

on:
  push:
    branches: [diagnostic/cuda-resident-runtime-v1]
    paths:
      - .github/workflows/cuda-resident-runtime-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-cuda-resident-committed-v1
      R: ${{ github.workspace }}/receipts-cuda-resident-committed-v1
      H: ${{ github.workspace }}/host-cuda-resident-committed-v1
      M: ${{ github.workspace }}/mock-cuda-resident-committed-v1
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and committed-source checks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H" "$M"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev
          git rev-parse HEAD | tee "$R/carrier-sha.txt"
          git diff --check
          grep -q 'generate(libcuda .* RESIDENT_BRIDGE)' ThunkLibs/GuestLibs/CMakeLists.txt
          grep -q 'FEXGetResidentCallerForHostFunction(name)' ThunkLibs/libcuda/libcuda_Guest.cpp
          grep -q 'FEXAllocateResidentHostTrampolineForGuestFunction' ThunkLibs/libcuda/libcuda_Guest.cpp
          test -f ThunkLibs/libcuda_bridge/Guest.cpp
          test ! -e .github/workflows/materialize-cuda-resident-source-v1.yml

      - name: Build FEX and CUDA host thunk
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1 \
            || { tail -n 260 "$R/cmake-host.log"; exit 1; }
          cmake --build build --target FEX FEXServer cuda-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 520 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libcuda-host.so "$H/libcuda-host.so"

      - name: Build committed CUDA wrapper and resident companion
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1 \
            || { tail -n 280 "$R/cmake-guest.log"; exit 1; }
          cmake --build guest --target cuda-guest cuda_bridge-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 620 "$R/build-guest.log"; exit 1; }

          test -f guest/libcuda-guest.so
          test -f guest/libfex-cuda-bridge.so
          test -f guest/gen/thunkgen_guest_libcuda.inl
          test -f guest/gen/thunkgen_guest_libcuda_bridge.inl
          test -f guest/gen/thunkgen_guest_libcuda_bridge_accessors.inl

          awk '/^[[:space:]]*MAKE_CALLBACK_THUNK/{sub(/^[[:space:]]*/, ""); print}' \
            guest/gen/thunkgen_guest_libcuda.inl > "$R/normal-signatures.txt"
          awk '/^[[:space:]]*MAKE_CALLBACK_THUNK/{sub(/^[[:space:]]*/, ""); print}' \
            guest/gen/thunkgen_guest_libcuda_bridge.inl > "$R/resident-signatures.txt"
          diff -u "$R/normal-signatures.txt" "$R/resident-signatures.txt" > "$R/signature-set.diff"
          wc -l < "$R/normal-signatures.txt" | tr -d ' ' | tee "$R/signature-count.txt"
          test "$(cat "$R/signature-count.txt")" = 364

          awk '/^extern "C" uintptr_t fex_bridge_libcuda_unpacker_/{n++} END{print n+0}' \
            guest/gen/thunkgen_guest_libcuda_bridge.inl | tee "$R/resident-unpacker-count.txt"
          awk '/^template<> struct FEXResidentBridgeUnpacker</{n++} END{print n+0}' \
            guest/gen/thunkgen_guest_libcuda_bridge_accessors.inl | tee "$R/accessor-unpacker-count.txt"
          awk '/^template<> struct FEXResidentBridgeInvoker</{n++} END{print n+0}' \
            guest/gen/thunkgen_guest_libcuda_bridge_accessors.inl | tee "$R/accessor-invoker-count.txt"
          test "$(cat "$R/resident-unpacker-count.txt")" = 1
          test "$(cat "$R/accessor-unpacker-count.txt")" = 1
          test "$(cat "$R/accessor-invoker-count.txt")" = 364

          readelf -d guest/libcuda-guest.so | tee "$R/wrapper.dynamic"
          readelf -d guest/libfex-cuda-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          grep -q 'NEEDED.*libfex-cuda-bridge.so' "$R/wrapper.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"
          stat -c 'bridge_file_bytes=%s' guest/libfex-cuda-bridge.so | tee "$R/bridge-size.txt"
          sha256sum guest/gen/thunkgen_guest_libcuda_bridge.inl \
                    guest/gen/thunkgen_guest_libcuda_bridge_accessors.inl \
                    guest/libcuda-guest.so guest/libfex-cuda-bridge.so \
            | tee "$R/product-sha256.txt"

      - name: Build fake native CUDA driver and guest probe
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/mockcuda.c <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef int CUresult;

          CUresult cuInit(unsigned int flags) {
            fprintf(stderr, "HOST_CUINIT flags=%u\n", flags);
            return 1000 + (int)flags;
          }

          CUresult cuGetProcAddress_v2(const char *symbol, void **pfn, int cudaVersion,
                                      uint64_t flags, int *symbolStatus) {
            fprintf(stderr, "HOST_CUGET symbol=%s version=%d flags=%llu\n",
                    symbol ? symbol : "(null)", cudaVersion, (unsigned long long)flags);
            if (symbol && strcmp(symbol, "cuInit") == 0) {
              *pfn = (void *)&cuInit;
              if (symbolStatus) *symbolStatus = 0;
              return 0;
            }
            if (pfn) *pfn = 0;
            if (symbolStatus) *symbolStatus = 1;
            return 1;
          }
          EOF
          clang-18 -shared -fPIC -O2 -Wall -Wextra -Werror /tmp/mockcuda.c \
            -Wl,-soname,libcuda.so.1 -o "$M/libcuda.so.1"

          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libcuda-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libcuda.so.1"
          cp guest/libfex-cuda-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-cuda-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat > /tmp/cudaprobe.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>

          typedef int (*CUINIT)(unsigned int);
          typedef int (*CUGET)(const char *, void **, int, uint64_t, int *);
          struct span { uintptr_t a, b; };
          static struct span old_ranges[24];
          static unsigned old_count;

          static int map_has(void *p, const char *needle, int verbose) {
            FILE *f = fopen("/proc/self/maps", "r");
            char line[1024];
            uintptr_t x = (uintptr_t)p;
            if (!f) return -1;
            while (fgets(line, sizeof(line), f)) {
              unsigned long a, b;
              if (sscanf(line, "%lx-%lx", &a, &b) == 2 && x >= a && x < b) {
                if (verbose) fprintf(stderr, "MAP %p %s", p, line);
                int ok = strstr(line, needle) != NULL;
                fclose(f);
                return ok;
              }
            }
            fclose(f);
            if (verbose) fprintf(stderr, "UNMAPPED %p\n", p);
            return 0;
          }

          static int maps_contain(const char *needle) {
            FILE *f = fopen("/proc/self/maps", "r");
            char line[1024];
            if (!f) return 0;
            while (fgets(line, sizeof(line), f)) {
              if (strstr(line, needle)) { fclose(f); return 1; }
            }
            fclose(f);
            return 0;
          }

          static void capture_wrapper(void) {
            FILE *f = fopen("/proc/self/maps", "r");
            char line[1024];
            old_count = 0;
            if (!f) exit(70);
            while (fgets(line, sizeof(line), f)) {
              unsigned long a, b;
              if (strstr(line, "/usr/lib/x86_64-linux-gnu/libcuda.so.1") &&
                  sscanf(line, "%lx-%lx", &a, &b) == 2 && old_count < 24) {
                old_ranges[old_count++] = (struct span){a, b};
                fprintf(stderr, "OLD_CUDA_RANGE %lx-%lx\n", a, b);
              }
            }
            fclose(f);
            if (!old_count) exit(71);
          }

          static void reserve_old(void) {
            for (unsigned i = 0; i < old_count; ++i) {
              size_t n = old_ranges[i].b - old_ranges[i].a;
              void *r = mmap((void *)old_ranges[i].a, n, PROT_NONE,
                             MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED_NOREPLACE, -1, 0);
              if (r == MAP_FAILED) {
                fprintf(stderr, "RESERVE_FAIL %lx-%lx errno=%d %s\n",
                        old_ranges[i].a, old_ranges[i].b, errno, strerror(errno));
                exit(72);
              }
            }
          }

          static CUINIT get_init(CUGET get) {
            void *p = NULL;
            int status = -1;
            int rc = get("cuInit", &p, 12000, 0, &status);
            fprintf(stderr, "CUGET_RESULT rc=%d status=%d H=%p\n", rc, status, p);
            if (rc != 0 || status != 0 || !p) exit(73);
            return (CUINIT)p;
          }

          int main(void) {
            void *h = dlopen("libcuda.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!h) { fprintf(stderr, "DLOPEN_FAIL %s\n", dlerror()); return 1; }
            CUGET get0 = (CUGET)dlsym(h, "cuGetProcAddress_v2");
            if (!get0) return 2;
            CUINIT p0 = get_init(get0);
            if (p0(41) != 1041) return 3;
            fprintf(stderr, "PRE_CLOSE_CUDA_OK get=%p H=%p bridge=%d\n",
                    (void *)get0, (void *)p0, maps_contain("/libfex-cuda-bridge.so"));
            capture_wrapper();
            if (dlclose(h)) return 4;
            if (map_has((void *)get0, "/usr/lib/x86_64-linux-gnu/libcuda.so.1", 1) != 0) return 5;
            int post = p0(42);
            fprintf(stderr, "POST_CLOSE_CUDA_RETURN rc=%d\n", post);
            if (post != 1042 || !maps_contain("/libfex-cuda-bridge.so")) return 6;

            reserve_old();
            void *h2 = dlopen("libcuda.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!h2) { fprintf(stderr, "RELOAD_FAIL %s\n", dlerror()); return 7; }
            CUGET get1 = (CUGET)dlsym(h2, "cuGetProcAddress_v2");
            CUINIT p1 = get_init(get1);
            fprintf(stderr, "GEN2 get_old=%p get_new=%p moved=%d H_old=%p H_new=%p same_H=%d\n",
                    (void *)get0, (void *)get1, get0 != get1,
                    (void *)p0, (void *)p1, p0 == p1);
            if (get0 == get1 || p0 != p1) return 8;
            if (p1(43) != 1043) return 9;
            if (dlclose(h2)) return 10;
            if (p0(44) != 1044) return 11;
            fprintf(stderr, "COMMITTED_CUDA_RESIDENT_PFN_RUNTIME_OK\n");
            return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/cudaprobe.c -ldl -o "$ROOTFS/opt/fex-ci/cudaprobe"

      - name: Prove committed CUDA retained PFN survives unload and moved reload
        shell: bash
        run: |
          set -euxo pipefail
          LD_LIBRARY_PATH="$M" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 35s \
            build/Bin/FEX /opt/fex-ci/cudaprobe > "$R/probe.out" 2> "$R/probe.err"
          cat "$R/probe.err"
          grep -q 'PRE_CLOSE_CUDA_OK' "$R/probe.err"
          grep -q 'UNMAPPED ' "$R/probe.err"
          grep -q 'POST_CLOSE_CUDA_RETURN rc=1042' "$R/probe.err"
          grep -q 'moved=1' "$R/probe.err"
          grep -q 'same_H=1' "$R/probe.err"
          grep -q 'HOST_CUINIT flags=44' "$R/probe.err"
          grep -q 'COMMITTED_CUDA_RESIDENT_PFN_RUNTIME_OK' "$R/probe.err"
          echo COMMITTED_CUDA_RESIDENT_PFN_ACCEPTANCE_OK | tee "$R/result.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-resident-committed-v1-${{ github.run_id }}
          path: receipts-cuda-resident-committed-v1
          retention-days: 30
