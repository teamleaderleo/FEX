name: Generated Vulkan split resident bridge

on:
  push:
    branches: [diagnostic/generated-vulkan-split-bridge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-split:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts
      H: ${{ github.workspace }}/host
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            mesa-vulkan-drivers binutils

      - name: Build FEX host and generated split guest thunks
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build build --target FEXServer vulkan-host-64 -- -j"$(nproc)" \
            >"$R/build-host.log" 2>&1
          cp build/HostLibs_64/libvulkan-host.so "$H/libvulkan-host.so"

          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest vulkan_bridge-guest -- -j"$(nproc)" \
            >"$R/build-guest.log" 2>&1 || { tail -n 240 "$R/build-guest.log"; exit 1; }

          test -f guest/libvulkan-guest.so
          test -f guest/libfex-vulkan-bridge.so
          readelf -d guest/libvulkan-guest.so | tee "$R/vulkan.dynamic"
          readelf -d guest/libfex-vulkan-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/vulkan.dynamic"
          grep -q 'NEEDED.*libfex-vulkan-bridge.so' "$R/vulkan.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"

      - name: Build amd64 rootfs and retained PFN probe
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >/dev/null
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp guest/libfex-vulkan-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-vulkan-bridge.so"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void*d,int x){(void)d;(void)x;return 0;}
          void *XGetVisualInfo(void*d,long m,void*t,int*c){(void)d;(void)m;(void)t;if(c)*c=0;return 0;}
          char *XDisplayString(void*d){(void)d;return ":0";}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wl,-soname,libX11.so.6 \
            /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/probe.c <<'EOF'
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          typedef void (*PFN)(void);
          typedef PFN (*GIPA)(void*, const char*);
          typedef int32_t (*ENUMVER)(uint32_t*);
          static int mapped(void *p) {
            FILE*f=fopen("/proc/self/maps","r");char line[512];uintptr_t x=(uintptr_t)p;
            if(!f)return -1;while(fgets(line,sizeof(line),f)){unsigned long a,b;if(sscanf(line,"%lx-%lx",&a,&b)==2&&x>=a&&x<b){fclose(f);return 1;}}fclose(f);return 0;
          }
          static int maps_name(const char *needle) {
            FILE*f=fopen("/proc/self/maps","r");char line[512];int n=0;if(!f)return -1;
            while(fgets(line,sizeof(line),f))if(strstr(line,needle))n++;fclose(f);return n;
          }
          int main(void) {
            void*h=dlopen("libvulkan.so.1",RTLD_NOW|RTLD_LOCAL);
            if(!h){fprintf(stderr,"DLOPEN_FAIL %s\n",dlerror());return 2;}
            GIPA g=(GIPA)dlsym(h,"vkGetInstanceProcAddr");
            ENUMVER p=(ENUMVER)g(0,"vkEnumerateInstanceVersion");uint32_t a=0,b=0;
            if(!g||!p||p(&a)!=0)return 3;
            fprintf(stderr,"SPLIT_BEFORE gipa=%p H=%p version=%u bridge_maps=%d\n",(void*)g,(void*)p,a,maps_name("libfex-vulkan-bridge.so"));
            if(dlclose(h))return 4;
            int gm=mapped((void*)g), bm=maps_name("libfex-vulkan-bridge.so");
            fprintf(stderr,"SPLIT_AFTER_CLOSE gipa_mapped=%d bridge_maps=%d\n",gm,bm);
            if(gm!=0||bm<=0)return 5;
            int32_t r=p(&b);
            fprintf(stderr,"SPLIT_RETAINED_PFN result=%d version=%u\n",r,b);
            if(r!=0||b!=a)return 6;
            fprintf(stderr,"GENERATED_VULKAN_SPLIT_PFN_OK\n");
            return 0;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/probe.c -ldl -o "$ROOTFS/opt/fex-ci/probe"

      - name: Run generated split bridge
        run: |
          set -uxo pipefail
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          set +e
          VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" \
            build/Bin/FEX /opt/fex-ci/probe >"$R/probe.out" 2>"$R/probe.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/probe.exit"
          cat "$R/probe.err"
          test "$rc" -eq 0
          grep -q 'SPLIT_AFTER_CLOSE gipa_mapped=0' "$R/probe.err"
          grep -q GENERATED_VULKAN_SPLIT_PFN_OK "$R/probe.err"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-vulkan-split-bridge-${{ github.run_id }}
          path: receipts
          retention-days: 30
