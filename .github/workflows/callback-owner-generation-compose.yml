name: Callback owner-generation patch composition

on:
  push:
    branches: [ci/callback-owner-generation-lease-20260814]
    paths:
      - .github/workflows/callback-owner-generation-compose.yml
      - .github/fieldwork/relax_owner_generation_registry_anchor.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
      - name: Checkout exact FEX source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: 71afe476751deac24adabd1adb575fd2337b6e0a
          path: src
          fetch-depth: 1
      - name: Checkout retirement helper
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1
      - name: Checkout owner helper
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-owner-claim-id-20260814
          path: owner-helper
          fetch-depth: 1
      - name: Apply retirement base
        run: python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
      - name: Apply multiowner promotion
        run: python3 .github/fieldwork/promote_multiowner_claims.py src
      - name: Merge callback tombstone
        run: python3 owner-helper/.github/fieldwork/merge_callback_tombstone.py src
      - name: Apply retirement lock-order fix
        run: python3 .github/fieldwork/fix_retirement_lock_order.py src
      - name: Apply revoked-H state
        run: python3 .github/fieldwork/add_revoked_h_state.py src
      - name: Apply pre-MAP_FIXED retirement
        run: python3 owner-helper/.github/fieldwork/pre_map_fixed_retire.py src
      - name: Apply MAP_FIXED rollback transaction
        run: python3 owner-helper/.github/fieldwork/add_map_fixed_rollback_transaction.py src
      - name: Apply VMA OwnerID
        run: python3 owner-helper/.github/fieldwork/add_vma_owner_id.py src
      - name: Apply owner-aware retained claims
        run: python3 owner-helper/.github/fieldwork/add_owner_claim_identity.py src
      - name: Upgrade callback tombstone to descriptor
        run: python3 .github/fieldwork/add_callback_descriptor_after_tombstone.py src
      - name: Relax owner-generation registry patch anchor
        run: python3 .github/fieldwork/relax_owner_generation_registry_anchor.py
      - name: Attempt callback owner-generation lease
        continue-on-error: true
        run: python3 .github/fieldwork/add_callback_owner_generation_lease.py src
      - name: Check owner descriptor phase
        if: always()
        run: grep -q 'struct GuestCallbackOwnerGeneration' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check owner registry phase
        if: always()
        run: grep -q 'CallbackOwnerGenerations' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check bool retire declaration phase
        if: always()
        run: grep -q 'bool RetireGuestRange(FEXCore::Core::InternalThreadState' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check owner dispatcher phase
        if: always()
        run: grep -q 'DIAG_CALLBACK_OWNER_ACQUIRE' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check owner query phase
        if: always()
        run: grep -q 'UnpackerOwnerID' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check owner allocation phase
        if: always()
        run: grep -q 'DIAG_CALLBACK_OWNER_CREATE' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check retire definition phase
        if: always()
        run: grep -q 'const uint64_t RetiringOwnerID' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check owner retirement phase
        if: always()
        run: grep -q 'DIAG_CALLBACK_OWNER_RETIRE' src/Source/Tools/LinuxEmulation/Thunks.cpp
      - name: Check deferred GuestMunmap phase
        if: always()
        run: grep -q 'DIAG_CALLBACK_OWNER_DEFER_HOST_UNMAP' src/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsSMCTracking.cpp
      - name: Diff check
        if: always()
        run: git -C src diff --check
