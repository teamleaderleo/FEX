name: Thunk callback transaction wait A-B ARM64

on:
  push:
    branches: [ci/thunk-callback-transactional-retire-20260814]
    paths:
      - .github/fieldwork/refine_callback_transaction_wait.py
      - .github/fieldwork/patch_callback_transaction_wait_fixture.py
      - .github/workflows/thunk-callback-transaction-wait-ab-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-wait-ab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      FIELDWORK_REF: investigation/fex-vulkan-thunk-lifecycle
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-transaction-wait
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4

      - name: Checkout exact FEX source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout retirement helpers
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1

      - name: Checkout retained fixture
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_REF }}
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and deterministic transaction-wait fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu

          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir -p /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro
          python3 .github/fieldwork/patch_callback_inflight_fixture.py /tmp/repro/fex-full-thunk-pair
          python3 .github/fieldwork/patch_callback_transaction_wait_fixture.py /tmp/repro/fex-full-thunk-pair
          (cd /tmp/repro/fex-full-thunk-pair && make clean && make HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++) \
            > "$R/build-fixture.log" 2>&1
          file /tmp/repro/fex-full-thunk-pair/guest/callback_transaction_wait | tee "$R/callback-transaction-wait.file"
          grep -q 'ELF 64-bit.*x86-64' "$R/callback-transaction-wait.file"

      - name: Apply descriptor, drain, and transactional retirement baseline
        shell: bash
        run: |
          set -euxo pipefail
          python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
          python3 .github/fieldwork/promote_multiowner_claims.py src
          python3 .github/fieldwork/fix_retirement_lock_order.py src
          python3 .github/fieldwork/add_revoked_h_state.py src
          python3 .github/fieldwork/add_callback_descriptor.py src
          python3 .github/fieldwork/add_callback_descriptor_drain.py src
          python3 .github/fieldwork/add_callback_retirement_transaction.py src
          git -C src diff --check
          git -C src diff > "$R/transaction-baseline.diff"

      - name: Build immediate-reject transaction baseline
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B build-baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-baseline.log" 2>&1
          cmake --build build-baseline --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-baseline.log" 2>&1

      - name: Add wait-on-Draining refinement and build candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/fieldwork/refine_callback_transaction_wait.py src
          git -C src diff --check
          git -C src diff > "$R/transaction-wait.diff"
          CC=clang-18 CXX=clang++-18 cmake -S src -B build-wait -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-wait.log" 2>&1
          cmake --build build-wait --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-wait.log" 2>&1

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute immediate-reject versus wait A-B
        shell: bash
        run: |
          set -uxo pipefail
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          run_case() {
            name="$1"; fex="$2"
            set +e
            (cd "$ROOTFS/opt/fex-ci" && \
              FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
              "$fex" /opt/fex-ci/guest/callback_transaction_wait) \
              > "$R/$name.stdout" 2> "$R/$name.stderr"
            rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
            echo "===== $name rc=$rc ====="
            grep -E 'TXWAIT|DIAG_CALLBACK_(DESCRIPTOR|TX)' "$R/$name.stdout" "$R/$name.stderr" || true
          }

          run_case baseline "$GITHUB_WORKSPACE/build-baseline/Bin/FEX"
          run_case wait "$GITHUB_WORKSPACE/build-wait/Bin/FEX"

          baseline_rc="$(cat "$R/baseline.exit")"
          wait_rc="$(cat "$R/wait.exit")"
          printf 'baseline=%s\nwait=%s\n' "$baseline_rc" "$wait_rc" | tee "$R/matrix.txt"

          # With immediate rejection, callback B reaches the already-Draining
          # descriptor while A keeps the transaction waiting. The process is
          # deliberately terminated through the revoked/rejected path.
          test "$baseline_rc" = 113
          grep -q 'TXWAIT A-entered-host-block' "$R/baseline.stderr"
          grep -Eq 'DIAG_CALLBACK_TX_DRAIN_(BEGIN|WAIT).*active=1' "$R/baseline.stderr"
          grep -q 'DIAG_CALLBACK_DESCRIPTOR_REVOKED' "$R/baseline.stderr"

          # Refined behavior: B waits while the failed munmap transaction is
          # unresolved. Before release neither munmap nor B may have completed.
          # A then drains, real munmap returns EINVAL, rollback wakes B into Live,
          # and B executes normally. A later valid close permanently revokes it.
          test "$wait_rc" = 0
          grep -q 'TXWAIT before-release munmap-done=0 B-done=0' "$R/wait.stderr"
          grep -Eq 'DIAG_CALLBACK_TX_DRAIN_(BEGIN|WAIT).*active=1' "$R/wait.stderr"
          grep -q 'DIAG_CALLBACK_TX_ROLLBACK_RANGE' "$R/wait.stderr"
          grep -q 'TXWAIT munmap-returned rc=-1 errno=22' "$R/wait.stderr"
          grep -q 'TXWAIT A-returned rv=70053' "$R/wait.stderr"
          grep -q 'TXWAIT B-returned rv=70063' "$R/wait.stderr"
          grep -q 'TXWAIT joined A=70053 B=70063 munmap=-1 errno=22' "$R/wait.stderr"
          grep -q 'TXWAIT stale-after-close-exit=113' "$R/wait.stderr"
          grep -q 'TXWAIT PASS' "$R/wait.stderr"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunk-callback-transaction-wait-ab-${{ github.run_id }}
          path: receipts-transaction-wait
          retention-days: 30
