name: Focused research tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/**
      - Scripts/ForkWorkflowRegistry.py
      - Scripts/ResearchDevBuild.py
      - Scripts/ResearchProfileCarrier.py
      - Scripts/RunResearchToolingTests.py
      - Scripts/SubmoduleOriginCache.py
      - Scripts/SubmodulePackCache.py
      - Scripts/ResearchProfiles/**
      - Scripts/test_*.py

permissions:
  contents: read

concurrency:
  group: focused-research-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out the exact same-repository source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run only the closed research-tooling test inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          python3 Scripts/RunResearchToolingTests.py --jobs 4
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
