name: Focused x86 research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build one host target or one guest Linux-test binary
        required: true
        default: build
        type: choice
        options:
          - build
          - linux-test-build
      target:
        description: Exact CMake target or guest test basename (for example thunkgentest or smc-2)
        required: true
        default: thunkgentest
        type: string
      bitness:
        description: Guest bitness; used only by linux-test-build
        required: true
        default: "64"
        type: choice
        options:
          - "64"
          - "32"
      jobs:
        description: Bounded compile parallelism
        required: true
        default: "8"
        type: choice
        options:
          - "4"
          - "8"
          - "12"
          - "16"

permissions:
  contents: read

concurrency:
  group: focused-x86-research
  cancel-in-progress: false

jobs:
  focused-build:
    runs-on: [self-hosted, X64, fex-research]
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
      TARGET: ${{ inputs.target }}
      BITNESS: ${{ inputs.bitness }}
      JOBS: ${{ inputs.jobs }}
      DEV_LANE: actions-x86-dev
      LINUX_LANE: actions-x86-linux-tests

    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record scope and toolchain
        run: |
          set -euo pipefail
          echo "scope=FOCUSED_${MODE}"
          echo "head=$(git rev-parse HEAD)"
          echo "dirty=$([[ -n $(git status --porcelain) ]] && echo true || echo false)"
          echo "runner=${RUNNER_NAME} arch=${RUNNER_ARCH}"
          cmake --version | head -1
          clang --version | head -1
          ninja --version
          ccache --version | head -1

      - name: Isolate the previous lane receipt
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "build" ]]; then
            receipt_lane="${DEV_LANE}"
          else
            receipt_lane="${LINUX_LANE}"
          fi
          receipt="${HOME}/.cache/fex-dev/views/${receipt_lane}/last-receipt.json"
          if [[ -f "${receipt}" ]]; then
            mv "${receipt}" "${RUNNER_TEMP}/fex-previous-receipt.json"
          fi

      - name: Build only the requested scope
        run: |
          set -euo pipefail
          case "${MODE}" in
            build)
              python3 Scripts/ResearchDevBuild.py \
                --source "${GITHUB_WORKSPACE}" \
                --lane "${DEV_LANE}" \
                --profile dev \
                build "${TARGET}" --jobs "${JOBS}"
              ;;
            linux-test-build)
              python3 Scripts/ResearchDevBuild.py \
                --source "${GITHUB_WORKSPACE}" \
                --lane "${LINUX_LANE}" \
                --profile linux-tests \
                linux-test-build "${TARGET}" --bitness "${BITNESS}" --jobs "${JOBS}"
              ;;
            *)
              echo "unsupported mode: ${MODE}" >&2
              exit 2
              ;;
          esac

      - name: Collect an exact-head receipt
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "build" ]]; then
            receipt_lane="${DEV_LANE}"
          else
            receipt_lane="${LINUX_LANE}"
          fi
          receipt="${HOME}/.cache/fex-dev/views/${receipt_lane}/last-receipt.json"
          if [[ ! -s "${receipt}" ]]; then
            echo "No new receipt was emitted for this attempt."
            exit 0
          fi
          RECEIPT="${receipt}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          if receipt.get("head") != os.environ["GITHUB_SHA"]:
              raise SystemExit("refusing stale receipt from a different product head")
          PY
          cp "${receipt}" "${RUNNER_TEMP}/fex-focused-receipt.json"

      - name: Publish the exact-head receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fex-focused-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fex-focused-receipt.json
          if-no-files-found: ignore
          retention-days: 14
