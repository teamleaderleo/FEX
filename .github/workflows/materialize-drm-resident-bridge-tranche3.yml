name: Materialize DRM resident bridge tranche 3

on:
  push:
    branches: [diagnostic/drm-direct-resident-callback-member-20260814]
    paths:
      - LinuxFieldwork/apply_drm_direct_resident_callback_member_bridge.py
      - .github/workflows/materialize-drm-resident-bridge-tranche3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      SOURCE_SHA: c348a19d91219d4df6cdaa86839607565e001fa2
      OUTPUT_BRANCH: integration/per-library-resident-bridges-drm-f3ab-20260814
      R: ${{ github.workspace }}/drm-tranche3-receipts
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Preserve validated transform and enter clean GL tranche 2 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          cp LinuxFieldwork/apply_drm_direct_resident_callback_member_bridge.py /tmp/apply_drm_direct_resident_callback_member_bridge.py
          git cat-file -e "$SOURCE_SHA^{commit}"
          git checkout --detach "$SOURCE_SHA"
          git submodule update --init --recursive
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee "$R/input-source.txt"

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config python3 \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev libdrm-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers libwayland-dev binutils

      - name: Apply only validated DRM source delta
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/apply_drm_direct_resident_callback_member_bridge.py | tee "$R/transform.txt"
          git add -N ThunkLibs/libdrm_bridge/Guest.cpp
          git diff --check
          git diff -- ThunkLibs > "$R/source.diff"
          test -s "$R/source.diff"

          git diff --name-only | sort | tee "$R/source-files.txt"
          cat > "$R/expected-source-files.txt" <<'EOF'
          ThunkLibs/GuestLibs/CMakeLists.txt
          ThunkLibs/libdrm/Guest.cpp
          ThunkLibs/libdrm/libdrm_interface.cpp
          ThunkLibs/libdrm_bridge/Guest.cpp
          EOF
          diff -u "$R/expected-source-files.txt" "$R/source-files.txt"

          grep -q 'fex_gen_config<&drmEventContext::vblank_handler> : fexgen::callback_member' ThunkLibs/libdrm/libdrm_interface.cpp
          grep -q 'fex_gen_config<&drmEventContext::page_flip_handler> : fexgen::callback_member' ThunkLibs/libdrm/libdrm_interface.cpp
          grep -q 'fex_gen_config<&drmEventContext::page_flip_handler2> : fexgen::callback_member' ThunkLibs/libdrm/libdrm_interface.cpp
          grep -q 'fex_gen_config<&drmEventContext::sequence_handler> : fexgen::callback_member' ThunkLibs/libdrm/libdrm_interface.cpp
          grep -q '#include "thunkgen_bridge_accessors_libdrm.inl"' ThunkLibs/libdrm/Guest.cpp
          grep -q '#define AllocateHostTrampolineForGuestFunction FEXAllocateResidentHostTrampolineForGuestFunction' ThunkLibs/libdrm/Guest.cpp
          grep -q 'add_guest_bridge(drm_bridge "libfex-drm-bridge.so"' ThunkLibs/GuestLibs/CMakeLists.txt
          grep -q '#include "thunkgen_bridge_libdrm.inl"' ThunkLibs/libdrm_bridge/Guest.cpp

      - name: Build combined host and guest targets
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-host.log" 2>&1
          cmake --build build --target \
            thunkgen GL-host-64 vulkan-host-64 cuda-host-64 wayland-client-host-64 drm-host-64 \
            -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1 \
            || { tail -n 520 "$R/build-host.log"; exit 1; }

          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest --target \
            GL-guest GL_bridge-guest \
            vulkan-guest vulkan_bridge-guest \
            cuda-guest cuda_bridge-guest \
            wayland-client-guest wayland-client_bridge-guest \
            drm-guest drm_bridge-guest \
            -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1 \
            || { tail -n 620 "$R/build-guest.log"; exit 1; }

      - name: Verify generated roles and all resident ELF boundaries
        shell: bash
        run: |
          set -euxo pipefail
          cp guest/gen/thunkgen_bridge_libGL.inl "$R/gl-bridge.inl"
          test "$(grep -c 'caller=1 unpacker=0' "$R/gl-bridge.inl")" -eq 736
          ! grep -q 'unpacker=1' "$R/gl-bridge.inl"

          cp guest/gen/thunkgen_bridge_libdrm.inl "$R/drm-bridge.inl"
          grep 'FEX_BRIDGE_ROLE' "$R/drm-bridge.inl" | tee "$R/drm-role-lines.txt"
          test "$(grep -c 'caller=0 unpacker=1' "$R/drm-role-lines.txt")" -eq 3
          ! grep -q 'caller=1' "$R/drm-role-lines.txt"
          test "$(wc -l < "$R/drm-role-lines.txt")" -eq 3

          for pair in \
            'gl libGL-guest.so libfex-GL-bridge.so' \
            'vulkan libvulkan-guest.so libfex-vulkan-bridge.so' \
            'cuda libcuda-guest.so libfex-cuda-bridge.so' \
            'wayland libwayland-client-guest.so libfex-wayland-client-bridge.so' \
            'drm libdrm-guest.so libfex-drm-bridge.so'; do
            set -- $pair
            name="$1"; wrapper="guest/$2"; bridge="guest/$3"
            readelf -d "$wrapper" > "$R/${name}-wrapper.dynamic"
            readelf -d "$bridge" > "$R/${name}-bridge.dynamic"
            ! grep -q 'FLAGS_1.*NODELETE' "$R/${name}-wrapper.dynamic"
            grep -q 'NEEDED.*libfex-' "$R/${name}-wrapper.dynamic"
            grep -q 'RUNPATH.*\$ORIGIN' "$R/${name}-wrapper.dynamic"
            grep -q 'FLAGS_1.*NODELETE' "$R/${name}-bridge.dynamic"
          done

          size \
            guest/libGL-guest.so guest/libfex-GL-bridge.so \
            guest/libvulkan-guest.so guest/libfex-vulkan-bridge.so \
            guest/libcuda-guest.so guest/libfex-cuda-bridge.so \
            guest/libwayland-client-guest.so guest/libfex-wayland-client-bridge.so \
            guest/libdrm-guest.so guest/libfex-drm-bridge.so \
            | tee "$R/size.txt"
          echo COMBINED_TRANCHE3_BUILD_ELF_OK | tee "$R/gate.txt"

      - name: Create one clean source-only commit and push tranche 3
        shell: bash
        run: |
          set -euxo pipefail
          git add \
            ThunkLibs/GuestLibs/CMakeLists.txt \
            ThunkLibs/libdrm/Guest.cpp \
            ThunkLibs/libdrm/libdrm_interface.cpp \
            ThunkLibs/libdrm_bridge/Guest.cpp
          git diff --cached --check
          git diff --cached --name-only | sort | tee "$R/staged-files.txt"
          diff -u "$R/expected-source-files.txt" "$R/staged-files.txt"
          git diff --cached --binary > /tmp/drm-resident-tranche3.patch
          cp /tmp/drm-resident-tranche3.patch "$R/source-only.patch"

          git reset --hard "$SOURCE_SHA"
          git checkout -B "$OUTPUT_BRANCH" "$SOURCE_SHA"
          git apply --index /tmp/drm-resident-tranche3.patch
          git diff --cached --check
          git diff --cached --name-only | sort | tee "$R/final-files.txt"
          diff -u "$R/expected-source-files.txt" "$R/final-files.txt"

          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Research: add DRM resident callback bridge'
          git rev-parse HEAD | tee "$R/integration-commit.txt"
          git rev-parse HEAD^ | tee "$R/integration-parent.txt"
          test "$(cat "$R/integration-parent.txt")" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-drm-resident-tranche3-${{ github.run_id }}
          path: drm-tranche3-receipts
          retention-days: 30
