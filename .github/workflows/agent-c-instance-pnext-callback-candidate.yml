name: Agent C Vulkan instance pNext callback candidate

on:
  workflow_dispatch:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths: [.github/workflows/agent-c-instance-pnext-callback-candidate.yml]

permissions:
  contents: read

env:
  FEX_SHA: c011366706eaf65a00380003989b3a10811212b6
  DEBIAN_FRONTEND: noninteractive
  ROOTFS: ${{ github.workspace }}/rootfs-amd64
  HOST: ${{ github.workspace }}/host
  R: ${{ github.workspace }}/receipts
  FEX_PORTABLE: 1

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate base
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          {
            echo "base_fex_sha=$(git -C src rev-parse HEAD)"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools \
            vulkan-validationlayers debootstrap

      - name: Build callback-chain probe and native controls
        shell: bash
        run: |
          set -euxo pipefail
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" > "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

          cat >/tmp/instance-pnext-callbacks.c <<'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #define VK_NO_PROTOTYPES
          #include <vulkan/vulkan.h>

          static volatile uint32_t utils_count;
          static volatile uint32_t report_count;

          VKAPI_ATTR VkBool32 VKAPI_CALL utils_callback(
              VkDebugUtilsMessageSeverityFlagBitsEXT severity,
              VkDebugUtilsMessageTypeFlagsEXT types,
              const VkDebugUtilsMessengerCallbackDataEXT *data,
              void *user) {
            (void)user;
            ++utils_count;
            fprintf(stderr, "UTILS_CALLBACK count=%u severity=%u types=%u id=%s\n",
                    utils_count, (unsigned)severity, (unsigned)types,
                    data && data->pMessageIdName ? data->pMessageIdName : "<null>");
            fflush(stderr);
            return VK_FALSE;
          }

          VKAPI_ATTR VkBool32 VKAPI_CALL report_callback(
              VkDebugReportFlagsEXT flags,
              VkDebugReportObjectTypeEXT object_type,
              uint64_t object,
              size_t location,
              int32_t code,
              const char *layer_prefix,
              const char *message,
              void *user) {
            (void)object_type; (void)object; (void)location; (void)code;
            (void)layer_prefix; (void)message; (void)user;
            ++report_count;
            fprintf(stderr, "REPORT_CALLBACK count=%u flags=%u\n", report_count, (unsigned)flags);
            fflush(stderr);
            return VK_FALSE;
          }

          static int has_extension(PFN_vkEnumerateInstanceExtensionProperties enumerate, const char *wanted) {
            uint32_t count = 0;
            if (enumerate(NULL, &count, NULL) != VK_SUCCESS) return 0;
            VkExtensionProperties *props = calloc(count ? count : 1, sizeof(*props));
            if (!props) return 0;
            if (enumerate(NULL, &count, props) != VK_SUCCESS) { free(props); return 0; }
            int found = 0;
            for (uint32_t i = 0; i < count; ++i) if (!strcmp(props[i].extensionName, wanted)) found = 1;
            free(props);
            return found;
          }

          static int has_layer(PFN_vkEnumerateInstanceLayerProperties enumerate, const char *wanted) {
            uint32_t count = 0;
            if (enumerate(&count, NULL) != VK_SUCCESS) return 0;
            VkLayerProperties *props = calloc(count ? count : 1, sizeof(*props));
            if (!props) return 0;
            if (enumerate(&count, props) != VK_SUCCESS) { free(props); return 0; }
            int found = 0;
            for (uint32_t i = 0; i < count; ++i) if (!strcmp(props[i].layerName, wanted)) found = 1;
            free(props);
            return found;
          }

          int main(int argc, char **argv) {
            int mixed = argc > 1 && !strcmp(argv[1], "mixed");
            int expect_callback = 1;
            const char *expect = getenv("EXPECT_CALLBACK");
            if (expect) expect_callback = atoi(expect) != 0;

            void *vk = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!vk) { fprintf(stderr, "DLOPEN=%s\n", dlerror()); return 10; }
            PFN_vkCreateInstance create_instance = (PFN_vkCreateInstance)dlsym(vk, "vkCreateInstance");
            PFN_vkDestroyInstance destroy_instance = (PFN_vkDestroyInstance)dlsym(vk, "vkDestroyInstance");
            PFN_vkEnumerateInstanceLayerProperties enumerate_layers =
              (PFN_vkEnumerateInstanceLayerProperties)dlsym(vk, "vkEnumerateInstanceLayerProperties");
            PFN_vkEnumerateInstanceExtensionProperties enumerate_extensions =
              (PFN_vkEnumerateInstanceExtensionProperties)dlsym(vk, "vkEnumerateInstanceExtensionProperties");
            if (!create_instance || !destroy_instance || !enumerate_layers || !enumerate_extensions) return 11;

            const char *layer = "VK_LAYER_KHRONOS_validation";
            int layer_ok = has_layer(enumerate_layers, layer);
            int utils_ok = has_extension(enumerate_extensions, VK_EXT_DEBUG_UTILS_EXTENSION_NAME);
            int report_ok = has_extension(enumerate_extensions, VK_EXT_DEBUG_REPORT_EXTENSION_NAME);
            fprintf(stderr,
                    "CHAIN_PREFLIGHT mode=%s layer=%d utils=%d report=%d expect_callback=%d utils_cb=%p report_cb=%p\n",
                    mixed ? "mixed" : "utils", layer_ok, utils_ok, report_ok, expect_callback,
                    (void*)utils_callback, (void*)report_callback);
            fflush(stderr);
            if (!layer_ok || !utils_ok || (mixed && !report_ok)) return 12;

            VkDebugUtilsMessengerCreateInfoEXT utils = {
              .sType = VK_STRUCTURE_TYPE_DEBUG_UTILS_MESSENGER_CREATE_INFO_EXT,
              .pNext = NULL,
              .messageSeverity = VK_DEBUG_UTILS_MESSAGE_SEVERITY_VERBOSE_BIT_EXT |
                                 VK_DEBUG_UTILS_MESSAGE_SEVERITY_INFO_BIT_EXT |
                                 VK_DEBUG_UTILS_MESSAGE_SEVERITY_WARNING_BIT_EXT |
                                 VK_DEBUG_UTILS_MESSAGE_SEVERITY_ERROR_BIT_EXT,
              .messageType = VK_DEBUG_UTILS_MESSAGE_TYPE_GENERAL_BIT_EXT |
                             VK_DEBUG_UTILS_MESSAGE_TYPE_VALIDATION_BIT_EXT |
                             VK_DEBUG_UTILS_MESSAGE_TYPE_PERFORMANCE_BIT_EXT,
              .pfnUserCallback = utils_callback,
            };
            VkDebugReportCallbackCreateInfoEXT report = {
              .sType = VK_STRUCTURE_TYPE_DEBUG_REPORT_CALLBACK_CREATE_INFO_EXT,
              .pNext = &utils,
              .flags = VK_DEBUG_REPORT_INFORMATION_BIT_EXT |
                       VK_DEBUG_REPORT_WARNING_BIT_EXT |
                       VK_DEBUG_REPORT_PERFORMANCE_WARNING_BIT_EXT |
                       VK_DEBUG_REPORT_ERROR_BIT_EXT |
                       VK_DEBUG_REPORT_DEBUG_BIT_EXT,
              .pfnCallback = report_callback,
            };
            VkApplicationInfo app = {
              .sType = VK_STRUCTURE_TYPE_APPLICATION_INFO,
              .pApplicationName = "fex-instance-pnext-callbacks",
              .apiVersion = VK_API_VERSION_1_0,
            };
            const char *layers[] = { layer };
            const char *extensions_utils[] = { VK_EXT_DEBUG_UTILS_EXTENSION_NAME };
            const char *extensions_mixed[] = {
              VK_EXT_DEBUG_UTILS_EXTENSION_NAME,
              VK_EXT_DEBUG_REPORT_EXTENSION_NAME,
            };
            VkInstanceCreateInfo ici = {
              .sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO,
              .pNext = mixed ? (const void*)&report : (const void*)&utils,
              .flags = (VkInstanceCreateFlags)0x80000000u,
              .pApplicationInfo = &app,
              .enabledLayerCount = 1,
              .ppEnabledLayerNames = layers,
              .enabledExtensionCount = mixed ? 2u : 1u,
              .ppEnabledExtensionNames = mixed ? extensions_mixed : extensions_utils,
            };

            fprintf(stderr, "CHAIN_BEFORE_CREATE mode=%s utils=%u report=%u\n",
                    mixed ? "mixed" : "utils", utils_count, report_count);
            fflush(stderr);
            VkInstance instance = VK_NULL_HANDLE;
            VkResult result = create_instance(&ici, NULL, &instance);
            fprintf(stderr, "CHAIN_AFTER_CREATE mode=%s result=%d instance=%p utils=%u report=%u\n",
                    mixed ? "mixed" : "utils", result, (void*)instance, utils_count, report_count);
            fflush(stderr);
            if (result != VK_SUCCESS || instance == VK_NULL_HANDLE) return 20;

            uint32_t observed_at_create = utils_count + report_count;
            destroy_instance(instance, NULL);
            fprintf(stderr, "CHAIN_AFTER_DESTROY mode=%s utils=%u report=%u\n",
                    mixed ? "mixed" : "utils", utils_count, report_count);
            fflush(stderr);
            if (dlclose(vk) != 0) return 21;

            if (expect_callback && observed_at_create == 0) return 30;
            if (!expect_callback && observed_at_create != 0) return 31;
            fprintf(stderr, "CHAIN_RETURN mode=%s observed_at_create=%u expected=%d\n",
                    mixed ? "mixed" : "utils", observed_at_create, expect_callback);
            fflush(stderr);
            return 0;
          }
          EOF

          cc -O2 -g -Wall -Wextra -Werror \
            -Isrc/External/Vulkan-Headers/include /tmp/instance-pnext-callbacks.c -ldl -o /tmp/pnext-arm64
          x86_64-linux-gnu-gcc -O2 -g -Wall -Wextra -Werror \
            -Isrc/External/Vulkan-Headers/include /tmp/instance-pnext-callbacks.c -ldl -o /tmp/pnext-x86_64
          file /tmp/pnext-arm64 /tmp/pnext-x86_64 | tee "$R/probes.file.txt"

          for mode in utils mixed; do
            set +e
            VK_DRIVER_FILES="$LVP_ICD" EXPECT_CALLBACK=1 /tmp/pnext-arm64 "$mode" \
              >"$R/native-$mode.out" 2>"$R/native-$mode.err"
            rc=$?
            set -e
            echo "$rc" | tee "$R/native-$mode.exit"
            cat "$R/native-$mode.err"
            test "$rc" -eq 0
            grep -q "^CHAIN_AFTER_CREATE mode=$mode .*utils=[0-9].*report=[0-9]" "$R/native-$mode.err"
            grep -q "^CHAIN_RETURN mode=$mode .*expected=1" "$R/native-$mode.err"
          done

      - name: Apply instance pNext callback-suppression candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          old = '''  const VkInstanceCreateInfo* vk_struct_base = a_0;
          for (const VkBaseInStructure* vk_struct = reinterpret_cast<const VkBaseInStructure*>(vk_struct_base); vk_struct->pNext;
               vk_struct = vk_struct->pNext) {
            // Override guest callbacks used for VK_EXT_debug_report
            if (reinterpret_cast<const VkBaseInStructure*>(vk_struct->pNext)->sType == VK_STRUCTURE_TYPE_DEBUG_REPORT_CREATE_INFO_EXT) {
              // Overwrite the pNext pointer, ignoring its const-qualifier
              const_cast<VkBaseInStructure*>(vk_struct)->pNext = vk_struct->pNext->pNext;

              // If we copied over a nullptr for pNext then early exit
              if (!vk_struct->pNext) {
                break;
              }
            }
          }
          '''
          new = '''  const VkInstanceCreateInfo* vk_struct_base = a_0;
          for (const VkBaseInStructure* vk_struct = reinterpret_cast<const VkBaseInStructure*>(vk_struct_base); vk_struct->pNext;) {
            const auto next_type = vk_struct->pNext->sType;
            // Override guest callbacks used by temporary debug callbacks during instance creation.
            if (next_type == VK_STRUCTURE_TYPE_DEBUG_REPORT_CREATE_INFO_EXT ||
                next_type == VK_STRUCTURE_TYPE_DEBUG_UTILS_MESSENGER_CREATE_INFO_EXT) {
              // Overwrite the pNext pointer, ignoring its const-qualifier. Re-check the same
              // predecessor so consecutive callback-bearing nodes are all removed.
              const_cast<VkBaseInStructure*>(vk_struct)->pNext = vk_struct->pNext->pNext;
              continue;
            }
            vk_struct = vk_struct->pNext;
          }
          '''
          if old not in s:
            raise SystemExit('expected vkCreateInstance callback filter not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git -C src diff --check
          git -C src diff -- ThunkLibs/libvulkan/Host.cpp | tee "$R/candidate.diff"

      - name: Build candidate and focused x86-64 Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF \
            -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"

          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ \
            >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1

      - name: Build package-resolved amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap \
            --arch=amd64 --foreign --variant=minbase --components=main,universe \
            --include=libvulkan1,libx11-6 \
            noble "$ROOTFS" http://archive.ubuntu.com/ubuntu \
            >"$R/debootstrap.log" 2>&1
          sudo find "$ROOTFS" -type f -name '*.deb' -print | sort > "$R/rootfs-debs.txt"
          sed -n 's/^I: Extracting \([^ ]*\)\.\.\.$/\1/p' "$R/debootstrap.log" | sort -u > "$R/rootfs-already-extracted.txt"
          : > "$R/rootfs-deferred-extracted.txt"
          while IFS= read -r deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            if grep -Fxq "$pkg" "$R/rootfs-already-extracted.txt"; then continue; fi
            echo "$pkg" >> "$R/rootfs-deferred-extracted.txt"
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done < "$R/rootfs-debs.txt"
          sudo cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          sudo ln -sf libvulkan.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so"
          sudo mkdir -p "$ROOTFS/usr/local/bin"
          sudo install -m755 /tmp/pnext-x86_64 "$ROOTFS/usr/local/bin/instance-pnext-callbacks"
          X11="$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          for sym in XSync XGetVisualInfo XDisplayString; do
            x86_64-linux-gnu-readelf -Ws "$X11" | grep -E " ${sym}(@|$)" | head -1
          done

      - name: Run candidate through FEX
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          for mode in utils mixed; do
            set +e
            timeout 90s env \
              VK_DRIVER_FILES="$LVP_ICD" \
              FEX_ROOTFS="$ROOTFS" \
              FEX_THUNKHOSTLIBS="$HOST" \
              EXPECT_CALLBACK=0 \
              "$FEX" /usr/local/bin/instance-pnext-callbacks "$mode" \
              >"$R/fex-$mode.out" 2>"$R/fex-$mode.err"
            rc=$?
            set -e
            echo "$rc" | tee "$R/fex-$mode.exit"
            cat "$R/fex-$mode.err"
            test "$rc" -eq 0
            grep -q "^CHAIN_AFTER_CREATE mode=$mode result=0 .*utils=0 report=0" "$R/fex-$mode.err"
            grep -q "^CHAIN_RETURN mode=$mode observed_at_create=0 expected=0" "$R/fex-$mode.err"
            ! grep -q '^UTILS_CALLBACK ' "$R/fex-$mode.err"
            ! grep -q '^REPORT_CALLBACK ' "$R/fex-$mode.err"
          done
          {
            echo 'utils=0'
            echo 'mixed=0'
            echo 'guest_callbacks=0'
            echo 'candidate_status=pass'
          } | tee "$R/summary.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-instance-pnext-callback-candidate-${{ github.run_id }}
          path: receipts
          retention-days: 30
