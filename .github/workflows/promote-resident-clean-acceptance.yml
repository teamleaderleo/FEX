name: Promote resident clean acceptance carriers

on:
  push:
    branches:
      - diagnostic/thunkgen-resident-output-clean-v1
    paths:
      - .github/workflows/promote-resident-clean-acceptance.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: diagnostic/thunkgen-resident-output-clean-v1

      - name: Convert diagnostic carriers to committed-source validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          branch_old = 'diagnostic/thunkgen-resident-output-v1'
          branch_new = 'diagnostic/thunkgen-resident-output-clean-v1'
          trigger = '      - .github/clean-resident-trigger\n'

          def base_edit(path):
              p = Path(path)
              s = p.read_text()
              if branch_old not in s:
                  raise SystemExit(f'{path}: old branch anchor missing')
              s = s.replace(branch_old, branch_new)
              s = re.sub(r'^      - ThunkLibs/Generator/apply_resident[^\n]*\n', '', s, flags=re.M)
              if trigger.strip() not in s:
                  marker = f'      - {path}\n'
                  if marker not in s:
                      raise SystemExit(f'{path}: workflow path marker missing')
                  s = s.replace(marker, marker + trigger, 1)
              p.write_text(s)
              return p

          runtime = base_edit('.github/workflows/thunkgen-resident-runtime-v1.yml')
          s = runtime.read_text()
          pattern = re.compile(r'^      - name: Apply first-class direction-aware resident generator candidate\n.*?(?=^      - name: Build FEX and stock GL host thunk\n)', re.M | re.S)
          replacement = '''      - name: Verify committed first-class direction-aware resident generator\n        shell: bash\n        run: |\n          set -euxo pipefail\n          git diff --check\n          git show --stat --oneline HEAD | tee "$R/committed-resident-output.txt"\n          grep -q -- '-guest-resident' ThunkLibs/Generator/main.cpp\n          grep -q 'generate(libGL .* RESIDENT_BRIDGE)' ThunkLibs/GuestLibs/CMakeLists.txt\n          grep -q 'host_to_guest_callback_funcptrs' ThunkLibs/Generator/analysis.cpp\n          grep -q 'used_as_callback' ThunkLibs/Generator/gen.cpp\n          ! grep -q 'FEXResidentBridgeCanUnpack' ThunkLibs/Generator/gen.cpp\n          ! grep -q 'sizeof...(Args) <= 19' ThunkLibs/Generator/gen.cpp\n          test ! -e ThunkLibs/Generator/extract_guest_bridge.py\n          test ! -e ThunkLibs/Generator/apply_resident_output_candidate.py\n          test ! -e ThunkLibs/Generator/apply_resident_direction_candidate.py\n\n'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'runtime apply-step replacements={n}')
          runtime.write_text(s2)

          vulkan = base_edit('.github/workflows/thunkgen-resident-vulkan-direction-v1.yml')
          s = vulkan.read_text()
          pattern = re.compile(r'^      - name: Apply one-pass direction-aware Vulkan candidate\n.*?(?=^      - name: Build thunkgen\n)', re.M | re.S)
          replacement = '''      - name: Verify committed one-pass direction-aware Vulkan generator\n        shell: bash\n        run: |\n          set -euxo pipefail\n          git diff --check\n          git show --stat --oneline HEAD | tee "$R/committed-vulkan-resident-output.txt"\n          grep -q 'generate(libvulkan .* RESIDENT_BRIDGE)' ThunkLibs/GuestLibs/CMakeLists.txt\n          grep -q 'host_to_guest_callback_funcptrs' ThunkLibs/Generator/analysis.cpp\n          ! grep -q 'FEXResidentBridgeCanUnpack' ThunkLibs/Generator/gen.cpp\n          test ! -e ThunkLibs/Generator/extract_guest_bridge.py\n          test ! -e ThunkLibs/Generator/apply_resident_vulkan_first_class_candidate.py\n\n'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'vulkan apply-step replacements={n}')
          vulkan.write_text(s2)

          positive = base_edit('.github/workflows/thunkgen-resident-direction-positive-v1.yml')
          s = positive.read_text()
          s = s.replace('      - name: Apply generator candidate and one-callback fixture\n',
                        '      - name: Use committed generator and one-callback fixture\n', 1)
          for line in [
              '          python3 ThunkLibs/Generator/apply_resident_output_candidate.py\n',
              '          python3 ThunkLibs/Generator/apply_resident_output_candidate_fixups.py\n',
              '          python3 ThunkLibs/Generator/apply_resident_direction_candidate.py\n',
              '          rm ThunkLibs/Generator/extract_guest_bridge.py\n',
          ]:
              if line not in s:
                  raise SystemExit(f'positive missing line: {line.strip()}')
              s = s.replace(line, '', 1)
          positive.write_text(s)

          for p in [runtime, vulkan, positive]:
              text = p.read_text()
              if branch_old in text:
                  raise SystemExit(f'{p}: stale branch')
              if 'apply_resident_output_candidate.py\n' in text:
                  raise SystemExit(f'{p}: stale apply invocation')
          PY

          git diff --check
          rm .github/workflows/promote-resident-clean-acceptance.yml

      - name: Commit clean acceptance carriers
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'CI: validate committed resident bridge generation'
          git push origin HEAD:diagnostic/thunkgen-resident-output-clean-v1
