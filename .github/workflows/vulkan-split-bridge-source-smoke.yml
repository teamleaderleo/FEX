name: Vulkan split bridge source smoke

on:
  push:
    branches: [ci/thunk-callback-descriptor-20260814]
    paths:
      - .github/fieldwork/apply_vulkan_split_bridge.py
      - .github/workflows/vulkan-split-bridge-source-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: 71afe476751deac24adabd1adb575fd2337b6e0a
          path: src
          fetch-depth: 1
      - name: Apply and syntax-check transformer outputs
        run: |
          set -euxo pipefail
          python3 .github/fieldwork/apply_vulkan_split_bridge.py src
          git -C src diff --check
          python3 -m py_compile src/ThunkLibs/libvulkan/ExtractBridgeThunks.py src/ThunkLibs/libvulkan/ExtractBridgeSymbols.py
          grep -nE 'fex_vulkan_bridge|vulkan-bridge-guest|ExtractBridge' \
            src/ThunkLibs/libvulkan/Guest.cpp src/ThunkLibs/GuestLibs/CMakeLists.txt src/ThunkLibs/libvulkan/GuestBridge.cpp
