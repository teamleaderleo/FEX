name: Split resident bridge in-flight race ARM64

on:
  push:
    branches: [ci/thunk-callback-descriptor-20260814]
    paths:
      - .github/fieldwork/patch_split_resident_bridge_fixture.py
      - .github/fieldwork/patch_split_inflight_fixture.py
      - .github/workflows/thunk-split-inflight-race-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-inflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4

      - name: Checkout exact stock FEX source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout proven post-selection barrier helper
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-inflight-selection-race-20260814
          path: barrier-helper
          fetch-depth: 1

      - name: Checkout retained fixture
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: investigation/fex-vulkan-thunk-lifecycle
          path: fieldwork
          fetch-depth: 1

      - name: Dependencies and split in-flight fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" /tmp/repro /tmp/fex-fieldwork
          chmod 0777 /tmp/fex-fieldwork
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          tar xf /tmp/repro.tar.gz -C /tmp/repro
          python3 .github/fieldwork/patch_split_resident_bridge_fixture.py /tmp/repro
          python3 .github/fieldwork/patch_split_inflight_fixture.py /tmp/repro
          grep -nE 'split inflight|SPLIT_INFLIGHT_RESULT' /tmp/repro/fex-full-thunk-pair/guest/main.cpp | tee "$R/fixture-sites.txt"

      - name: Apply only the post-selection barrier to stock FEX
        shell: bash
        run: |
          set -euxo pipefail
          python3 barrier-helper/.github/fieldwork/patch_exitlink_inflight_barrier.py src
          git -C src diff --check
          git -C src diff > "$R/barrier-only.diff"
          git -C src rev-parse HEAD > "$R/product-sha.txt"
          ! grep -R -q 'DIAG_MT_' src/FEXCore src/Source || true

      - name: Build barrier-instrumented stock FEX and split fixture
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-fex.log" 2>&1
          (cd /tmp/repro/fex-full-thunk-pair && make clean && make HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++) \
            > "$R/build-fixture.log" 2>&1
          readelf -d /tmp/repro/fex-full-thunk-pair/guest/liblifetime-bridge.so > "$R/bridge.dynamic.txt"
          grep -q NODELETE "$R/bridge.dynamic.txt"

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute selected-before-wrapper-unmap split race
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          BARRIER="/tmp/fex-fieldwork"
          rm -f "$BARRIER/target" "$BARRIER/selected" "$BARRIER/resume"
          set +e
          (cd "$ROOTFS/opt/fex-ci/full" && \
            FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
            FEX_FIELDWORK_EXITLINK_BARRIER_DIR="$BARRIER" \
            timeout 30s "$FEX" /opt/fex-ci/full/guest/fex_full_lifetime --split-inflight) \
            > "$R/run.stdout" 2> "$R/run.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/run.exit"
          grep -E 'DIAG_INFLIGHT|split inflight|SPLIT_INFLIGHT_RESULT|native host' \
            "$R/run.stdout" "$R/run.stderr" > "$R/key-lines.txt" || true
          cat "$R/key-lines.txt"
          test "$rc" = 0
          grep -q 'DIAG_INFLIGHT_SELECTED' "$R/run.stderr"
          grep -q 'split inflight wrapper unmapped before resume; bridge resident' "$R/run.stdout"
          grep -q 'DIAG_INFLIGHT_RESUME' "$R/run.stderr"
          grep -q 'split inflight worker returned   rv=23 want=23' "$R/run.stdout"
          grep -q 'split inflight reload wrapper.*DIFFERENT' "$R/run.stdout"
          grep -q 'split inflight reload bridge.*SAME' "$R/run.stdout"
          grep -q 'SPLIT_INFLIGHT_RESULT selected-resident-bridge-survived-wrapper-unmap' "$R/run.stdout"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-resident-inflight-race-${{ github.run_id }}
          path: receipts
          retention-days: 30
