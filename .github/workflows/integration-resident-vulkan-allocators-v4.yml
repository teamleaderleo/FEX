name: Integrated resident Vulkan allocator callbacks v4

on:
  push:
    branches: [ci/integration-resident-vulkan-allocators-20260814]
    paths: [.github/workflows/integration-resident-vulkan-allocators-v4.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vulkan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      BASE: 48e28a2ce9da1334feb8d7b77dbade66efa24be2
      ALLOC_CARRIER: 669220a85abf80e34599696dbf102788956e726b
      OUTPUT_BRANCH: integration/per-library-resident-bridges-vulkan-allocators-20260814
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/integrated-v3-receipts
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: probe/fex-vulkan-customir-retirement
          path: fieldwork
          fetch-depth: 1

      - name: Extract v3 shell steps and remove receipt-only head pipelines
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/integration-resident-vulkan-allocators-v3.yml').read_text().splitlines()
          blocks=[]; i=0
          while i < len(lines):
              line=lines[i]; stripped=line.lstrip()
              if stripped != 'run: |':
                  i += 1
                  continue
              base=len(line)-len(stripped); body=[]; i += 1
              while i < len(lines):
                  row=lines[i]
                  if row.strip() and len(row)-len(row.lstrip()) <= base:
                      break
                  body.append('' if not row.strip() else row[base+2:]); i += 1
              text='\n'.join(body)+'\n'
              text=text.replace(' | head -n 8 | tee "$R/finalizers.txt"', ' | tee "$R/finalizers.txt"')
              text=text.replace(' | head -n 2 | tee "$R/const-wrapper.txt"', ' | tee "$R/const-wrapper.txt"')
              blocks.append(text)
          if len(blocks) != 7:
              raise SystemExit(f'expected 7 v3 shell blocks, got {len(blocks)}')
          out=Path('/tmp/vulkan-v4'); out.mkdir(exist_ok=True)
          for idx,text in enumerate(blocks,1):
              p=out/f'{idx:02d}.sh'
              p.write_text('#!/usr/bin/env bash\n'+text)
              p.chmod(0o755)
              print('EXTRACTED',p)
          PY

      - name: Replay exact v3 candidate and runtime gates
        shell: bash
        run: |
          set -euxo pipefail
          for step in /tmp/vulkan-v4/*.sh; do
            echo "===== $step ====="
            "$step"
          done

      - name: Assert final integrated receipt
        shell: bash
        run: |
          set -euxo pipefail
          cat "$R/final-matrix.txt"
          grep -q '^native=0$' "$R/final-matrix.txt"
          grep -q '^allocator=0$' "$R/final-matrix.txt"
          grep -q '^pfn_close=0$' "$R/final-matrix.txt"
          grep -q '^pfn_reload=0$' "$R/final-matrix.txt"
          grep -q 'OUTCOME=resident_bridge_plus_generated_vulkan_allocators_passed' "$R/final-matrix.txt"
          test -s "$R/integration-commit.txt"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-resident-vulkan-v4-${{ github.run_id }}
          path: integrated-v3-receipts
          retention-days: 30
