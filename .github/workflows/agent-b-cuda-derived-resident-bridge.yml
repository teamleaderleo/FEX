name: Agent B CUDA derived resident bridge moved reload

on:
  push:
    branches: [ci/agent-b-cuda-derived-resident-bridge-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [local, resident]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      MODE: ${{ matrix.mode }}
      PRODUCT_SHA: f3ab82a73fb48271ee12a882c98bc5d823a2b4d1
      R: ${{ github.workspace }}/receipts-${{ matrix.mode }}
      HOST: ${{ github.workspace }}/host-thunks-${{ matrix.mode }}
      SYNTH: ${{ github.workspace }}/synthetic-cuda-${{ matrix.mode }}
      ROOTFS: ${{ github.workspace }}/rootfs-${{ matrix.mode }}
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Dependencies and exact-product provenance
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST" "$SYNTH"
          git log --oneline --decorate -20 | tee "$R/lineage.txt"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git diff --name-only "$PRODUCT_SHA" -- ThunkLibs FEXCore Source | tee "$R/pre-patch-product-source-diff.txt"
          test ! -s "$R/pre-patch-product-source-diff.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config python3 \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev binutils

      - name: Build synthetic retained CUDA endpoint and native deferred control
        shell: bash
        run: |
          set -euxo pipefail
          cc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libcuda.so.1 \
            LinuxFieldwork/synthetic_libcuda_retained_hostnode.c -o "$SYNTH/libcuda.so.1"
          cat > /tmp/native-deferred.c <<'EOF'
          #include <dlfcn.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>
          typedef int R; typedef void* H; typedef void(*CB)(void*);
          typedef struct { CB fn; void* user; } P;
          typedef R(*ADD)(H*,H,const H*,size_t,const P*); typedef R(*LAUNCH)(H,H);
          static unsigned count;
          static void cb(void*u){++count;fprintf(stderr,"NATIVE_DEFERRED_CALLBACK count=%u user=%p\n",count,u);}
          int main(void){
            void*l=dlopen("libcuda.so.1",RTLD_NOW|RTLD_LOCAL); if(!l)return 2;
            ADD a=(ADD)dlsym(l,"cuGraphAddHostNode"); LAUNCH x=(LAUNCH)dlsym(l,"cuGraphLaunch"); if(!a||!x)return 3;
            P p={cb,(void*)(uintptr_t)0x12345678}; H n=0;
            if(a(&n,(H)0x1111,0,0,&p)||count)return 4;
            if(x((H)0x2222,(H)0x3333)||count!=1)return 5;
            return 0;
          }
          EOF
          cc -O2 -Wall -Wextra -Werror /tmp/native-deferred.c -ldl -o "$R/native-deferred"
          LD_LIBRARY_PATH="$SYNTH" "$R/native-deferred" > "$R/native.stdout" 2> "$R/native.stderr"
          echo $? > "$R/native.exit"
          cat "$R/native.stderr"
          grep -q 'SYNTH_CUDA_RETAIN' "$R/native.stderr"
          grep -q 'SYNTH_CUDA_LAUNCH' "$R/native.stderr"
          grep -q 'NATIVE_DEFERRED_CALLBACK count=1 user=0x12345678' "$R/native.stderr"

      - name: Apply generated callback_member to CUDA
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_nested_callback_member_generator.py
          git checkout "$PRODUCT_SHA" -- ThunkLibs/libdrm/libdrm_interface.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ThunkLibs/libcuda/libcuda_interface.cpp')
          s=p.read_text()
          old='''template<>\nstruct fex_gen_type<CUDA_HOST_NODE_PARAMS_st> : fexgen::opaque_type {};\n'''
          new='''template<>\nstruct fex_gen_type<CUDA_HOST_NODE_PARAMS_st> {};\ntemplate<>\nstruct fex_gen_config<&CUDA_HOST_NODE_PARAMS_st::_0> : fexgen::callback_member {};\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check

      - name: Build FEX host
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer cuda-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 260 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libcuda-host.so "$HOST/libcuda-host.so"

      - name: Apply derived resident CUDA bridge
        if: matrix.mode == 'resident'
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_cuda_derived_bridge.py
          git diff --check
          git diff -- ThunkLibs/Generator ThunkLibs/include/common/GeneratorInterface.h \
            ThunkLibs/libcuda ThunkLibs/libcuda_bridge ThunkLibs/GuestLibs/CMakeLists.txt \
            | tee "$R/resident-product.diff"

      - name: Build selected CUDA guest variant
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          if [ "$MODE" = resident ]; then
            cmake --build guest --target cuda-guest cuda_bridge-guest -- -j"$(nproc)" -v \
              > "$R/build-guest.log" 2>&1 || { tail -n 300 "$R/build-guest.log"; exit 1; }
            test -f guest/libcuda-guest.so
            test -f guest/libfex-cuda-bridge.so
            readelf -d guest/libcuda-guest.so > "$R/wrapper.dynamic"
            readelf -d guest/libfex-cuda-bridge.so > "$R/bridge.dynamic"
            ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
            grep -q 'NEEDED.*libfex-cuda-bridge.so' "$R/wrapper.dynamic"
            grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"
            python3 - <<'PY'
          import re
          from pathlib import Path
          n=Path('guest/gen/thunkgen_guest_libcuda.inl').read_text()
          b=Path('guest/gen/thunkgen_guest_libcuda_bridge.inl').read_text()
          pat=re.compile(r'^\s*MAKE_CALLBACK_THUNK\([^,]+,\s*(.*),\s*"',re.M)
          ns=set(pat.findall(n)); bs=set(pat.findall(b))
          Path('receipts-resident/signature-count.txt').write_text(f'normal_unique_signatures={len(ns)}\nbridge_unique_signatures={len(bs)}\n')
          print('normal_unique_signatures',len(ns)); print('bridge_unique_signatures',len(bs))
          assert ns == bs
          PY
          else
            cmake --build guest --target cuda-guest -- -j"$(nproc)" -v \
              > "$R/build-guest.log" 2>&1 || { tail -n 300 "$R/build-guest.log"; exit 1; }
            test -f guest/libcuda-guest.so
            readelf -d guest/libcuda-guest.so > "$R/wrapper.dynamic"
            ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          fi

      - name: Prepare isolated amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libcuda-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libcuda.so.1"
          if [ "$MODE" = resident ]; then
            cp guest/libfex-cuda-bridge.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libfex-cuda-bridge.so"
          fi
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror \
            LinuxFieldwork/cuda_hostnode_moved_reload_probe.c -ldl \
            -o "$ROOTFS/opt/fex-ci/cuda-retained-moved-probe"

      - name: Execute isolated moved-reload arm
        shell: bash
        run: |
          set -uxo pipefail
          set +e
          LD_LIBRARY_PATH="$SYNTH" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$GITHUB_WORKSPACE/build/Bin/FEX" /opt/fex-ci/cuda-retained-moved-probe \
            > "$R/fex.stdout" 2> "$R/fex.stderr"
          rc=$?
          set -e
          printf 'mode=%s\nnative_deferred=%s\nfex=%s\n' "$MODE" "$(cat "$R/native.exit")" "$rc" | tee "$R/final-matrix.txt"
          cat "$R/fex.stderr"

          grep -F -q "GEN1 wrapper=$ROOTFS/usr/lib/x86_64-linux-gnu/libcuda.so.1" "$R/fex.stderr"
          grep -q 'MARK close1-return old_add_mapped=0' "$R/fex.stderr"
          grep -q 'GEN2 .* moved=1' "$R/fex.stderr"
          grep -q 'MARK launch2-enter retained-registration-only' "$R/fex.stderr"

          if [ "$MODE" = local ]; then
            test "$rc" -eq 139
            ! grep -q 'CUDA_RETAINED_CALLBACK count=1' "$R/fex.stderr"
            ! grep -q 'MARK launch2-return' "$R/fex.stderr"
          else
            test "$rc" -eq 0
            grep -q 'CUDA_RETAINED_CALLBACK count=1 user=0x12345678' "$R/fex.stderr"
            grep -q 'MARK launch2-return rc=0 callbacks=1' "$R/fex.stderr"
          fi

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-cuda-derived-resident-bridge-${{ matrix.mode }}-${{ github.run_id }}
          path: receipts-${{ matrix.mode }}
          retention-days: 30
