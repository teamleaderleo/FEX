name: Agent C Vulkan PFN struct audit v2

on:
  workflow_dispatch:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths: [.github/workflows/agent-c-vulkan-pfn-struct-audit-v2.yml]

permissions:
  contents: read

env:
  FEX_SHA: c011366706eaf65a00380003989b3a10811212b6

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - name: Classify extensible PFN members by Vulkan API/provider
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p receipts
          python3 - <<'PY'
          import collections, json, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('src')
          x=ET.parse(root/'External/Vulkan-Headers/registry/vk.xml').getroot()
          nodes={}
          aliases={}
          for t in x.findall('./types/type'):
            if t.get('category')!='struct': continue
            n=t.get('name') or (t.findtext('name') if t.find('name') is not None else None)
            if not n: continue
            nodes[n]=t
            if t.get('alias'): aliases[n]=t.get('alias')
          def canon(n):
            seen=set()
            while n in aliases and n not in seen:
              seen.add(n); n=aliases[n]
            return n
          providers=collections.defaultdict(set)
          for f in x.findall('./feature'):
            api=f.get('api','')
            label=f'{api}:CORE_{f.get("number") or f.get("name") or "?"}'
            for req in f.findall('./require'):
              req_api=req.get('api') or api
              for ty in req.findall('type'):
                n=ty.get('name')
                if n: providers[canon(n)].add((req_api,label))
          for ext in x.findall('./extensions/extension'):
            supported=set((ext.get('supported') or '').split(','))
            label=ext.get('name') or 'UNKNOWN'
            for req in ext.findall('./require'):
              req_api=req.get('api')
              apis={req_api} if req_api else supported
              for ty in req.findall('type'):
                n=ty.get('name')
                if n:
                  for api in apis: providers[canon(n)].add((api,f'{api}:{label}'))
          rows=[]
          for raw,t in nodes.items():
            n=canon(raw)
            if raw!=n: continue
            extends=[s.strip() for s in t.get('structextends','').split(',') if s.strip()]
            if not extends: continue
            pfns=[]
            for m in t.findall('member'):
              mt=m.findtext('type') or ''
              mn=m.findtext('name') or ''
              if mt.startswith('PFN_'): pfns.append((mn,mt))
            for mn,mt in pfns:
              ps=sorted(providers.get(n,set()))
              rows.append({'struct':n,'member':mn,'type':mt,'extends':extends,
                           'providers':[p[1] for p in ps],
                           'apis':sorted({p[0] for p in ps if p[0]})})
          regular=[r for r in rows if 'vulkan' in r['apis']]
          sc_only=[r for r in rows if 'vulkan' not in r['apis'] and 'vulkansc' in r['apis']]
          payload={'all':rows,'regular_vulkan':regular,'vulkansc_only':sc_only}
          pathlib.Path('receipts/audit.json').write_text(json.dumps(payload,indent=2)+'\n')
          print('ALL')
          for r in rows: print(r)
          print('REGULAR_VULKAN')
          for r in regular: print(r)
          print('VULKANSC_ONLY')
          for r in sc_only: print(r)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-c-vulkan-pfn-struct-audit-v2-${{ github.run_id }}
          path: receipts
          retention-days: 30
