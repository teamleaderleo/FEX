name: Agent C hosted ARM64 Finding A probe v3

on:
  push:
    branches: [ci/agent-c-finding-a-arm64-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finding-a-v3:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      PROBE_SHA: 1b268a6742768086aa8355e997c10b4423319ba6
      DEBIAN_FRONTEND: noninteractive
      ROOTFS: ${{ github.workspace }}/rootfs
      R: ${{ github.workspace }}/receipts-v3
      H0: ${{ github.workspace }}/host0
      H1: ${{ github.workspace }}/host1
      FEX_PORTABLE: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.PROBE_SHA }}
          path: probes
          fetch-depth: 1

      - name: Identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H0" "$H1"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          {
            echo "fex_sha=$(git -C src rev-parse HEAD)"
            echo "probe_sha=$(git -C probes rev-parse HEAD)"
            echo "ci_sha=$GITHUB_SHA"
            uname -a
            uname -m
          } | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld libclang-dev llvm-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools
          dpkg-query -W > "$R/dpkg.txt"

      - name: Native Lavapipe control
        shell: bash
        run: |
          set -euxo pipefail
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          echo "$LVP" > "$R/lvp.txt"
          VK_DRIVER_FILES="$LVP" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"
          cc -O2 -Wall -Wextra probes/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c -ldl -o /tmp/native-probe
          VK_DRIVER_FILES="$LVP" /tmp/native-probe report gipa positive >"$R/native-callback.out" 2>"$R/native-callback.err"

      - name: Focused FEX build
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          test -x src/build/Bin/FEX
          test -x src/build/Bin/FEXServer
          test -x src/build/Bin/thunkgen
          test -f src/build/HostLibs_64/libvulkan-host.so
          cp src/build/HostLibs_64/libvulkan-host.so "$H0/libvulkan-host.so"
          file src/build/Bin/FEX src/build/Bin/FEXServer src/build/Bin/thunkgen "$H0/libvulkan-host.so" > "$R/host-files.txt"

      - name: Focused 64-bit guest Vulkan thunk build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1
          test -f guest/libvulkan-guest.so
          file guest/libvulkan-guest.so > "$R/guest-file.txt"
          readelf -d guest/libvulkan-guest.so > "$R/guest-dynamic.txt"

      - name: amd64 runtime rootfs and x86 probes
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 >"$R/rootfs-pull.log" 2>&1
          docker image inspect ubuntu:24.04 > "$R/rootfs-image.json"
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          test -x "$ROOTFS/lib64/ld-linux-x86-64.so.2"
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/static.c <<'EOF'
          #include <unistd.h>
          int main(void) {
            static const char s[] = "STATIC_SMOKE_MAIN\n";
            ssize_t n = write(2, s, sizeof(s) - 1);
            return n == (ssize_t)(sizeof(s) - 1) ? 0 : 1;
          }
          EOF
          cat >/tmp/phase.c <<'EOF'
          #include <dlfcn.h>
          #include <string.h>
          #include <unistd.h>
          static void marker(const char *s) { ssize_t n = write(2, s, strlen(s)); (void)n; }
          int main(int argc, char **argv) {
            marker("PHASE_MAIN\n");
            if (argc == 1 || strcmp(argv[1], "plain") == 0) { marker("PHASE_PLAIN_EXIT\n"); return 0; }
            marker("PHASE_BEFORE_DLOPEN\n");
            void *h = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_LOCAL);
            if (!h) { marker("PHASE_DLOPEN_ERROR "); marker(dlerror()); marker("\n"); return 2; }
            marker("PHASE_AFTER_DLOPEN\n");
            _exit(0);
          }
          EOF
          x86_64-linux-gnu-gcc -static -O2 -Wall -Wextra -Werror /tmp/static.c -o "$ROOTFS/opt/fex-ci/static"
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/phase.c -ldl -o "$ROOTFS/opt/fex-ci/phase"
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror \
            probes/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c \
            -ldl -o "$ROOTFS/opt/fex-ci/callback"
          file "$ROOTFS/opt/fex-ci/static" "$ROOTFS/opt/fex-ci/phase" "$ROOTFS/opt/fex-ci/callback" > "$R/x86-files.txt"

      - name: Baseline phase matrix
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP="$(cat "$R/lvp.txt")"
          run_case() {
            name="$1"; shift
            set +e
            VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H0" \
              "$FEX" "$@" >"$R/$name.out" 2>"$R/$name.err"
            rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
          }
          set -e
          run_case static /opt/fex-ci/static
          run_case plain /opt/fex-ci/phase plain
          run_case vulkan /opt/fex-ci/phase vulkan
          run_case direct /opt/fex-ci/callback report direct positive
          run_case gipa0 /opt/fex-ci/callback report gipa positive
          for x in static plain vulkan direct gipa0; do printf '%s=' "$x"; cat "$R/$x.exit"; done | tee "$R/baseline-matrix.txt"

      - name: Diagnostic route and candidate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ThunkLibs/libvulkan/Host.cpp')
          s=p.read_text()
          old='  } else if (a_1 == "vkFreeMemory"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkFreeMemory;\n'
          new=old+'  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;\n'
          if s.count(old) != 1: raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          git -C src diff -- ThunkLibs/libvulkan/Host.cpp > "$R/diagnostic.diff"
          cmake --build src/build --target vulkan-host-64 -- -j"$(nproc)" -v >"$R/rebuild-candidate.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$H1/libvulkan-host.so"

          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP="$(cat "$R/lvp.txt")"
          set +e
          VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H1" \
            "$FEX" /opt/fex-ci/callback report gipa positive >"$R/gipa1.out" 2>"$R/gipa1.err"
          rc=$?
          set -e
          echo "$rc" > "$R/gipa1.exit"

          static="$(cat "$R/static.exit")"; plain="$(cat "$R/plain.exit")"; vulkan="$(cat "$R/vulkan.exit")"; direct="$(cat "$R/direct.exit")"; base="$(cat "$R/gipa0.exit")"
          {
            echo "fex_sha=$FEX_SHA"
            echo "static=$static"
            echo "plain=$plain"
            echo "vulkan=$vulkan"
            echo "direct=$direct"
            echo "gipa_baseline=$base"
            echo "gipa_candidate=$rc"
            if [ "$static" != 0 ]; then echo "first_owner=fex-runtime-or-rootfs";
            elif [ "$plain" != 0 ]; then echo "first_owner=dynamic-rootfs";
            elif [ "$vulkan" != 0 ]; then echo "first_owner=vulkan-guest-load";
            elif [ "$direct" != 0 ]; then echo "first_owner=direct-vulkan-thunk-path";
            elif [ "$base" = 132 ] && [ "$rc" = 0 ]; then echo "first_owner=finding-a-dynamic-callback-routing"; echo "classification=Finding-A-reproduced-and-discriminated";
            elif [ "$base" != 0 ] && [ "$rc" = 0 ]; then echo "first_owner=finding-a-dynamic-callback-routing"; echo "classification=diagnostic-route-changes-product-behavior";
            elif [ "$base" = 0 ]; then echo "first_owner=none"; echo "classification=baseline-does-not-reproduce";
            else echo "first_owner=fex-vulkan-callback-runtime"; echo "classification=product-log-review"; fi
          } | tee "$R/classification.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-finding-a-arm64-v3-${{ github.run_id }}
          path: receipts-v3
          if-no-files-found: warn
          retention-days: 14
