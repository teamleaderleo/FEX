name: Real x86 vulkaninfo NODELETE teardown A-B

on:
  push:
    branches: [ci/nodelete-real-vulkaninfo-20260814]
    paths:
      - .github/workflows/nodelete-real-vulkaninfo-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulkaninfo-ab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-vulkaninfo
      H: ${{ github.workspace }}/host
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies and native Vulkan control
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools binutils
          LVP="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP"
          echo "$LVP" > "$R/lvp.txt"
          VK_DRIVER_FILES="$LVP" vulkaninfo --summary > "$R/native-vulkaninfo.out" 2> "$R/native-vulkaninfo.err"
          git rev-parse HEAD | tee "$R/candidate-sha.txt"

      - name: Apply independent debug-report routing diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ThunkLibs/libvulkan/Host.cpp')
          s=p.read_text()
          old='  } else if (a_1 == "vkFreeMemory"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkFreeMemory;\n'
          new=old+'  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {\n    return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;\n'
          if old not in s:
              raise SystemExit('debug-report route anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- ThunkLibs/libvulkan/Host.cpp | tee "$R/debug-report-route.diff"

      - name: Build FEX runtime and diagnostic Vulkan host thunk
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=ON \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer vulkan-host-64 -- -j"$(nproc)" \
            > "$R/build-host.log" 2>&1
          cp build/HostLibs_64/libvulkan-host.so "$H/libvulkan-host.so"

      - name: Build normal and NODELETE generated Vulkan guest wrappers
        shell: bash
        run: |
          set -euxo pipefail
          cp ThunkLibs/GuestLibs/CMakeLists.txt "$R/CMakeLists.nodelete"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ThunkLibs/GuestLibs/CMakeLists.txt')
          s=p.read_text()
          flag='  if (TARGET_TYPE STREQUAL "SHARED")\n    target_link_options(${NAME}-guest PRIVATE "LINKER:-z,nodelete")\n  endif()\n'
          if flag not in s:
              raise SystemExit('candidate NODELETE policy missing')
          p.write_text(s.replace(flag,'',1))
          PY
          cmake -S ThunkLibs/GuestLibs -B guest-normal -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-normal.log" 2>&1
          cmake --build guest-normal --target vulkan-guest -- -j"$(nproc)" > "$R/build-normal.log" 2>&1
          cp "$R/CMakeLists.nodelete" ThunkLibs/GuestLibs/CMakeLists.txt
          cmake -S ThunkLibs/GuestLibs -B guest-nodelete -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-nodelete.log" 2>&1
          cmake --build guest-nodelete --target vulkan-guest -- -j"$(nproc)" > "$R/build-nodelete.log" 2>&1
          readelf -d guest-normal/libvulkan-guest.so > "$R/normal.dynamic"
          readelf -d guest-nodelete/libvulkan-guest.so > "$R/nodelete.dynamic"
          if grep -q 'FLAGS_1.*NODELETE' "$R/normal.dynamic"; then exit 1; fi
          grep -q 'FLAGS_1.*NODELETE' "$R/nodelete.dynamic"
          sha256sum guest-normal/libvulkan-guest.so guest-nodelete/libvulkan-guest.so | tee "$R/guest-sha256.txt"

      - name: Build real amd64 vulkan-tools rootfs without executing amd64
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT

          APTROOT="$RUNNER_TEMP/apt-amd64"
          rm -rf "$APTROOT"
          mkdir -p \
            "$APTROOT/etc/apt/sources.list.d" \
            "$APTROOT/var/lib/apt/lists/partial" \
            "$APTROOT/var/cache/apt/archives/partial" \
            "$APTROOT/var/lib/dpkg" \
            "$APTROOT/var/log/apt"
          : > "$APTROOT/var/lib/dpkg/status"
          cat > "$APTROOT/etc/apt/sources.list.d/ubuntu.sources" <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          APT_OPTS=(
            -o "Dir=$APTROOT"
            -o APT::Architecture=amd64
            -o APT::Architectures=amd64
            -o Acquire::Languages=none
          )
          sudo apt-get "${APT_OPTS[@]}" update
          sudo apt-get "${APT_OPTS[@]}" --download-only -y --no-install-recommends \
            install vulkan-tools libx11-6
          mapfile -t DEBS < <(find "$APTROOT/var/cache/apt/archives" -maxdepth 1 -type f -name '*.deb' | sort)
          test "${#DEBS[@]}" -gt 0
          printf '%s\n' "${DEBS[@]##*/}" | tee "$R/amd64-package-set.txt"
          for deb in "${DEBS[@]}"; do
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done
          test -x "$ROOTFS/usr/bin/vulkaninfo"
          file "$ROOTFS/usr/bin/vulkaninfo" | tee "$R/x86-vulkaninfo.file"
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu"
          sudo chown -R "$(id -u):$(id -g)" "$ROOTFS"

      - name: Run normal and NODELETE x86 vulkaninfo teardown
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/build/Bin/FEX"
          LVP="$(cat "$R/lvp.txt")"
          LIB="$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          run_case() {
            name="$1"; wrapper="$2"
            rm -f "$LIB"
            cp "$wrapper" "$LIB"
            set +e
            VK_DRIVER_FILES="$LVP" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 60s \
              "$FEX" /usr/bin/vulkaninfo --summary > "$R/${name}.out" 2> "$R/${name}.err"
            rc=$?
            set -e
            echo "$rc" > "$R/${name}.exit"
            echo "===== $name rc=$rc ====="
            tail -n 120 "$R/${name}.out" || true
            tail -n 120 "$R/${name}.err" || true
          }
          set -e
          run_case normal guest-normal/libvulkan-guest.so
          run_case nodelete guest-nodelete/libvulkan-guest.so
          printf 'normal=%s\nnodelete=%s\n' "$(cat "$R/normal.exit")" "$(cat "$R/nodelete.exit")" | tee "$R/matrix.txt"
          test "$(cat "$R/nodelete.exit")" = 0
          grep -Eq 'Vulkan Instance Version|Devices:' "$R/nodelete.out"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodelete-real-vulkaninfo-${{ github.run_id }}
          path: receipts-vulkaninfo
          retention-days: 30