name: Materialize CUDA resident source v1

on:
  push:
    branches: [diagnostic/cuda-resident-runtime-v1]
    paths:
      - .github/workflows/materialize-cuda-resident-source-v1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Materialize validated CUDA resident source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('ThunkLibs/GuestLibs/CMakeLists.txt')
          s = cmake.read_text()
          old = '''generate(libcuda ${CMAKE_CURRENT_SOURCE_DIR}/../libcuda/libcuda_interface.cpp)\nadd_guest_lib(cuda "libcuda.so.1")'''
          new = '''generate(libcuda ${CMAKE_CURRENT_SOURCE_DIR}/../libcuda/libcuda_interface.cpp RESIDENT_BRIDGE)\n\nadd_library(libcuda_bridge-guest-deps INTERFACE)\ntarget_link_libraries(libcuda_bridge-guest-deps INTERFACE libcuda-guest-deps)\nset(GEN_libcuda_bridge "${GEN_libcuda_BRIDGE}")\nadd_guest_lib(cuda_bridge "libfex-cuda-bridge.so")\nset_target_properties(cuda_bridge-guest PROPERTIES OUTPUT_NAME "fex-cuda-bridge")\ntarget_link_options(cuda_bridge-guest PRIVATE "LINKER:-z,nodelete")\n\nadd_guest_lib(cuda "libcuda.so.1")\ntarget_link_libraries(cuda-guest PRIVATE cuda_bridge-guest)'''
          if s.count(old) != 1:
              raise SystemExit('CUDA CMake anchor missing')
          cmake.write_text(s.replace(old, new, 1))

          guest = Path('ThunkLibs/libcuda/libcuda_Guest.cpp')
          s = guest.read_text()
          old = '''#include "common/Guest.h"\n#include "cuda_defines.h"\n\n#include "thunkgen_guest_libcuda.inl"'''
          new = '''#include "common/Guest.h"\n#include "cuda_defines.h"\n#include "thunkgen_guest_libcuda_bridge_accessors.inl"\n\n#define AllocateHostTrampolineForGuestFunction FEXAllocateResidentHostTrampolineForGuestFunction\n#include "thunkgen_guest_libcuda.inl"\n#undef AllocateHostTrampolineForGuestFunction'''
          if s.count(old) != 1:
              raise SystemExit('CUDA include anchor missing')
          s = s.replace(old, new, 1)
          old = 'GetCallerForHostFunction(name)'
          new = 'FEXGetResidentCallerForHostFunction(name)'
          if s.count(old) != 1:
              raise SystemExit('CUDA invoker anchor missing')
          guest.write_text(s.replace(old, new, 1))
          PY

          mkdir -p ThunkLibs/libcuda_bridge
          cat > ThunkLibs/libcuda_bridge/Guest.cpp <<'EOF'
          // SPDX-License-Identifier: MIT
          #include "common/Guest.h"
          #include "../libcuda/cuda_defines.h"
          #include "thunkgen_guest_libcuda_bridge.inl"
          EOF

          git diff --check
          git status --short
          git diff -- ThunkLibs/GuestLibs/CMakeLists.txt ThunkLibs/libcuda/libcuda_Guest.cpp ThunkLibs/libcuda_bridge/Guest.cpp

      - name: Commit source only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ThunkLibs/GuestLibs/CMakeLists.txt ThunkLibs/libcuda/libcuda_Guest.cpp ThunkLibs/libcuda_bridge/Guest.cpp
          git commit -m 'ThunkLibs: make CUDA retained thunks resident'
          git push origin HEAD:diagnostic/cuda-resident-runtime-v1
