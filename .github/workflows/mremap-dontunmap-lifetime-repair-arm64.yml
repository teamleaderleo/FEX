name: MREMAP_DONTUNMAP lifetime repair ARM64

on:
  push:
    branches: [ci/mremap-dontunmap-lifetime-repair-20260814]
    paths:
      - diagnostics/mremap-dontunmap-owner/**
      - .github/fieldwork/**
      - .github/workflows/mremap-dontunmap-lifetime-repair-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mremap-dontunmap-lifetime-repair-20260814
  cancel-in-progress: true

jobs:
  dontunmap-repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      FEX_SHA: 71afe476751deac24adabd1adb575fd2337b6e0a
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts-dontunmap-repair
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ci/thunk-lifetime-race-20260814
          path: retirement-helper
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config libcap-dev \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          printf 'carrier=%s\nfex=%s\nhelper=%s\nkernel=%s\n' \
            "$GITHUB_SHA" "$(git -C src rev-parse HEAD)" "$(git -C retirement-helper rev-parse HEAD)" "$(uname -a)" \
            > "$R/identity.txt"

      - name: Apply owner-aware candidate and DONTUNMAP repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 retirement-helper/.github/fieldwork/apply_multithread_owner_retire_diag.py src all
          python3 .github/fieldwork/promote_multiowner_claims.py src
          python3 .github/fieldwork/merge_callback_tombstone.py src
          python3 .github/fieldwork/fix_retirement_lock_order.py src
          python3 .github/fieldwork/add_revoked_h_state.py src
          python3 .github/fieldwork/pre_map_fixed_retire.py src
          python3 .github/fieldwork/add_map_fixed_rollback_transaction.py src
          python3 .github/fieldwork/add_vma_owner_id.py src
          python3 .github/fieldwork/add_owner_claim_identity.py src
          python3 .github/fieldwork/add_mremap_fixed_lifetime_transaction.py src
          python3 .github/fieldwork/extend_mremap_dontunmap_lifetime_transaction.py src
          git -C src diff --check
          git -C src diff > "$R/repair.diff"

      - name: Build FEX and probe
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang CXX=clang++ cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" > "$R/build.log" 2>&1
          x86_64-linux-gnu-g++ -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Werror \
            -I"$GITHUB_WORKSPACE/src/ThunkLibs/include" \
            diagnostics/mremap-dontunmap-owner/mremap_dontunmap_owner.cpp \
            -o "$R/mremap-dontunmap-owner"

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci" "$ROOTFS/usr/lib/x86_64-linux-gnu"
          cp "$R/mremap-dontunmap-owner" "$ROOTFS/opt/fex-ci/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/"
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/"

      - name: Execute repaired inspect, revoked, and explicit-reregister cases
        shell: bash
        run: |
          set -uxo pipefail
          run_case() {
            name="$1"; shift
            set +e
            FEX_ROOTFS="$ROOTFS" timeout 20s \
              "$GITHUB_WORKSPACE/src/build/Bin/FEX" /opt/fex-ci/mremap-dontunmap-owner "$@" \
              > "$R/$name.stdout" 2> "$R/$name.stderr"
            rc=$?
            set -e
            echo "$rc" > "$R/$name.exit"
            echo "===== $name rc=$rc ====="
            grep -E 'DONTUNMAP|DIAG_MREMAP_|DIAG_ROLLBACK|DIAG_OWNER_CLAIM|DIAG_MULTI|DIAG_REVOKED_H' \
              "$R/$name.stderr" | tee "$R/$name.key" || true
          }
          set -e
          run_case inspect --inspect-only
          run_case no-reregister
          run_case reregister --reregister
          printf 'inspect=%s\nno-reregister=%s\nreregister=%s\n' \
            "$(cat "$R/inspect.exit")" "$(cat "$R/no-reregister.exit")" "$(cat "$R/reregister.exit")" \
            | tee "$R/matrix.txt"

      - name: Assert DONTUNMAP causal repair
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat "$R/inspect.exit")" = 0
          test "$(cat "$R/no-reregister.exit")" = 139
          test "$(cat "$R/reregister.exit")" = 0

          grep -q 'DONTUNMAP old-bytes=000000000000' "$R/inspect.stderr"
          grep -q 'DONTUNMAP new-bytes=b86f000000c3' "$R/inspect.stderr"
          grep -q 'DIAG_MREMAP_PREPARE_SOURCE .*dontunmap=1 fixed=0' "$R/inspect.stderr"
          grep -q 'DIAG_MULTI_DROP H=0x700000040000 .* owner=0xe' "$R/inspect.stderr"
          grep -q 'DIAG_REVOKED_H_INSTALL H=0x700000040000' "$R/inspect.stderr"
          if grep -q 'DIAG_MREMAP_PREPARE_DEST' "$R/inspect.stderr"; then
            echo 'DONTUNMAP unexpectedly treated its new free VA as an overwritten fixed destination' >&2
            exit 1
          fi

          grep -q 'DIAG_REVOKED_H_INSTALL H=0x700000040000' "$R/no-reregister.stderr"
          if grep -q 'DONTUNMAP final H-value=111 reregister=0' "$R/no-reregister.stderr"; then
            echo 'old source H survived DONTUNMAP content move' >&2
            exit 1
          fi

          grep -q 'DONTUNMAP reregister H=0x700000040000' "$R/reregister.stderr"
          grep -q 'DIAG_OWNER_CLAIM_ACTIVE H=0x700000040000 .* owner=0xe new=1' "$R/reregister.stderr"
          grep -q 'DONTUNMAP final H-value=111 reregister=1 old-zero=1 moved-value=111' "$R/reregister.stderr"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mremap-dontunmap-lifetime-repair-${{ github.run_id }}
          path: receipts-dontunmap-repair
          retention-days: 30
