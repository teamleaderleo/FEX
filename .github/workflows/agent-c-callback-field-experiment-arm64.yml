name: Agent C callback field restoration experiment ARM64

on:
  workflow_dispatch:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths: [.github/workflows/agent-c-callback-field-experiment-arm64.yml]

permissions:
  contents: read

env:
  FEX_SHA: ca9efc95c0657a4161e89f5b8388caed49d49705
  FIELDWORK_SHA: 3e147eac0a82be073d662a2868f7d69f9883b0e4
  DEBIAN_FRONTEND: noninteractive
  ROOTFS: ${{ github.workspace }}/rootfs-amd64
  HOST: ${{ github.workspace }}/host
  R: ${{ github.workspace }}/receipts
  FEX_PORTABLE: 1

jobs:
  experiment:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.FEX_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Exact identity and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          test "$(git -C src rev-parse HEAD)" = "$FEX_SHA"
          test "$(git -C fieldwork rev-parse HEAD)" = "$FIELDWORK_SHA"
          printf 'fex_sha=%s\nfieldwork_sha=%s\n' \
            "$(git -C src rev-parse HEAD)" "$(git -C fieldwork rev-parse HEAD)" | tee "$R/identity.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxrandr-dev libxrender-dev mesa-vulkan-drivers vulkan-tools \
            vulkan-validationlayers debootstrap
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$LVP_ICD"
          echo "$LVP_ICD" | tee "$R/lvp-icd.txt"
          VK_DRIVER_FILES="$LVP_ICD" vulkaninfo --summary >"$R/native-vulkaninfo.out" 2>"$R/native-vulkaninfo.err"

      - name: Build probes and native callback controls
        shell: bash
        run: |
          set -euxo pipefail
          CB=fieldwork/investigations/fex-vulkan-thunk-lifecycle/fex_vulkan_callback_probe.c
          FULL=fieldwork/investigations/fex-vulkan-thunk-lifecycle/instance_pnext_callback_full_integrity_probe.c
          INC=-Isrc/External/Vulkan-Headers/include
          cc -O2 -g -Wall -Wextra -Werror "$CB" -ldl -o /tmp/callback-arm64
          x86_64-linux-gnu-gcc -O2 -g -Wall -Wextra -Werror "$CB" -ldl -o /tmp/callback-x86_64
          x86_64-linux-gnu-gcc -O2 -g -std=gnu11 -Wall -Wextra -Werror $INC "$FULL" -ldl -o /tmp/full-integrity-x86_64
          file /tmp/callback-arm64 /tmp/callback-x86_64 /tmp/full-integrity-x86_64 | tee "$R/probes.file.txt"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-arm64 report gipa positive >"$R/native-report.out" 2>"$R/native-report.err"
          VK_DRIVER_FILES="$LVP_ICD" /tmp/callback-arm64 utils gipa positive >"$R/native-utils.out" 2>"$R/native-utils.err"
          grep -q '^PROBE_FINISH callback_count=[1-9][0-9]* status=0' "$R/native-report.err"
          grep -q '^PROBE_FINISH callback_count=[1-9][0-9]* status=0' "$R/native-utils.err"

      - name: Build focused experiment Vulkan thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ >"$R/cmake-host.log" 2>&1
          cmake --build src/build --target FEXServer vulkan-host-64 -- -j"$(nproc)" -v >"$R/build-host.log" 2>&1
          cp src/build/HostLibs_64/libvulkan-host.so "$HOST/libvulkan-host.so"
          cmake -S src/ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/src/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE/src" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/src/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/ >"$R/cmake-guest.log" 2>&1
          cmake --build guest --target vulkan-guest -- -j"$(nproc)" -v >"$R/build-guest.log" 2>&1

      - name: Build amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap --arch=amd64 --foreign --variant=minbase --components=main,universe \
            --include=libvulkan1,libx11-6 noble "$ROOTFS" http://archive.ubuntu.com/ubuntu >"$R/debootstrap.log" 2>&1
          sudo find "$ROOTFS" -type f -name '*.deb' -print | sort > "$R/rootfs-debs.txt"
          sed -n 's/^I: Extracting \([^ ]*\)\.\.\.$/\1/p' "$R/debootstrap.log" | sort -u > "$R/rootfs-already-extracted.txt"
          while IFS= read -r deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            grep -Fxq "$pkg" "$R/rootfs-already-extracted.txt" && continue
            sudo dpkg-deb -x "$deb" "$ROOTFS"
          done < "$R/rootfs-debs.txt"
          sudo cp guest/libvulkan-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so.1"
          sudo ln -sf libvulkan.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/libvulkan.so"
          sudo mkdir -p "$ROOTFS/usr/local/bin"
          sudo install -m755 /tmp/callback-x86_64 "$ROOTFS/usr/local/bin/callback-probe"
          sudo install -m755 /tmp/full-integrity-x86_64 "$ROOTFS/usr/local/bin/full-integrity-probe"
          X11="$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"
          for sym in XSync XGetVisualInfo XDisplayString; do
            x86_64-linux-gnu-readelf -Ws "$X11" | grep -E " ${sym}(@|$)" | head -1
          done

      - name: Run callback routing matrix
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          run_case() {
            local name="$1" kind="$2" lookup="$3"
            timeout 90s env VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
              "$FEX" /usr/local/bin/callback-probe "$kind" "$lookup" 0 \
              >"$R/callback-${name}.out" 2>"$R/callback-${name}.err"
            grep -q '^PROBE_FINISH callback_count=0 status=0' "$R/callback-${name}.err"
          }
          run_case report-direct report direct
          run_case report-gipa report gipa
          run_case utils-direct utils direct
          run_case utils-gipa utils gipa
          printf 'report-direct=0\nreport-gipa=0\nutils-direct=0\nutils-gipa=0\n' | tee "$R/callback-summary.txt"

      - name: Run full guest-input integrity probe
        shell: bash
        run: |
          set -euxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          LVP_ICD="$(cat "$R/lvp-icd.txt")"
          timeout 90s env VK_DRIVER_FILES="$LVP_ICD" FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" \
            "$FEX" /usr/local/bin/full-integrity-probe >"$R/full.out" 2>"$R/full.err"
          cat "$R/full.err"
          grep -q '^FULL_AFTER_CREATE .*pnext_same=1 callbacks_same=1 users_same=1 callbacks=0/0' "$R/full.err"
          grep -q '^FULL_AFTER_DESTROY pnext_same=1 callbacks_same=1 users_same=1 callbacks=0/0' "$R/full.err"
          grep -q '^FULL_RETURN unchanged=1 callbacks=0' "$R/full.err"
          ! grep -q '^UNEXPECTED_' "$R/full.err"
          printf 'full_integrity_exit=0\npnext_same=1\ncallbacks_same=1\nusers_same=1\nguest_callbacks=0\n' | tee "$R/full-summary.txt"

      - name: Final summary
        shell: bash
        run: |
          set -euxo pipefail
          cat "$R/callback-summary.txt" "$R/full-summary.txt"
          cat >"$R/final-summary.txt" <<EOF
          candidate=$FEX_SHA
          callback_matrix=pass
          full_after_call_integrity=pass
          pnext_same=1
          callbacks_same=1
          users_same=1
          guest_callbacks=0
          EOF
          cat "$R/final-summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-c-callback-field-experiment-${{ github.run_id }}
          path: receipts
          retention-days: 30
