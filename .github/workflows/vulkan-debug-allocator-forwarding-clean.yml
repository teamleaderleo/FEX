name: Vulkan debug allocator forwarding clean matrix

on:
  workflow_dispatch:
  push:
    branches: [ci/vulkan-debug-allocator-forwarding-clean-20260814]
    paths:
      - .github/workflows/vulkan-debug-allocator-forwarding-clean.yml
      - LinuxFieldwork/vk_allocator_debug_extensions.c

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      PRODUCT_SHA: 1698747b977cfc426896a30fef471e2cfccd044e
      PRODUCT_PARENT: 715ff36bff2fd9f2353ab31613dc41ae106f3938
      FEX_PORTABLE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: carrier
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          fetch-depth: 2
          submodules: recursive

      - name: Install dependencies and prove product identity
        run: |
          set -euxo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD^)" = "$PRODUCT_PARENT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build nasm clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libgl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Forward only the three remaining debug allocators
        working-directory: product
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          repls = {
              'return LDR_PTR(vkCreateDebugReportCallbackEXT)(a_0, &overridden_callback, nullptr, a_3);':
                  'return LDR_PTR(vkCreateDebugReportCallbackEXT)(a_0, &overridden_callback, a_2, a_3);',
              'LDR_PTR(vkDestroyDebugReportCallbackEXT)(a_0, a_1, nullptr);':
                  'LDR_PTR(vkDestroyDebugReportCallbackEXT)(a_0, a_1, a_2);',
              'return LDR_PTR(vkCreateDebugUtilsMessengerEXT)(a_0, &overridden_callback, nullptr, a_3);':
                  'return LDR_PTR(vkCreateDebugUtilsMessengerEXT)(a_0, &overridden_callback, a_2, a_3);',
          }
          for old, new in repls.items():
              count = s.count(old)
              assert count == 1, (old, count)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff --name-only | tee ../debug-product-files.txt
          test "$(cat ../debug-product-files.txt)" = "ThunkLibs/libvulkan/Host.cpp"
          grep -n -E 'vkCreateDebugReportCallbackEXT\)\(a_0, &overridden_callback, a_2, a_3\)|vkDestroyDebugReportCallbackEXT\)\(a_0, a_1, a_2\)|vkCreateDebugUtilsMessengerEXT\)\(a_0, &overridden_callback, a_2, a_3\)' ThunkLibs/libvulkan/Host.cpp | tee ../debug-forwarded-sites.txt
          test "$(wc -l < ../debug-forwarded-sites.txt)" -eq 3

      - name: Re-run const repack regression
        working-directory: product
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=ON \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/
          cmake --build build --target thunkgentest -- -j"$(nproc)"
          build/Bin/thunkgentest "StructRepacking" | tee ../thunkgentest.txt

      - name: Build plain FEX Vulkan thunk path
        working-directory: product
        run: |
          set -euxo pipefail
          cmake --build build --target FEX FEXServer vulkan-host-64 -- -j"$(nproc)"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$PWD" -DGENERATOR_EXE="$PWD/build/Bin/thunkgen" \
            -DX86_DEV_ROOTFS=/
          cmake --build guest-build --target vulkan-guest -- -j"$(nproc)"

      - name: Prepare native and FEX debug allocator probes
        run: |
          set -euxo pipefail
          mkdir -p receipts host-thunks
          cc -O0 -g -Wall -Wextra -Werror carrier/LinuxFieldwork/vk_allocator_debug_extensions.c -ldl -o receipts/native-probe
          docker pull --platform=linux/amd64 ubuntu:24.04
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir rootfs-amd64
          docker export "$cid" | tar -C rootfs-amd64 -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p rootfs-amd64/usr/lib/x86_64-linux-gnu rootfs-amd64/opt/fex-ci
          cp product/guest-build/libvulkan-guest.so rootfs-amd64/usr/lib/x86_64-linux-gnu/libvulkan.so.1
          cp product/build/HostLibs_64/libvulkan-host.so host-thunks/libvulkan-host.so
          x86_64-linux-gnu-gcc -O0 -g -Wall -Wextra -Werror carrier/LinuxFieldwork/vk_allocator_debug_extensions.c -ldl -o rootfs-amd64/opt/fex-ci/debug-allocator-probe
          cat >/tmp/x11stub.c <<'EOF'
          int XSync(void *d, int discard){(void)d;(void)discard;return 0;}
          void *XGetVisualInfo(void *d, long mask, void *t, int *n){(void)d;(void)mask;(void)t;if(n)*n=0;return 0;}
          char *XDisplayString(void *d){(void)d;static char s[] = ":0";return s;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o rootfs-amd64/usr/lib/x86_64-linux-gnu/libX11.so.6

      - name: Execute clean debug allocator matrix
        run: |
          set -uxo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          set +e
          VK_DRIVER_FILES="$ICD" timeout 30s receipts/native-probe >receipts/native.stdout 2>receipts/native.stderr
          native_rc=$?
          VK_DRIVER_FILES="$ICD" FEX_ROOTFS="$PWD/rootfs-amd64" FEX_THUNKHOSTLIBS="$PWD/host-thunks" \
            timeout 30s product/build/Bin/FEX /opt/fex-ci/debug-allocator-probe \
            >receipts/fex.stdout 2>receipts/fex.stderr
          fex_rc=$?
          set -e
          printf 'product=%s\nnative=%s\nfex=%s\n' "$PRODUCT_SHA" "$native_rc" "$fex_rc" | tee receipts/final-matrix.txt
          printf '%s\n' '--- native ---'; cat receipts/native.stderr
          printf '%s\n' '--- fex ---'; cat receipts/fex.stderr
          test "$native_rc" -eq 0
          test "$fex_rc" -eq 0
          grep -q 'PASS debug allocator extension matrix' receipts/native.stderr
          grep -q 'PASS debug allocator extension matrix' receipts/fex.stderr
          grep -E '^(EXTENSIONS|DEBUG_UTILS_CREATE|DEBUG_UTILS_DESTROY|DEBUG_REPORT_CREATE|DEBUG_REPORT_DESTROY|INSTANCE_DESTROY)' receipts/native.stderr > receipts/native-canonical.txt
          grep -E '^(EXTENSIONS|DEBUG_UTILS_CREATE|DEBUG_UTILS_DESTROY|DEBUG_REPORT_CREATE|DEBUG_REPORT_DESTROY|INSTANCE_DESTROY)' receipts/fex.stderr > receipts/fex-canonical.txt
          diff -u receipts/native-canonical.txt receipts/fex-canonical.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('receipts/native-canonical.txt').read_text()
          vals = [int(x) for x in re.findall(r'(?:alloc_delta|realloc_delta|free_delta)=(\d+)', text)]
          assert vals and sum(vals) > 0, (vals, text)
          PY
          printf '%s\n' 'OUTCOME=debug_allocator_forwarding_matched_native_with_callbacks_observed' >> receipts/final-matrix.txt

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-debug-allocator-clean-${{ github.run_id }}
          path: |
            receipts
            debug-product-files.txt
            debug-forwarded-sites.txt
            thunkgentest.txt
          retention-days: 30
