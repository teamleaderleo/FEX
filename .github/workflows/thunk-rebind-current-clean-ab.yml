name: Thunk rebind current clean A/B ARM64

on:
  push:
    branches: [diagnostic/thunk-rebind-current-clean-20260814]
    paths:
      - .github/workflows/thunk-rebind-current-clean-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebind-ab:
    strategy:
      fail-fast: false
      matrix:
        variant: [registry-only, exact-all-cache]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      SOURCE_SHA: 1e8b042e7d50335cdbf2b1b6bfd0c888296dd73a
      FIELDWORK_SHA: 9eca19ac8743567ce2af7b4c82f2483d97c19b09
      ROOTFS: ${{ github.workspace }}/rootfs-amd64-${{ matrix.variant }}
      R: ${{ github.workspace }}/receipts-${{ matrix.variant }}
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout exact clean product source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/FEX
          ref: ${{ env.SOURCE_SHA }}
          path: src
          submodules: recursive
          fetch-depth: 1

      - name: Checkout retained synthetic fixture
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          fetch-depth: 1

      - name: Verify provenance and unpack fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          test "$(git -C src rev-parse HEAD)" = "$SOURCE_SHA"
          git -C src status --porcelain | tee "$R/pre-patch-status.txt"
          test ! -s "$R/pre-patch-status.txt"
          git -C src rev-parse HEAD | tee "$R/source-sha.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config libcap-dev \
            gcc g++ gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          base64 -d fieldwork/investigations/fex-vulkan-thunk-lifecycle/synthetic-reproducer/fex-thunk-lifetime-repro-source.tar.gz.b64 > /tmp/repro.tar.gz
          echo '0582bf8832699cfb2614c1781473d07054ba01f03e3342735a45ea04735c2a01  /tmp/repro.tar.gz' | sha256sum -c -
          mkdir -p /tmp/repro
          tar xf /tmp/repro.tar.gz -C /tmp/repro

      - name: Apply diagnostic variant
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = registry-only ]; then
            python3 .github/fieldwork/apply_registry_only_thunk_rebind_diag.py src
          else
            python3 .github/fieldwork/apply_exact_thunk_rebind_diag.py src
          fi
          git -C src diff --check
          git -C src diff > "$R/${{ matrix.variant }}.diff"
          git -C src diff --name-only | tee "$R/patched-files.txt"
          test -s "$R/patched-files.txt"

      - name: Build diagnostic FEX and retained thunk pair
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S src -B src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ \
            > "$R/cmake.log" 2>&1
          cmake --build src/build --target FEX FEXServer -- -j"$(nproc)" -v > "$R/build-fex.log" 2>&1 \
            || { tail -n 520 "$R/build-fex.log"; exit 1; }
          cd /tmp/repro/fex-full-thunk-pair
          make clean
          make HOST_CXX=g++ GUEST_CXX=x86_64-linux-gnu-g++ > "$R/build-full-pair.log" 2>&1

      - name: Prepare amd64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/opt/fex-ci/full"
          cp -a /tmp/repro/fex-full-thunk-pair/guest "$ROOTFS/opt/fex-ci/full/"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

      - name: Execute forced-different reload and classify
        shell: bash
        run: |
          set -uxo pipefail
          FEX="$GITHUB_WORKSPACE/src/build/Bin/FEX"
          HOST="/tmp/repro/fex-full-thunk-pair/host"
          set +e
          (cd "$ROOTFS/opt/fex-ci/full" && \
            FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$FEX" /opt/fex-ci/full/guest/fex_full_lifetime --force-different) \
            > "$R/rebind.stdout" 2> "$R/rebind.stderr"
          rc=$?
          set -e
          echo "$rc" | tee "$R/rebind.exit"
          grep -E 'DIAG_|generation|reload|re-register|retained|fresh|callback|native host stable' \
            "$R/rebind.stdout" "$R/rebind.stderr" > "$R/key-lines.txt" || true
          cat "$R/key-lines.txt"
          test "$rc" -eq 0
          grep -q 'reload invoker.*DIFFERENT' "$R/rebind.stdout"
          grep -q 'native host stable' "$R/rebind.stdout"
          grep -q 'fresh/current callback.*rv=10010053 want=10010053' "$R/rebind.stdout"
          grep -q 'child current callback after new  rv=10010093' "$R/rebind.stdout"
          grep -q 'child current callback after new  exit=0' "$R/rebind.stdout"
          if [ "${{ matrix.variant }}" = registry-only ]; then
            grep -q 'DIAG_REGISTRY_ONLY_DUP' "$R/rebind.stderr"
            grep -q 'child Link after re-register      signal=11' "$R/rebind.stdout"
            echo CURRENT_CLEAN_REGISTRY_ONLY_NEGATIVE_OK | tee "$R/gate.txt"
          else
            grep -q 'DIAG_DUP' "$R/rebind.stderr"
            grep -q 'DIAG_EXACT_SHARED' "$R/rebind.stderr"
            grep -q 'DIAG_EXACT_LOCAL' "$R/rebind.stderr"
            grep -q 'child Link after re-register      rv=1001035' "$R/rebind.stdout"
            grep -q 'child Link after re-register      exit=0' "$R/rebind.stdout"
            echo CURRENT_CLEAN_EXACT_REBIND_OK | tee "$R/gate.txt"
          fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunk-rebind-current-clean-${{ matrix.variant }}-${{ github.run_id }}
          path: receipts-${{ matrix.variant }}
          retention-days: 30
