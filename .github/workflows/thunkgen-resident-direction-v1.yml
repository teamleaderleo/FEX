name: Direction-aware thunkgen resident output v1

on:
  push:
    branches: [diagnostic/thunkgen-resident-output-v1]
    paths:
      - .github/workflows/thunkgen-resident-direction-v1.yml
      - ThunkLibs/Generator/apply_resident_direction_candidate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direction-aware:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      R: ${{ github.workspace }}/receipts-thunkgen-resident-direction-v1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev
          git rev-parse HEAD | tee "$R/carrier-sha.txt"

      - name: Apply first-class and direction-aware candidates
        shell: bash
        run: |
          set -euxo pipefail
          python3 ThunkLibs/Generator/apply_resident_output_candidate.py
          python3 ThunkLibs/Generator/apply_resident_output_candidate_fixups.py
          python3 ThunkLibs/Generator/apply_resident_direction_candidate.py
          git diff --check
          git diff -- ThunkLibs/Generator/analysis.h ThunkLibs/Generator/analysis.cpp ThunkLibs/Generator/gen.cpp \
            ThunkLibs/Generator/interface.h ThunkLibs/Generator/main.cpp ThunkLibs/GuestLibs/CMakeLists.txt \
            | tee "$R/direction-aware-resident-output.diff"
          grep -q 'host_to_guest_callback_funcptrs' ThunkLibs/Generator/analysis.cpp
          grep -q 'used_as_callback' ThunkLibs/Generator/gen.cpp
          ! grep -q 'sizeof...(Args) <= 19' ThunkLibs/Generator/gen.cpp
          ! grep -q 'FEXResidentBridgeCanUnpack' ThunkLibs/Generator/gen.cpp
          rm ThunkLibs/Generator/extract_guest_bridge.py

      - name: Build FEX generator and GL host thunk
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer GL-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 420 "$R/build-host.log"; exit 1; }
          test -x build/Bin/thunkgen

      - name: Build direction-aware GL resident output
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ThunkLibs/GuestLibs -B guest -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest --target GL-guest GL_bridge-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 520 "$R/build-guest.log"; exit 1; }

          test -f guest/libGL-guest.so
          test -f guest/libfex-GL-bridge.so
          test -f guest/gen/thunkgen_guest_libGL_bridge.inl
          test -f guest/gen/thunkgen_guest_libGL_bridge_accessors.inl

          grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL.inl | tee "$R/guest-callback-count.txt"
          grep -Ec '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL_bridge.inl | tee "$R/bridge-callback-count.txt"
          diff -u <(grep -E '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL.inl | sed -E 's/^[[:space:]]+//') \
                  <(grep -E '^[[:space:]]*MAKE_CALLBACK_THUNK' guest/gen/thunkgen_guest_libGL_bridge.inl | sed -E 's/^[[:space:]]+//') \
                  > "$R/callback-set.diff"

          grep -Ec '^extern "C" uintptr_t fex_bridge_libGL_unpacker_' guest/gen/thunkgen_guest_libGL_bridge.inl \
            | tee "$R/resident-unpacker-count.txt"
          grep -Ec '^template<> struct FEXResidentBridgeUnpacker<' guest/gen/thunkgen_guest_libGL_bridge_accessors.inl \
            | tee "$R/accessor-unpacker-count.txt"
          ! grep -q 'FEXResidentBridgeCanUnpack' guest/gen/thunkgen_guest_libGL_bridge.inl
          ! grep -q 'FEXResidentBridgeCanUnpack' guest/gen/thunkgen_guest_libGL_bridge_accessors.inl
          ! grep -q 'sizeof...(Args) <= 19' guest/gen/thunkgen_guest_libGL_bridge.inl
          ! grep -q 'sizeof...(Args) <= 19' guest/gen/thunkgen_guest_libGL_bridge_accessors.inl

          readelf -d guest/libGL-guest.so | tee "$R/wrapper.dynamic"
          readelf -d guest/libfex-GL-bridge.so | tee "$R/bridge.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/wrapper.dynamic"
          grep -q 'NEEDED.*libfex-GL-bridge.so' "$R/wrapper.dynamic"
          grep -q 'FLAGS_1.*NODELETE' "$R/bridge.dynamic"
          stat -c 'bridge_file_bytes=%s' guest/libfex-GL-bridge.so | tee "$R/bridge-size.txt"
          sha256sum guest/gen/thunkgen_guest_libGL_bridge.inl guest/gen/thunkgen_guest_libGL_bridge_accessors.inl \
            guest/libfex-GL-bridge.so | tee "$R/product-sha256.txt"
          echo DIRECTION_AWARE_RESIDENT_BUILD_OK | tee "$R/result.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunkgen-resident-direction-v1-${{ github.run_id }}
          path: receipts-thunkgen-resident-direction-v1
          retention-days: 30
