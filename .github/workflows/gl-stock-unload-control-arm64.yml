name: Stock GL physical unload control

on:
  push:
    branches: [diagnostic/gl-split-resident-e2e-20260814]
    paths:
      - .github/workflows/gl-stock-unload-control-arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gl-stock-unload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ROOTFS: ${{ github.workspace }}/rootfs-gl-stock
      R: ${{ github.workspace }}/receipts-gl-stock
      H: ${{ github.workspace }}/host-gl-stock
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$H"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu binutils \
            libcap-dev libgl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxrender-dev
          git rev-parse HEAD | tee "$R/carrier-sha.txt"

      - name: Build stock FEX and generated GL thunks
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer GL-host-64 -- -j"$(nproc)" -v \
            > "$R/build-host.log" 2>&1 || { tail -n 320 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libGL-host.so "$H/libGL-host.so"

          cmake -S ThunkLibs/GuestLibs -B guest-stock -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ \
            > "$R/cmake-guest.log" 2>&1
          cmake --build guest-stock --target GL-guest -- -j"$(nproc)" -v \
            > "$R/build-guest.log" 2>&1 || { tail -n 320 "$R/build-guest.log"; exit 1; }
          test -f guest-stock/libGL-guest.so
          readelf -d guest-stock/libGL-guest.so | tee "$R/guest.dynamic"
          ! grep -q 'FLAGS_1.*NODELETE' "$R/guest.dynamic"

      - name: Build amd64 stock-unload probe
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs-pull.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"; trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-stock/libGL-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libGL.so.1"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true

          cat >/tmp/x11stub.c <<'EOF'
          typedef int (*XErrorHandler)(void *, void *);
          int XSync(void*d,int discard){(void)d;(void)discard;return 0;}
          void *XGetVisualInfo(void*d,long m,void*t,int*c){(void)d;(void)m;(void)t;if(c)*c=0;return 0;}
          const char *XDisplayString(void*d){(void)d;return ":0";}
          XErrorHandler XSetErrorHandler(XErrorHandler h){return h;}
          EOF
          x86_64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,libX11.so.6 /tmp/x11stub.c -o "$ROOTFS/usr/lib/x86_64-linux-gnu/libX11.so.6"

          cat >/tmp/glstock.c <<'EOF'
          #include <dlfcn.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          typedef void (*VoidFunc)(void);
          typedef VoidFunc (*GLXGET)(const unsigned char *);
          typedef unsigned int (*GLGETERROR)(void);
          static int map_path(void *p, const char *needle) {
            FILE *f=fopen("/proc/self/maps","r"); char l[1024]; uintptr_t x=(uintptr_t)p;
            if(!f) return -1;
            while(fgets(l,sizeof l,f)) { unsigned long a,b; if(sscanf(l,"%lx-%lx",&a,&b)==2 && x>=a && x<b) { int ok=strstr(l,needle)!=0; fprintf(stderr,"MAP_LOOKUP %p %s",p,l); fclose(f); return ok; } }
            fclose(f); fprintf(stderr,"UNMAPPED %p\n",p); return 0;
          }
          int main(void) {
            void *h=dlopen("libGL.so.1",RTLD_NOW|RTLD_LOCAL); if(!h){fprintf(stderr,"DLOPEN_FAIL %s\n",dlerror());return 2;}
            GLXGET get=(GLXGET)dlsym(h,"glXGetProcAddress"); if(!get)return 3;
            GLGETERROR p=(GLGETERROR)get((const unsigned char*)"glGetError"); if(!p)return 4;
            unsigned e=p(); fprintf(stderr,"BEFORE_CLOSE get=%p H=%p error=%u\n",(void*)get,(void*)p,e); if(e)return 5;
            if(map_path((void*)get,"/usr/lib/x86_64-linux-gnu/libGL.so.1")!=1)return 6;
            if(dlclose(h))return 7;
            int after=map_path((void*)get,"/usr/lib/x86_64-linux-gnu/libGL.so.1");
            fprintf(stderr,"AFTER_CLOSE wrapper_mapped=%d\n",after);
            return after==0 ? 0 : 20;
          }
          EOF
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror /tmp/glstock.c -ldl -o "$ROOTFS/opt/fex-ci/glstock"

      - name: Execute stock physical-unload control
        shell: bash
        run: |
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$H" timeout 30s build/Bin/FEX /opt/fex-ci/glstock \
            > "$R/probe.out" 2> "$R/probe.err"
          rc=$?
          set -e
          echo "$rc" | tee "$R/probe.exit"
          cat "$R/probe.err"
          # rc=0 means stock wrapper physically disappeared; rc=20 means it remained mapped.
          test "$rc" -eq 0 -o "$rc" -eq 20

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-stock-unload-control-${{ github.run_id }}
          path: receipts-gl-stock
          retention-days: 30
