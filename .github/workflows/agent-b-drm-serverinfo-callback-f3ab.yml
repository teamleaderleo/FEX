name: Agent B DRM retained callback moved-reload lifetime

on:
  push:
    branches: [ci/agent-b-drm-serverinfo-bridge-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PRODUCT_SHA: f3ab82a73fb48271ee12a882c98bc5d823a2b4d1
      ROOTFS: ${{ github.workspace }}/rootfs-amd64
      R: ${{ github.workspace }}/receipts
      HOST: ${{ github.workspace }}/host-thunks
      FEX_PORTABLE: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 7

      - name: Dependencies and provenance
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R" "$HOST"
          git log --oneline -7 | tee "$R/lineage.txt"
          git diff --name-only "$PRODUCT_SHA" -- ThunkLibs FEXCore Source | tee "$R/pre-patch-product-source-diff.txt"
          test ! -s "$R/pre-patch-product-source-diff.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 lld-18 libclang-18-dev llvm-18-dev pkg-config \
            gcc-x86-64-linux-gnu g++-x86-64-linux-gnu libcap-dev libdrm-dev libgl-dev

      - name: Native retained-callback precondition
        shell: bash
        run: |
          set -uxo pipefail
          cc -O2 -Wall -Wextra -Werror -I/usr/include/libdrm \
            LinuxFieldwork/drm_serverinfo_callback_probe.c -ldl -o "$R/native-probe"
          set +e
          "$R/native-probe" > "$R/native.stdout" 2> "$R/native.stderr"
          rc=$?
          set -e
          echo "$rc" > "$R/native.exit"
          cat "$R/native.stderr"
          if [ "$rc" -eq 77 ]; then
            echo 'supported=no' >> "$GITHUB_ENV"
          else
            test "$rc" = 0
            grep -q 'DRM_SERVER_CALLBACK count=1' "$R/native.stderr"
            grep -q 'MARK open-return fd=-1 callbacks=1' "$R/native.stderr"
            echo 'supported=yes' >> "$GITHUB_ENV"
          fi

      - name: Apply persistent load_module bridge diagnostic
        if: env.supported == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          python3 LinuxFieldwork/apply_drm_serverinfo_callback_bridge.py
          git diff --check
          git diff -- ThunkLibs/libdrm/libdrm_interface.cpp ThunkLibs/libdrm/Guest.cpp ThunkLibs/libdrm/Host.cpp | tee "$R/drm-serverinfo-bridge.diff"
          test "$(git diff --name-only -- ThunkLibs FEXCore Source | sort | tr '\n' ' ')" = 'ThunkLibs/libdrm/Guest.cpp ThunkLibs/libdrm/Host.cpp ThunkLibs/libdrm/libdrm_interface.cpp '

      - name: Build converted unloadable DRM wrapper
        if: env.supported == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_LINKER=lld \
            -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=ON -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=ON -DBUILD_FEXCONFIG=OFF -DRANGES_NATIVE=OFF \
            -DTUNE_CPU=none -DX86_DEV_ROOTFS=/ > "$R/cmake-host.log" 2>&1
          cmake --build build --target FEX FEXServer drm-host-64 -- -j"$(nproc)" -v > "$R/build-host.log" 2>&1 || { tail -n 200 "$R/build-host.log"; exit 1; }
          cp build/HostLibs_64/libdrm-host.so "$HOST/libdrm-host.so"
          cmake -S ThunkLibs/GuestLibs -B guest-build -G Ninja \
            -DBITNESS=64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/Data/CMake/toolchain_x86_64.cmake" \
            -DFEX_PROJECT_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DGENERATOR_EXE="$GITHUB_WORKSPACE/build/Bin/thunkgen" -DX86_DEV_ROOTFS=/ > "$R/cmake-guest.log" 2>&1
          cmake --build guest-build --target drm-guest -- -j"$(nproc)" -v > "$R/build-guest.log" 2>&1 || { tail -n 200 "$R/build-guest.log"; exit 1; }
          readelf -d guest-build/libdrm-guest.so | tee "$R/guest-dynamic.txt"
          ! grep -q NODELETE "$R/guest-dynamic.txt"

      - name: Prepare amd64 rootfs and moved-reload probe
        if: env.supported == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform=linux/amd64 ubuntu:24.04 > "$R/rootfs.log" 2>&1
          cid="$(docker create --platform=linux/amd64 ubuntu:24.04 /bin/true)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$ROOTFS"
          docker export "$cid" | tar -C "$ROOTFS" -xf -
          docker rm "$cid"
          trap - EXIT
          mkdir -p "$ROOTFS/usr/lib/x86_64-linux-gnu" "$ROOTFS/opt/fex-ci"
          cp guest-build/libdrm-guest.so "$ROOTFS/usr/lib/x86_64-linux-gnu/libdrm.so.2"
          cp -a /usr/x86_64-linux-gnu/lib/libstdc++.so.6* "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          cp -a /usr/x86_64-linux-gnu/lib/libgcc_s.so.1 "$ROOTFS/usr/lib/x86_64-linux-gnu/" || true
          x86_64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -I/usr/include/libdrm \
            LinuxFieldwork/drm_serverinfo_moved_reload_probe.c -ldl \
            -o "$ROOTFS/opt/fex-ci/drm-server-moved-probe"

      - name: Execute retained callback after forced moved wrapper reload
        if: env.supported == 'yes'
        shell: bash
        run: |
          set -uxo pipefail
          set +e
          FEX_ROOTFS="$ROOTFS" FEX_THUNKHOSTLIBS="$HOST" timeout 30s \
            "$GITHUB_WORKSPACE/build/Bin/FEX" /opt/fex-ci/drm-server-moved-probe \
            > "$R/moved.stdout" 2> "$R/moved.stderr"
          moved_rc=$?
          set -e
          echo "$moved_rc" > "$R/moved.exit"
          printf 'native_precondition=%s\nconverted_loaded_reference=0\nmoved_reload=%s\n' "$(cat "$R/native.exit")" "$moved_rc" | tee "$R/final-matrix.txt"
          cat "$R/moved.stderr"

          # This lane is evidentiary even when the stale unpacker crashes. Require the
          # lifecycle fixture itself to have completed: physical unload and moved gen2.
          grep -q 'MARK close1-return old_set_mapped=0' "$R/moved.stderr"
          grep -q 'GEN2 .* moved=1' "$R/moved.stderr"
          grep -q 'MARK open2-enter retained-registration-only' "$R/moved.stderr"

          # Passing all the way through would falsify the expected wrapper-owned-unpacker hazard.
          if [ "$moved_rc" -eq 0 ]; then
            grep -q 'DRM_SERVER_CALLBACK count=1' "$R/moved.stderr"
            grep -q 'MARK open2-return fd=-1 callbacks=1' "$R/moved.stderr"
            echo 'OUTCOME=retained_callback_survived_physical_moved_reload' | tee -a "$R/final-matrix.txt"
          else
            test "$moved_rc" -ne 77
            test "$moved_rc" -ne 78
            ! grep -q 'DRM_SERVER_CALLBACK count=1' "$R/moved.stderr"
            ! grep -q 'MARK open2-return' "$R/moved.stderr"
            echo 'OUTCOME=retained_callback_failed_after_physical_moved_reload' | tee -a "$R/final-matrix.txt"
          fi

      - name: Record unavailable control
        if: env.supported != 'yes'
        shell: bash
        run: echo 'Hosted runner has DRM available; retained load_module path not deterministic in this lane.' | tee "$R/final-matrix.txt"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-drm-serverinfo-moved-reload-${{ github.run_id }}
          path: receipts
          retention-days: 30
