name: Agent C amend native-first lookup comment

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths:
      - .github/workflows/agent-c-materialize-minimal-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vulkan-callback-proc-routing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment and amend second commit
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          old = '''    // If this function belongs to an instance extension, requery its address.
              // This ensures fexldr_ptr_* is valid if the application creates a minimal
              // VkInstance with no extensions before creating its actual instance.'''
          new = '''    // If this function belongs to an instance extension, populate its loader
              // slot from the successful native lookup. This keeps fexldr_ptr_* valid if
              // the application creates a minimal VkInstance before its actual instance.'''
          # YAML removes six common spaces from both literals.
          if s.count(old) != 1:
              raise SystemExit(f'expected one old comment, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/libvulkan/Host.cpp
          git config user.name 'Agent C internal fieldwork'
          git config user.email 'actions@users.noreply.github.com'
          git add ThunkLibs/libvulkan/Host.cpp
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/vulkan-callback-proc-routing
