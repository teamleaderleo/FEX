name: Agent C amend minimal callback routing fix

on:
  push:
    branches: [ci/agent-c-vulkan-load-sigill-20260814]
    paths:
      - .github/workflows/agent-c-materialize-minimal-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vulkan-callback-proc-routing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix source indentation and amend commit
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ThunkLibs/libvulkan/Host.cpp')
          s = p.read_text()
          bad = '''  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {
          return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;
          } else if (a_1 == "vkDestroyDebugReportCallbackEXT"sv) {
          return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkDestroyDebugReportCallbackEXT;
          } else if (a_1 == "vkCreateDebugUtilsMessengerEXT"sv) {
          return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugUtilsMessengerEXT;
          } else if (a_1 == "vkAcquireXlibDisplayEXT"sv) {'''
          # YAML removes the common block indentation above, yielding exactly the malformed source block.
          good = '''  } else if (a_1 == "vkCreateDebugReportCallbackEXT"sv) {
              return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugReportCallbackEXT;
            } else if (a_1 == "vkDestroyDebugReportCallbackEXT"sv) {
              return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkDestroyDebugReportCallbackEXT;
            } else if (a_1 == "vkCreateDebugUtilsMessengerEXT"sv) {
              return (PFN_vkVoidFunction)fexfn_impl_libvulkan_vkCreateDebugUtilsMessengerEXT;
            } else if (a_1 == "vkAcquireXlibDisplayEXT"sv) {'''
          if s.count(bad) != 1:
              raise SystemExit(f'expected one malformed callback block, found {s.count(bad)}')
          p.write_text(s.replace(bad, good, 1))
          PY
          git diff --check
          git diff -- ThunkLibs/libvulkan/Host.cpp
          git config user.name 'Agent C internal fieldwork'
          git config user.email 'actions@users.noreply.github.com'
          git add ThunkLibs/libvulkan/Host.cpp
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/vulkan-callback-proc-routing
