name: amd64 vulkaninfo debootstrap smoke

on:
  push:
    branches: [ci/thunk-callback-descriptor-20260814]
    paths:
      - .github/workflows/amd64-vulkaninfo-debootstrap-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install debootstrap
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap ubuntu-keyring file
      - name: Foreign first-stage amd64 extraction only
        run: |
          set -euxo pipefail
          sudo rm -rf /tmp/rootfs-amd64
          sudo debootstrap \
            --foreign \
            --arch=amd64 \
            --variant=minbase \
            --include=vulkan-tools,libx11-6,ca-certificates \
            --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg \
            noble /tmp/rootfs-amd64 http://archive.ubuntu.com/ubuntu
          file /tmp/rootfs-amd64/usr/bin/vulkaninfo
          test -x /tmp/rootfs-amd64/usr/bin/vulkaninfo
          test -x /tmp/rootfs-amd64/lib64/ld-linux-x86-64.so.2 -o -x /tmp/rootfs-amd64/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          ls -l /tmp/rootfs-amd64/usr/bin/vulkaninfo
          find /tmp/rootfs-amd64/usr/lib/x86_64-linux-gnu -maxdepth 1 \( -name 'libX11.so.6*' -o -name 'libvulkan.so.1*' \) -print | sort
